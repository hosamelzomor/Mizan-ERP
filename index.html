/* ---------- column mapping / import parsing ---------- */
const FIELD_ALIASES = {
  entry:      ['رقمالقيد','عدد'],
  date:       ['التاريخ'],
  account:    ['حرئيسي','الحساب'],
  currency:   ['العمله','العملة'],
  partner:    ['العميل/المورد','الشريك'],
  debit:      ['مدينج.م.','المدين'],
  credit:     ['دائنج.م.','الدائن'],
  desc:       ['وصفالقيد','الرقمالمرجعي'],
  costCenter: ['CostCenter','البنودالتحليلية/المشروع/الحسابالتحليلي'],
  costCenterAmt: ['CostCenterAmount','البنودالتحليلية/مبلغ'],
  product:    ['المنتج'],
  journal:    ['دفتراليومية'],
  curAmt:     ['المبلغبالعملة'],
};
const FIELD_LABELS = {
  entry:'رقم القيد', date:'التاريخ', account:'الحساب', currency:'العملة', partner:'العميل/المورد',
  debit:'مدين', credit:'دائن', desc:'الوصف/المرجع', costCenter:'مركز التكلفة', costCenterAmt:'مبلغ مركز التكلفة',
  product:'المنتج', journal:'دفتر اليومية', curAmt:'المبلغ بالعملة'
};

function detectMapping(headers){
  const normMap = {};
  headers.forEach(h => { if(h!=null) normMap[normalize(h)] = h; });
  const mapping = {};
  for(const field in FIELD_ALIASES){
    for(const alias of FIELD_ALIASES[field]){
      const key = normalize(alias);
      if(normMap[key] !== undefined){ mapping[field] = normMap[key]; break; }
    }
  }
  return mapping;
}

function buildLine(row, mapping, source, date1904){
  const rawAcc = (mapping.account!=null ? row[mapping.account] : '');
  if(rawAcc == null || rawAcc === '') return null;
  const accStr = rawAcc.toString().trim();
  const m = accStr.match(/^(\d+)\s*(.*)$/);
  const code = m ? m[1] : accStr;
  const name = m ? m[2].trim() : accStr;

  const entry = mapping.entry!=null ? (row[mapping.entry]||'').toString().trim() : '';
  const dateRaw = mapping.date!=null ? row[mapping.date] : null;
  const date = toISODate(dateRaw, date1904);
  if(!entry || !date || entry === 'الاجمالي' || entry === 'الإجمالي') return null;

  const debit = mapping.debit!=null ? toNum(row[mapping.debit]) : 0;
  const credit = mapping.credit!=null ? toNum(row[mapping.credit]) : 0;

  return {
    entry, date, code, name,
    cur: mapping.currency!=null ? (row[mapping.currency]||'').toString().trim() : '',
    partner: mapping.partner!=null ? (row[mapping.partner]||'').toString().trim() : '',
    debit, credit,
    cc: mapping.costCenter!=null ? (row[mapping.costCenter]||'').toString().trim() : '',
    ccAmt: mapping.costCenterAmt!=null ? toNum(row[mapping.costCenterAmt]) : 0,
    product: mapping.product!=null ? (row[mapping.product]||'').toString().trim() : '',
    journal: mapping.journal!=null ? (row[mapping.journal]||'').toString().trim() : '',
    curAmt: mapping.curAmt!=null ? toNum(row[mapping.curAmt]) : (debit || -credit),
    ref: mapping.desc!=null ? (row[mapping.desc]||'').toString().trim() : '',
    source
  };
}
// A voucher (entry) can legitimately contain several rows that are otherwise
// identical (e.g. the same bank fee posted twice in one entry) — those are NOT
// duplicates and must never be dropped by key collision alone. lineKey() gives
// the base identity of a row; mergeJournalImport() uses occurrence-counting
// (a multiset) on top of this key so repeated legitimate rows are preserved
// while true re-imports of the same rows are still correctly recognized.
function lineKey(l){ return [l.entry,l.date,l.code,l.debit.toFixed(2),l.credit.toFixed(2),l.partner||'',l.cc||'',l.ref||''].join('|'); }

/* ---------- currency display helpers ----------
   The ledger (debit/credit) is always kept in EGP (functional currency) — this
   is what all financial statements, ratios and totals are computed from, and
   is what guarantees the books balance. "curAmt" holds the amount as recorded
   in the line's original currency (cur). The currency toggle only changes how
   individual transaction rows are *displayed*; it never changes the underlying
   EGP ledger used for aggregated statements.

   Year-end FX-revaluation entries (journal "الفرق في سعر الصرف") exist ONLY to
   correct the EGP-equivalent book value of a foreign-currency account against
   the year-end rate — by definition they must NEVER change the real foreign-
   currency balance. In the source data their "curAmt" field is unreliable for
   this purpose (it sometimes just mirrors the EGP amount), so including them
   in the native-currency calculation corrupts it. They are therefore excluded
   from every native-currency (foreign-currency) computation everywhere in the
   app, while still fully counted in the EGP ledger as they should be. */
const FX_ADJUSTMENT_JOURNAL_NAMES = ['الفرق في سعر الصرف'];
function isFxAdjustmentLine(l){ return FX_ADJUSTMENT_JOURNAL_NAMES.includes((l.journal||'').trim()); }
// Requirement: journal/book names (دفتر اليومية) come straight from the
// imported data as free text, so they show up untranslated wherever the
// journal filter lists them. Provide known translations for display only —
// the underlying value used for matching/filtering always stays the
// original imported string, so filtering behavior never changes.
const JOURNAL_NAME_TRANSLATIONS = {
  'الفرق في سعر الصرف': 'Difference in exchange rate',
  'القيد الختامي': 'Closing Entry',
  'اهلاك الاصول': 'Depreciation',
  'إهلاك الأصول': 'Depreciation',
  'عمليات متنوعة': 'Miscellaneous',
  'فواتير العملاء': 'Customer Invoices',
  'فواتير الموردين': 'Supplier Invoices',
};
function journalDisplayName(name){
  if(STATE.settings.lang === 'en' && JOURNAL_NAME_TRANSLATIONS[name]) return JOURNAL_NAME_TRANSLATIONS[name];
  return name;
}
function lineNative(l){
  if(isFxAdjustmentLine(l)) return { debit: 0, credit: 0 };
  const amt = l.curAmt || 0;
  return amt >= 0 ? { debit: amt, credit: 0 } : { debit: 0, credit: -amt };
}
function rowAmounts(l, mode){
  if(mode === 'NATIVE') return lineNative(l);
  return { debit: l.debit, credit: l.credit };
}
function rowCurrencyLabel(l, mode){ return mode === 'NATIVE' ? (l.cur || 'EGP') : 'EGP'; }

/* ---------- accounting calculations ---------- */

// Returns map code -> {code,name,type,opening,debit,credit,closing}
function computeBalances(lines, endDate, startDate){
  const map = {};
  // BUG FIX: account names shown in Trial Balance / Financial Statements /
  // Cash Flow / Liquidity / FX Revaluation were staying in Arabic even after
  // switching the dashboard to English and re-uploading accounts with
  // English names. Root cause: this map cached the raw a.name (always
  // Arabic) once per computeBalances() call instead of resolving through the
  // language-aware accName() — so every page built on top of this map
  // inherited the stale Arabic name regardless of STATE.settings.lang.
  // computeBalances() reruns on every render, so resolving via accName()
  // here now picks up the current language (and current nameEn) every time.
  STATE.accounts.forEach(a => map[a.code] = {code:a.code, name:accName(a.code), type:a.type, opening:0, debit:0, credit:0, closing:0});
  for(const l of lines){
    if(!map[l.code]) map[l.code] = {code:l.code, name:accName(l.code) || l.name || l.code, type: accType(l.code) || '', opening:0, debit:0, credit:0, closing:0};
    const rec = map[l.code];
    if(startDate && l.date < startDate){ rec.opening += (l.debit - l.credit); continue; }
    if(endDate && l.date > endDate) continue;
    rec.debit += l.debit; rec.credit += l.credit;
  }
  for(const code in map){ const r = map[code]; r.closing = r.opening + r.debit - r.credit; }
  return map;
}

function sectionSum(balMap, types){
  let s = 0;
  for(const code in balMap){ if(types.includes(balMap[code].type)) s += balMap[code].closing; }
  return s;
}
// Period-only movement (debit-credit within the selected range), ignoring any
// carried-forward opening balance. Income-statement accounts are nominal/temporary,
// so a period figure must never include activity from before the period start —
// using .closing (opening+movement) here would silently accumulate every prior
// period's revenue/expense forever since closing entries are excluded from IS calcs.
function sectionMovement(balMap, types){
  let s = 0;
  for(const code in balMap){ if(types.includes(balMap[code].type)) s += (balMap[code].debit - balMap[code].credit); }
  return s;
}

// Cash & bank position (liquidity) — accounts of type 'البنك والنقد'
function liquidityPosition(lines, end, start){
  const bal = computeBalances(lines, end, start);
  let rows = Object.values(bal).filter(r => r.type === 'البنك والنقد')
    .sort((a,b)=> a.code.localeCompare(b.code));
  rows = rows.map(r => {
    const currency = (STATE.accountsByCode[r.code]||{}).currency || 'EGP';
    if(currency === 'EGP') return {...r, currency, nativeBalance:null};
    const codeLines = lines.filter(l => l.code === r.code && (!end || l.date <= end));
    const nativeBalance = codeLines.reduce((s,l)=>{ const n = lineNative(l); return s + n.debit - n.credit; }, 0);
    return {...r, currency, nativeBalance};
  });
  const total = rows.reduce((s,r)=> s + r.closing, 0);
  const inflow = rows.reduce((s,r)=> s + r.debit, 0);
  const outflow = rows.reduce((s,r)=> s + r.credit, 0);
  const nativeTotals = {};
  rows.forEach(r => { if(r.nativeBalance != null){ nativeTotals[r.currency] = (nativeTotals[r.currency]||0) + r.nativeBalance; } });
  return { rows, total, inflow, outflow, nativeTotals };
}

// Trial-balance rows with currency-aware display (native mode groups accounts by their own currency)
function trialBalanceRows(lines, end, start, mode){
  const bal = computeBalances(lines, end, start); // always EGP internally (correct ledger)
  let rows = Object.values(bal).filter(r => r.opening!==0 || r.debit!==0 || r.credit!==0 || r.closing!==0);
  rows = rows.map(r => ({...r, currency: (STATE.accountsByCode[r.code]||{}).currency || 'EGP'}));
  if(mode !== 'NATIVE'){
    rows.sort((a,b)=> a.code.localeCompare(b.code));
    return { groups: [{ currency:'EGP', rows, totals: sumRows(rows) }], mixedCurrencies:false };
  }
  // native mode: recompute per-account using native curAmt for accounts whose declared currency isn't EGP
  const byCur = {};
  rows.forEach(r => { (byCur[r.currency] = byCur[r.currency] || []).push(r); });
  const groups = Object.keys(byCur).sort().map(cur => {
    let grpRows = byCur[cur];
    if(cur !== 'EGP'){
      grpRows = grpRows.map(r => {
        const codeLines = lines.filter(l => l.code === r.code);
        const openingN = codeLines.filter(l => start && l.date < start).reduce((s,l)=>{const a=lineNative(l); return s+a.debit-a.credit;},0);
        const periodLines = codeLines.filter(l => (!start||l.date>=start) && (!end||l.date<=end));
        const debitN = periodLines.reduce((s,l)=> s + lineNative(l).debit, 0);
        const creditN = periodLines.reduce((s,l)=> s + lineNative(l).credit, 0);
        return {...r, opening:openingN, debit:debitN, credit:creditN, closing:openingN+debitN-creditN};
      });
    }
    grpRows.sort((a,b)=> a.code.localeCompare(b.code));
    return { currency:cur, rows:grpRows, totals: sumRows(grpRows) };
  });
  return { groups, mixedCurrencies: groups.length > 1 };
}
function sumRows(rows){ return rows.reduce((t,r)=>({opening:t.opening+r.opening, debit:t.debit+r.debit, credit:t.credit+r.credit, closing:t.closing+r.closing}), {opening:0,debit:0,credit:0,closing:0}); }

// FX revaluation: for every non-EGP account, compare its EGP book balance to
// (native currency balance × the rate the user enters for today), and derive
// the adjusting entry needed to recognise the unrealised FX gain/loss.
// Only these specific accounts are relevant for the year-end FX revaluation
// entry in this company's chart of accounts (per explicit instruction).
const FX_REVALUATION_ACCOUNT_CODES = ['111102','111202','111204','112201','211401','320002','320004','320005'];

function fxRevaluation(lines, asOf, rates){
  const bal = computeBalances(lines, asOf, null); // cumulative EGP book balance per account, as of date
  const rows = [];
  STATE.accounts.forEach(a => {
    if(!FX_REVALUATION_ACCOUNT_CODES.includes(a.code)) return;
    if(!a.currency || a.currency === 'EGP') return;
    const codeLines = lines.filter(l => l.code === a.code && l.date <= asOf);
    const nativeBalance = codeLines.reduce((s,l)=>{ const n = lineNative(l); return s + n.debit - n.credit; }, 0);
    const egpBook = (bal[a.code] || {closing:0}).closing;
    if(Math.abs(nativeBalance) < 0.01 && Math.abs(egpBook) < 0.01) return;
    const rate = rates[a.currency] || 0;
    const hasMeaningfulNative = Math.abs(nativeBalance) >= 0.01;
    const hasMeaningfulEgp = Math.abs(egpBook) >= 0.01;
    let impliedRate = null, anomaly = false;
    if(hasMeaningfulNative){
      impliedRate = egpBook / nativeBalance;
      // A plausible EGP/USD implied historical rate for this dataset's
      // timeframe is roughly 5–100; anything outside that signals the EGP
      // book value wasn't tracked consistently for that account.
      anomaly = impliedRate <= 0 || impliedRate < 5 || impliedRate > 100;
    }
    // BUG FIX: a near-zero NATIVE balance with a real EGP book balance is NOT
    // bad data — it's the ordinary case of an account that's fully cleared
    // out in its own currency (e.g. every dollar deposited was eventually
    // withdrawn) but still carries a leftover EGP amount, because each of
    // those native-currency movements was booked at a different historical
    // rate. The correctly revalued EGP balance for a ~0 native balance is
    // always ~0 too — 0 × any rate is 0 — regardless of today's entered
    // rate, so this is fully computable with no rate needed at all: the
    // entire remaining EGP balance IS the accumulated FX gain/loss to sweep.
    // This was previously (and wrongly) flagged as "anomaly", which silently
    // excluded the account from the suggested entry even though its book
    // showed a perfectly real, correctly-EGP-recorded balance.
    const revaluedEGP = hasMeaningfulNative ? (rate ? nativeBalance * rate : egpBook) : 0;
    const diff = revaluedEGP - egpBook;
    rows.push({ code:a.code, name:accName(a.code), currency:a.currency, nativeBalance, egpBook, impliedRate, rate, revaluedEGP, diff, anomaly });
  });
  rows.sort((a,b)=> a.currency===b.currency ? a.code.localeCompare(b.code) : a.currency.localeCompare(b.currency));
  const totalDiff = rows.reduce((s,r)=> s + r.diff, 0);
  return { rows, totalDiff };
}

const CLOSING_JOURNAL_NAMES = ['القيد الختامي'];
function isClosingLine(l){ return CLOSING_JOURNAL_NAMES.includes((l.journal||'').trim()); }

function incomeStatement(lines, start, end){
  const activityLines = lines.filter(l => !isClosingLine(l));
  const bal = computeBalances(activityLines, end, start);
  const revenue = -sectionMovement(bal, ['الدخل']);       // credit-normal -> flip sign for display
  const otherIncome = -sectionMovement(bal, ['دخل آخر']);
  const cogs = sectionMovement(bal, ['تكاليف الإيرادات']);
  const expenses = sectionMovement(bal, ['النفقات']);
  const depreciation = sectionMovement(bal, ['إهلاك']);
  const grossProfit = revenue - cogs;
  const operatingIncome = grossProfit - expenses - depreciation;
  const netIncome = operatingIncome + otherIncome;
  return { start, end, revenue, otherIncome, cogs, grossProfit, expenses, depreciation, operatingIncome, netIncome, balMap: bal };
}

function balanceSheet(lines, asOf){
  const bal = computeBalances(lines, asOf, null);
  const assets = sectionSum(bal, [...BS_SECTIONS[0].types, ...BS_SECTIONS[1].types]);
  const liabRaw = sectionSum(bal, [...LIAB_SECTIONS[0].types, ...LIAB_SECTIONS[1].types]);
  const eqRaw = sectionSum(bal, EQ_SECTIONS[0].types);
  const isRaw = sectionSum(bal, ['الدخل','دخل آخر','تكاليف الإيرادات','النفقات','إهلاك']);
  const liabilities = -liabRaw;
  const equityRecorded = -eqRaw;
  const netIncomeToDate = -isRaw;
  const equityTotal = equityRecorded + netIncomeToDate;
  return { asOf, assets, liabilities, equityRecorded, netIncomeToDate, equityTotal, balMap: bal,
    currentAssets: sectionSum(bal, BS_SECTIONS[0].types),
    fixedAssets: sectionSum(bal, BS_SECTIONS[1].types),
    currentLiab: -sectionSum(bal, LIAB_SECTIONS[0].types),
    nonCurrentLiab: -sectionSum(bal, LIAB_SECTIONS[1].types),
    quickAssets: sectionSum(bal, ['البنك والنقد','المدين']),
    cash: sectionSum(bal, ['البنك والنقد']),
    receivables: sectionSum(bal, ['المدين']),
    payables: -sectionSum(bal, ['الدائن']),
  };
}

function ratios(is, bs){
  const r = {};
  r.currentRatio = bs.currentLiab !== 0 ? bs.currentAssets / bs.currentLiab : null;
  r.quickRatio = bs.currentLiab !== 0 ? bs.quickAssets / bs.currentLiab : null;
  r.cashRatio = bs.currentLiab !== 0 ? bs.cash / bs.currentLiab : null;
  r.debtRatio = bs.assets !== 0 ? bs.liabilities / bs.assets : null;
  r.debtToEquity = bs.equityTotal !== 0 ? bs.liabilities / bs.equityTotal : null;
  r.grossMargin = is.revenue !== 0 ? (is.grossProfit / is.revenue) * 100 : null;
  r.netMargin = is.revenue !== 0 ? (is.netIncome / is.revenue) * 100 : null;
  r.operatingMargin = is.revenue !== 0 ? (is.operatingIncome / is.revenue) * 100 : null;
  r.roa = bs.assets !== 0 ? (is.netIncome / bs.assets) * 100 : null;
  r.roe = bs.equityTotal !== 0 ? (is.netIncome / bs.equityTotal) * 100 : null;
  r.workingCapital = bs.currentAssets - bs.currentLiab;
  // Receivable / Payable turnover & days-outstanding. This chart of accounts
  // has no inventory accounts (a services/tech business), so Inventory
  // Turnover is intentionally omitted — showing it would just be a
  // meaningless zero. Cash Conversion Cycle is approximated as
  // Receivable Days − Payable Days (no Inventory Days term) for the same
  // reason; this is noted in the UI wherever the figure appears.
  r.receivableTurnover = bs.receivables > 0 ? (is.revenue + is.otherIncome) / bs.receivables : null;
  r.receivableDays = r.receivableTurnover ? 365 / r.receivableTurnover : null;
  r.payableTurnover = bs.payables > 0 ? (is.cogs + is.expenses) / bs.payables : null;
  r.payableDays = r.payableTurnover ? 365 / r.payableTurnover : null;
  r.cashConversionCycle = (r.receivableDays!=null && r.payableDays!=null) ? (r.receivableDays - r.payableDays) : null;
  return r;
}

// Indirect-method Cash Flow Statement. Every balance-sheet account type is
// routed into exactly one bucket (operating working-capital, investing,
// financing) or intentionally left out because its effect is already
// captured elsewhere (accumulated depreciation ~ offset by the depreciation
// add-back; current-year-profit equity account ~ offset by netIncome itself;
// closing entries never touch cash so they fall out naturally). This makes
// the computed net cash change reconcilable against the ACTUAL change in
// cash & bank balances — which we compute independently and show side by
// side as a built-in accuracy check.
function cashFlowStatement(lines, start, end){
  const is = incomeStatement(lines, start, end);
  const openDate = start ? addDaysISO(start, -1) : '1900-01-01';
  const balOpen = computeBalances(lines, openDate, null);
  const balClose = computeBalances(lines, end, null);
  // Some charts of accounts book retained earnings/P&L closures into the same
  // account type as paid-in capital (e.g. "رأس المال"). Any account that the
  // year-end closing entry posts to is, by definition, moved by a non-cash
  // reclassification already captured via netIncome — so it must never also
  // be counted as a financing cash flow. Detected dynamically (not hardcoded).
  const closingTouchedCodes = new Set(lines.filter(isClosingLine).map(l => l.code));
  function rawDelta(types, excludeCodes){
    let openS = 0, closeS = 0;
    for(const c in balOpen){ if(types.includes(balOpen[c].type) && !(excludeCodes&&excludeCodes.has(c))) openS += balOpen[c].closing; }
    for(const c in balClose){ if(types.includes(balClose[c].type) && !(excludeCodes&&excludeCodes.has(c))) closeS += balClose[c].closing; }
    return closeS - openS;
  }
  // Per-account version of rawDelta, sign-matched to the aggregate (which is
  // always -rawDelta(...)), so each bucket can be expanded/collapsed to show
  // exactly which accounts drove it — same UX as the Income Statement's (+/-)
  // drill rows.
  function deltaAccountsList(types, excludeCodes){
    const codes = new Set();
    for(const c in balOpen){ if(types.includes(balOpen[c].type) && !(excludeCodes&&excludeCodes.has(c))) codes.add(c); }
    for(const c in balClose){ if(types.includes(balClose[c].type) && !(excludeCodes&&excludeCodes.has(c))) codes.add(c); }
    const rows = [];
    codes.forEach(c => {
      const openV = balOpen[c] ? balOpen[c].closing : 0;
      const closeV = balClose[c] ? balClose[c].closing : 0;
      const delta = -(closeV - openV);
      if(delta !== 0) rows.push({ code:c, name:(balClose[c]||balOpen[c]).name, delta });
    });
    rows.sort((a,b)=>a.code.localeCompare(b.code));
    return rows;
  }
  const recvChange = -rawDelta(['المدين']);
  const otherCAChange = -rawDelta(['الأصول المتداولة']);
  const payablesChange = -rawDelta(['الدائن','الالتزامات الجارية']);
  const recvAccounts = deltaAccountsList(['المدين']);
  const otherCAAccounts = deltaAccountsList(['الأصول المتداولة']);
  const payablesAccounts = deltaAccountsList(['الدائن','الالتزامات الجارية']);
  const wcCashImpact = recvChange + otherCAChange + payablesChange;
  const operating = is.netIncome + is.depreciation + wcCashImpact;

  const investing = -rawDelta(['أصول ثابتة']);
  const investingAccounts = deltaAccountsList(['أصول ثابتة']);

  const financing = -rawDelta(['رأس المال','الالتزامات غير الجارية'], closingTouchedCodes);
  const financingAccounts = deltaAccountsList(['رأس المال','الالتزامات غير الجارية'], closingTouchedCodes);

  const netChange = operating + investing + financing;
  const cashDelta = rawDelta(['البنك والنقد']); // actual observed change in cash & bank balances
  const diff = netChange - cashDelta;

  // IAS 7 closing reconciliation: Beginning cash + Net increase/decrease =
  // Ending cash. Both the beginning and the "actual" ending balance are read
  // directly from the ledger (never hardcoded) — the computed ending balance
  // is then validated against that actual ledger ending balance, and any
  // variance is surfaced explicitly rather than silently absorbed.
  let cashBeginning = 0, cashEndingActual = 0;
  const cashBeginningAccounts = [];
  for(const c in balOpen){
    if(balOpen[c].type === 'البنك والنقد'){
      cashBeginning += balOpen[c].closing;
      if(balOpen[c].closing !== 0) cashBeginningAccounts.push({ code:c, name: balOpen[c].name, balance: balOpen[c].closing });
    }
  }
  cashBeginningAccounts.sort((a,b)=>a.code.localeCompare(b.code));
  for(const c in balClose){ if(balClose[c].type === 'البنك والنقد') cashEndingActual += balClose[c].closing; }
  const cashEndingComputed = cashBeginning + netChange;
  const endingDiff = cashEndingComputed - cashEndingActual; // should reconcile to ~0

  return {
    start, end, netIncome: is.netIncome, depreciation: is.depreciation,
    recvChange, otherCAChange, payablesChange, wcCashImpact, operating,
    recvAccounts, otherCAAccounts, payablesAccounts, investingAccounts, financingAccounts,
    investing, financing, netChange, cashDelta, diff,
    cashBeginning, cashBeginningAccounts, cashEndingActual, cashEndingComputed, endingDiff,
  };
}

// Rule-based financial analysis, grounded entirely in the computed figures for
// the selected period (no free-text generation / no hallucinated numbers).
// Compares the selected period against the immediately preceding period of
// equal length to talk about trend direction where possible.
/* =========================================================================
   AI Assistant query engine.
   IMPORTANT: this is NOT a connection to a real language model — the app has
   no server/API backend to call one from. It is a deterministic pattern-
   matching engine that recognizes common question shapes (in Arabic or
   English) and answers them by running the SAME calculation functions used
   everywhere else in the app against the real imported ledger. This keeps
   every answer traceable and accurate, at the cost of only understanding a
   known set of question patterns rather than truly open-ended language.
   ========================================================================= */
function normalizeArabic(s){
  return (s||'').toString().toLowerCase()
    .replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[\u064B-\u0652]/g,'') // strip diacritics
    .replace(/[؟?!.,]/g,' ').trim();
}
function currentMonthRange(){
  const d = new Date();
  const start = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-01`;
  const endD = new Date(d.getFullYear(), d.getMonth()+1, 0);
  const end = `${endD.getFullYear()}-${pad2(endD.getMonth()+1)}-${pad2(endD.getDate())}`;
  return {start, end};
}
function findAccountsByNameFragment(frag){
  const nf = normalizeArabic(frag);
  return STATE.accounts.filter(a => normalizeArabic(a.name).includes(nf) || a.code.includes(frag));
}
function findPartnersByNameFragment(frag){
  const nf = normalizeArabic(frag);
  const all = uniq(STATE.journal.filter(l=>l.partner).map(l=>l.partner));
  return all.filter(p => normalizeArabic(p).includes(nf));
}

function answerQuery(question){
  const q = normalizeArabic(question);
  const f = STATE.ui.filters;
  STATE.ui.chatContext = STATE.ui.chatContext || {};
  const ctx = STATE.ui.chatContext;
  if(!STATE.journal.length){
    return { text: 'لا توجد بيانات محمّلة بعد في النظام. ابدأ من صفحة "الإعداد والاستيراد" أولاً.' };
  }

  // 1) Sales / revenue this month
  if((q.includes('مبيعات') || q.includes('sales') || q.includes('ايرادات') || q.includes('revenue')) && (q.includes('شهر') || q.includes('month') || !/\d{4}/.test(q))){
    const {start,end} = currentMonthRange();
    const is = incomeStatement(STATE.journal, start, end);
    return { text: `إجمالي الإيرادات خلال الشهر الحالي (${start} إلى ${end}) هو ${fmt(is.revenue+is.otherIncome)} ج.م.`,
      action: { label:'عرض قائمة الدخل', view:'statements' } };
  }

  // 2) Biggest customer
  if((q.includes('اكبر عميل') || q.includes('اكبر العملاء') || q.includes('biggest customer') || q.includes('largest customer'))){
    const partners = partnerBalances(STATE.journal, '', f.end).filter(p=>p.balance>0);
    if(!partners.length) return { text: 'لا توجد أرصدة عملاء مدينة حالياً.' };
    const top = partners[0];
    ctx.lastPartner = top.name;
    return { text: `أكبر عميل حالياً هو "${top.name}" برصيد مدين قدره ${fmt(top.balance)} ج.م.`,
      action: { label:'عرض كشف حسابه', view:'partnerstatement', partner: top.name } };
  }

  // 2c) Top N customers / suppliers list (not just the single biggest)
  if(q.includes('اعلي العملاء') || q.includes('اكبر 5 عملاء') || q.includes('اكبر عملاء') || q.includes('top customers') || q.includes('top 5 customers')){
    const partners = partnerBalances(STATE.journal, '', f.end).filter(p=>p.balance>0).slice(0,5);
    if(!partners.length) return { text: 'لا توجد أرصدة عملاء مدينة حالياً.' };
    const txt = partners.map((p,i)=>`${i+1}. ${p.name}: ${fmt(p.balance)} ج.م`).join('، ');
    return { text: `أعلى ${partners.length} عملاء برصيد مدين: ${txt}.`, action: { label:'عرض كشف عميل/مورد', view:'partnerstatement' } };
  }
  if(q.includes('اعلي الموردين') || q.includes('اكبر 5 موردين') || q.includes('اكبر موردين') || q.includes('top suppliers') || q.includes('top 5 suppliers') || q.includes('top vendors')){
    const partners = partnerBalances(STATE.journal, '', f.end).filter(p=>p.balance<0).slice(0,5);
    if(!partners.length) return { text: 'لا توجد أرصدة موردين دائنة حالياً.' };
    const txt = partners.map((p,i)=>`${i+1}. ${p.name}: ${fmt(Math.abs(p.balance))} ج.م`).join('، ');
    return { text: `أعلى ${partners.length} موردين برصيد دائن مستحق: ${txt}.`, action: { label:'عرض كشف عميل/مورد', view:'partnerstatement' } };
  }

  // 2b) Biggest supplier — symmetric to #2, credit-balance partners
  if((q.includes('اكبر مورد') || q.includes('اكبر الموردين') || q.includes('biggest supplier') || q.includes('largest supplier') || q.includes('biggest vendor'))){
    const partners = partnerBalances(STATE.journal, '', f.end).filter(p=>p.balance<0);
    if(!partners.length) return { text: 'لا توجد أرصدة موردين دائنة حالياً.' };
    const top = partners[0];
    ctx.lastPartner = top.name;
    return { text: `أكبر مورد حالياً (من حيث الرصيد الدائن المستحق له) هو "${top.name}" برصيد قدره ${fmt(Math.abs(top.balance))} ج.م.`,
      action: { label:'عرض كشف حسابه', view:'partnerstatement', partner: top.name } };
  }

  // 3) Why did profit drop / change — also triggers on explicit period comparison requests
  if(q.includes('سبب انخفاض') || q.includes('ليه الارباح') || q.includes('لماذا انخفض') || (q.includes('why') && q.includes('profit'))
    || ((q.includes('قارن') || q.includes('مقارنه') || q.includes('compare')) && (q.includes('شهر') || q.includes('فتره') || q.includes('period') || q.includes('month')))){
    let start = f.start, end = f.end;
    if(!start){ const cm = currentMonthRange(); start = cm.start; end = end || cm.end; } // default to current month when no period is set, so "compare" always has something to compare
    const a = generateAnalysis(STATE.journal, start, end);
    if(!a.prior) return { text: 'لا يمكن مقارنة الفترة بفترة سابقة لأن الفترة المحددة مفتوحة من البداية. حدد فترة زمنية أولاً (مثلاً من أول الشهر) للمقارنة.' };
    const lines = [`صافي الربح/الخسارة تغيّر من ${fmt(a.prior.netIncome)} إلى ${fmt(a.is.netIncome)} مقارنة بالفترة السابقة المكافئة (من ${a.prior.start||'بداية النشاط'} إلى ${a.prior.end}).`, ...a.notes, ...a.weaknesses.slice(0,3)];
    return { text: lines.join(' '), action: { label:'عرض التحليل الكامل', view:'notes' } };
  }

  // 4) Bank balances
  if(q.includes('ارصده البنوك') || q.includes('ارصدة البنوك') || q.includes('bank balance') || (q.includes('بنوك') && q.includes('ارصده'))){
    const liq = liquidityPosition(STATE.journal, f.end, f.start);
    const linesTxt = liq.rows.map(r => `${r.name}: ${fmt(r.closing)} ج.م${r.nativeBalance!=null?` (${fmt(r.nativeBalance)} ${r.currency})`:''}`).join('، ');
    return { text: `أرصدة الخزائن والبنوك كما في ${f.end||todayISO()}: ${linesTxt}. الإجمالي: ${fmt(liq.total)} ج.م.`,
      action: { label:'عرض صفحة السيولة', view:'liquidity' } };
  }

  // 5) "كام رصيد جاري X" or specific partner/account balance
  const jariMatch = question.match(/جاري\s+([\u0600-\u06FF\s]+)/);
  if(jariMatch){
    const frag = 'جاري ' + jariMatch[1].trim();
    const accs = findAccountsByNameFragment(jariMatch[1].trim()).filter(a=>normalizeArabic(a.name).includes('جاري'));
    if(accs.length){
      const bal = computeBalances(STATE.journal, f.end||todayISO(), null);
      const parts = accs.map(a => `${accName(a.code)} (${a.code}): ${fmt((bal[a.code]||{closing:0}).closing)} ج.م`);
      ctx.lastAccountCode = accs[0].code;
      return { text: `رصيد ${parts.join('، ')}.`, action: { label:'فتح كشف الحساب', view:'accountstatement', account: accs[0].code } };
    }
  }

  // 6) Biggest expenses
  if(q.includes('اكبر المصروفات') || q.includes('اكبر مصروفات') || q.includes('biggest expenses') || q.includes('top expenses')){
    const is = incomeStatement(STATE.journal, f.start, f.end);
    const expAccs = Object.values(is.balMap).filter(r=>r.type==='النفقات' && (r.debit-r.credit)>0)
      .sort((a,b)=>(b.debit-b.credit)-(a.debit-a.credit)).slice(0,5);
    if(!expAccs.length) return { text: 'لا توجد مصروفات مسجّلة خلال الفترة المحددة.' };
    const txt = expAccs.map(r=>`${accName(r.code)}: ${fmt(r.debit-r.credit)} ج.م`).join('، ');
    return { text: `أكبر 5 بنود مصروفات خلال الفترة (${f.start||'بداية النشاط'} إلى ${f.end}): ${txt}.`,
      action: { label:'عرض قائمة الدخل', view:'statements' } };
  }

  // 7) Total USD customers
  if((q.includes('عملاء') && q.includes('دولار')) || (q.includes('customers') && q.includes('usd'))){
    const acc = STATE.accounts.find(a=>a.code==='112201') || findAccountsByNameFragment('العملاء').find(a=>a.currency==='USD');
    if(acc){
      const bal = computeBalances(STATE.journal, f.end||todayISO(), null)[acc.code] || {closing:0};
      const native = STATE.journal.filter(l=>l.code===acc.code && l.date<=(f.end||todayISO()) && !isFxAdjustmentLine(l)).reduce((s,l)=>{const n=lineNative(l);return s+n.debit-n.credit;},0);
      ctx.lastAccountCode = acc.code;
      return { text: `إجمالي رصيد حساب "${accName(acc.code)}" (${acc.code}) هو ${fmt(bal.closing)} ج.م، ويعادل ${fmt(native)} دولار أمريكي.`,
        action: { label:'فتح كشف الحساب', view:'accountstatement', account: acc.code } };
    }
  }

  // 8) Cost center / project statement — "كشف مركز تكلفة X" / "كشف مشروع X"
  const ccMatch = question.match(/(?:مركز\s*تكلفة|مشروع)\s+([\u0600-\u06FF0-9\s]+)/);
  if(ccMatch){
    const frag = normalizeArabic(ccMatch[1].trim());
    const cc = costCenterPL(STATE.journal, f.start, f.end);
    const match = frag ? cc.filter(c => normalizeArabic(c.name).includes(frag)) : [];
    if(match.length === 1){
      const c = match[0];
      ctx.lastCostCenter = c.name;
      return { text: `مركز التكلفة/المشروع "${c.name}" خلال الفترة (${f.start||'بداية النشاط'} إلى ${f.end}): الإيرادات ${fmt(c.revenue)} ج.م، التكاليف ${fmt(c.cost)} ج.م، صافي ${c.profit>=0?'ربح':'خسارة'} قدره ${fmt(Math.abs(c.profit))} ج.م.`,
        action: { label:'عرض كل مراكز التكلفة', view:'costcenters' } };
    }
    if(match.length > 1){
      const txt = match.map(c=>`${c.name}: صافي ${c.profit>=0?'ربح':'خسارة'} ${fmt(Math.abs(c.profit))} ج.م`).join('، ');
      return { text: `وجدت أكثر من مركز تكلفة/مشروع مطابق: ${txt}.`, action: { label:'عرض كل مراكز التكلفة', view:'costcenters' } };
    }
  }

  // 9) Best / worst cost center or project (analysis)
  if(q.includes('افضل مركز') || q.includes('افضل مشروع') || q.includes('اكثر مشروع ربح') || q.includes('best cost center') || q.includes('best project')){
    const cc = costCenterPL(STATE.journal, f.start, f.end);
    if(!cc.length) return { text: 'لا توجد مراكز تكلفة/مشاريع مسجّلة خلال الفترة المحددة.' };
    const best = cc[0];
    return { text: `أفضل مركز تكلفة/مشروع من حيث الربحية خلال الفترة هو "${best.name}" بصافي ${best.profit>=0?'ربح':'خسارة'} قدره ${fmt(Math.abs(best.profit))} ج.م.`,
      action: { label:'عرض كل مراكز التكلفة', view:'costcenters' } };
  }
  if(q.includes('اسوا مركز') || q.includes('اسوا مشروع') || q.includes('اكثر مشروع خسار') || q.includes('worst cost center') || q.includes('worst project')){
    const cc = costCenterPL(STATE.journal, f.start, f.end).slice().sort((a,b)=>a.profit-b.profit);
    if(!cc.length) return { text: 'لا توجد مراكز تكلفة/مشاريع مسجّلة خلال الفترة المحددة.' };
    const worst = cc[0];
    return { text: `أضعف مركز تكلفة/مشروع من حيث الربحية خلال الفترة هو "${worst.name}" بصافي ${worst.profit>=0?'ربح':'خسارة'} قدره ${fmt(Math.abs(worst.profit))} ج.م.`,
      action: { label:'عرض كل مراكز التكلفة', view:'costcenters' } };
  }

  // 10) Cash flow analysis
  if(q.includes('التدفق النقدي') || q.includes('تدفق نقدي') || q.includes('cash flow')){
    const cf = cashFlowStatement(STATE.journal, f.start, f.end);
    return { text: `خلال الفترة (${f.start||'بداية النشاط'} إلى ${f.end}): صافي التدفق النقدي التشغيلي ${fmt(cf.operating)} ج.م، الاستثماري ${fmt(cf.investing)} ج.م، التمويلي ${fmt(cf.financing)} ج.م — صافي التغير الإجمالي في النقدية ${fmt(cf.netChange)} ج.م (من ${fmt(cf.cashBeginning)} إلى ${fmt(cf.cashEndingComputed)} ج.م).`,
      action: { label:'عرض قائمة التدفقات النقدية', view:'cashflow' } };
  }

  // 11) Profit margins
  if(q.includes('هامش الربح') || q.includes('هامش صافي') || q.includes('الهامش') || q.includes('net margin') || q.includes('profit margin')){
    const is = incomeStatement(STATE.journal, f.start, f.end);
    const r = ratios(is, balanceSheet(STATE.journal, f.end||todayISO()));
    return { text: `خلال الفترة المحددة: هامش الربح الإجمالي ${r.grossMargin!=null?fmt(r.grossMargin)+'%':'غير محدد'}، هامش الربح التشغيلي ${r.operatingMargin!=null?fmt(r.operatingMargin)+'%':'غير محدد'}، هامش صافي الربح ${r.netMargin!=null?fmt(r.netMargin)+'%':'غير محدد'}.`,
      action: { label:'عرض التحليل المالي والنسب', view:'ratios' } };
  }

  // 12) Named financial ratios
  if(q.includes('نسبة التداول') || q.includes('current ratio')){
    const r = ratios(incomeStatement(STATE.journal, f.start, f.end), balanceSheet(STATE.journal, f.end||todayISO()));
    return { text: `نسبة التداول ${r.currentRatio!=null?fmt(r.currentRatio):'غير محددة'} كما في ${f.end||todayISO()} (المرجعي: 1.5 فأكثر).`, action:{label:'عرض التحليل المالي والنسب', view:'ratios'} };
  }
  if(q.includes('النسبة السريعه') || q.includes('quick ratio')){
    const r = ratios(incomeStatement(STATE.journal, f.start, f.end), balanceSheet(STATE.journal, f.end||todayISO()));
    return { text: `النسبة السريعة ${r.quickRatio!=null?fmt(r.quickRatio):'غير محددة'} كما في ${f.end||todayISO()} (المرجعي: 1 فأكثر).`, action:{label:'عرض التحليل المالي والنسب', view:'ratios'} };
  }
  if(q.includes('نسبة الدين') || q.includes('نسبة المديونيه') || q.includes('debt ratio')){
    const r = ratios(incomeStatement(STATE.journal, f.start, f.end), balanceSheet(STATE.journal, f.end||todayISO()));
    return { text: `نسبة إجمالي الدين إلى إجمالي الأصول ${r.debtRatio!=null?fmt(r.debtRatio*100)+'%':'غير محددة'} كما في ${f.end||todayISO()}.`, action:{label:'عرض التحليل المالي والنسب', view:'ratios'} };
  }

  // 13) Balance sheet totals
  if(q.includes('اجمالي الاصول') || q.includes('total assets')){
    const bs = balanceSheet(STATE.journal, f.end||todayISO());
    return { text: `إجمالي الأصول كما في ${f.end||todayISO()} هو ${fmt(bs.assets)} ج.م.`, action:{label:'عرض قائمة المركز المالي', view:'statements'} };
  }
  if(q.includes('اجمالي الالتزامات') || q.includes('total liabilities')){
    const bs = balanceSheet(STATE.journal, f.end||todayISO());
    return { text: `إجمالي الالتزامات كما في ${f.end||todayISO()} هو ${fmt(bs.liabilities)} ج.م.`, action:{label:'عرض قائمة المركز المالي', view:'statements'} };
  }
  if(q.includes('اجمالي حقوق الملكيه') || q.includes('صافي حقوق الملكيه') || q.includes('total equity')){
    const bs = balanceSheet(STATE.journal, f.end||todayISO());
    return { text: `إجمالي حقوق الملكية كما في ${f.end||todayISO()} هو ${fmt(bs.equityTotal)} ج.م.`, action:{label:'عرض قائمة المركز المالي', view:'statements'} };
  }

  // 14) Trial balance check
  if(q.includes('ميزان المراجعه') || q.includes('متوازن') || q.includes('trial balance')){
    const bal = computeBalances(STATE.journal, f.end||todayISO(), null);
    const totalDebit = Object.values(bal).reduce((s,r)=>s+r.debit,0);
    const totalCredit = Object.values(bal).reduce((s,r)=>s+r.credit,0);
    const diff = totalDebit - totalCredit;
    return { text: Math.abs(diff) < 0.01
        ? `نعم، ميزان المراجعة متوازن — إجمالي المدين وإجمالي الدائن كل منهما ${fmt(totalDebit)} ج.م كما في ${f.end||todayISO()}.`
        : `⚠️ ميزان المراجعة غير متوازن! إجمالي المدين ${fmt(totalDebit)} ج.م، وإجمالي الدائن ${fmt(totalCredit)} ج.م، بفارق ${fmt(Math.abs(diff))} ج.م. راجع القيود المستوردة.`,
      action: { label:'عرض ميزان المراجعة', view:'trialbalance' } };
  }

  // 15) Duplicate entries check — same entry number, date, account, and amounts
  if(q.includes('قيود مكرره') || q.includes('حركات مكرره') || q.includes('مكرر') || q.includes('duplicate')){
    const seen = {};
    STATE.journal.forEach(l => { const k = lineKey(l); seen[k] = (seen[k]||0) + 1; });
    const dupGroups = Object.entries(seen).filter(([,c]) => c > 1);
    if(!dupGroups.length) return { text: 'لم أجد أي أسطر قيد مكررة تماماً (نفس رقم القيد والتاريخ والحساب والمبلغ) في البيانات المحمّلة حالياً.' };
    const totalDupLines = dupGroups.reduce((s,[,c])=>s+c, 0);
    return { text: `⚠️ وجدت ${dupGroups.length} حالة تكرار محتمل، بإجمالي ${totalDupLines} سطر قيد بنفس رقم القيد والتاريخ والحساب والمبلغ بالضبط. يُنصح بمراجعتها في قيود اليومية قبل الاعتماد على التقارير — مع ملاحظة أن بعض التكرار قد يكون طبيعياً (نفس المبلغ في معاملتين منفصلتين حقاً).`,
      action: { label:'فتح قيود اليومية', view:'journalentries' } };
  }

  // 16) Unusual / abnormal expense lines — flag lines much larger than that
  // account's own typical line size (needs some history to judge "typical").
  if(q.includes('مصروفات غريبه') || q.includes('مصروفات غير طبيعيه') || q.includes('حركات غريبه') || q.includes('حركات غير طبيعيه') || q.includes('unusual expense') || q.includes('abnormal')){
    const byAccount = {};
    STATE.journal.forEach(l => {
      const ty = accType(l.code);
      if(!['النفقات','تكاليف الإيرادات','إهلاك'].includes(ty)) return;
      const amt = l.debit - l.credit;
      if(amt <= 0) return;
      (byAccount[l.code] = byAccount[l.code] || []).push({ date:l.date, code:l.code, amt });
    });
    const flagged = [];
    Object.values(byAccount).forEach(lines => {
      if(lines.length < 4) return; // not enough history on this account to judge what's "typical"
      const avg = lines.reduce((s,l)=>s+l.amt,0) / lines.length;
      lines.forEach(l => { if(l.amt > avg*3 && l.amt > 1000) flagged.push({ ...l, avg }); });
    });
    flagged.sort((a,b)=>b.amt-a.amt);
    if(!flagged.length) return { text: 'لم أجد حركات مصروفات تبدو أعلى بشكل غير طبيعي من المعتاد لنفس الحساب في البيانات الحالية.' };
    const top = flagged.slice(0,5);
    const txt = top.map(l => `${l.date} — ${accName(l.code)}: ${fmt(l.amt)} ج.م (متوسط الحساب المعتاد ~${fmt(l.avg)} ج.م)`).join('؛ ');
    return { text: `وجدت ${flagged.length} حركة مصروفات أعلى بشكل ملحوظ (أكثر من 3 أضعاف) من متوسط نفس الحساب. أبرزها: ${txt}.`,
      action: { label:'فتح قيود اليومية', view:'journalentries' } };
  }

  // 16b) Monthly revenue trend (last 6 months)
  if(q.includes('اتجاه الايرادات') || q.includes('تطور المبيعات') || q.includes('revenue trend') || q.includes('sales trend')){
    const months = [];
    let cursor = f.end ? new Date(f.end) : new Date(todayISO());
    for(let i=5;i>=0;i--){
      const d = new Date(cursor.getFullYear(), cursor.getMonth()-i, 1);
      const start = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
      const end = new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10);
      const is = incomeStatement(STATE.journal, start, end);
      months.push({ label: start.slice(0,7), revenue: is.revenue + is.otherIncome });
    }
    const txt = months.map(m=>`${m.label}: ${fmt(m.revenue)} ج.م`).join('، ');
    return { text: `اتجاه الإيرادات على مدار آخر 6 شهور: ${txt}.`, action: { label:'عرض قائمة الدخل', view:'statements' } };
  }

  // 16c) Data sanity: how many entries/lines are loaded
  if(q.includes('عدد القيود') || q.includes('عدد الاسطر') || q.includes('عدد الحركات') || q.includes('كام قيد') || q.includes('number of entries') || q.includes('how many entries')){
    const uniqueEntries = new Set(STATE.journal.map(l=>l.entry+'|'+l.date)).size;
    return { text: `محمّل حاليًا ${fmtInt(STATE.journal.length)} سطر قيد، موزّعة على ${fmtInt(uniqueEntries)} قيد يومية (voucher) تقريبًا، عبر ${fmtInt(STATE.accounts.length)} حساب في شجرة الحسابات.` };
  }

  // 17) Help / capabilities
  if(q.includes('مساعده') || q.includes('ماذا تستطيع') || q.includes('ايه اللي تقدر') || q.includes('اي حاجه تقدر') || q.includes('what can you do') || q.includes('help')){
    return { text: AI_HELP_TEXT };
  }

  // 18) Generic: try to match a specific account name
  const accMatches = findAccountsByNameFragment(question.trim());
  if(accMatches.length === 1){
    const a = accMatches[0];
    const bal = computeBalances(STATE.journal, f.end||todayISO(), null)[a.code] || {closing:0};
    ctx.lastAccountCode = a.code;
    return { text: `رصيد حساب "${accName(a.code)}" (${a.code}) هو ${fmt(bal.closing)} ج.م كما في ${f.end||todayISO()}.`,
      action: { label:'فتح كشف الحساب', view:'accountstatement', account: a.code } };
  }
  if(accMatches.length > 1 && accMatches.length <= 8){
    const bal = computeBalances(STATE.journal, f.end||todayISO(), null);
    const txt = accMatches.map(a => `${accName(a.code)} (${a.code}): ${fmt((bal[a.code]||{closing:0}).closing)} ج.م`).join('، ');
    return { text: `وجدت أكثر من حساب مطابق: ${txt}.` };
  }

  // 19) Generic: try to match a specific partner name
  const partnerMatches = findPartnersByNameFragment(question.trim());
  if(partnerMatches.length === 1){
    const p = partnerMatches[0];
    const stmt = partnerStatement(STATE.journal, p, '', f.end, {mode:'EGP'});
    ctx.lastPartner = p;
    return { text: `رصيد "${p}" الحالي هو ${fmt(Math.abs(stmt.closing))} ج.م (${stmt.closing>=0?'مدين له':'دائن عليه'}).`,
      action: { label:'فتح كشف حسابه', view:'partnerstatement', partner: p } };
  }
  if(partnerMatches.length > 1 && partnerMatches.length <= 8){
    const balances = partnerBalances(STATE.journal, '', f.end).filter(p=>partnerMatches.includes(p.name));
    const txt = balances.map(p => `${p.name}: ${fmt(Math.abs(p.balance))} ج.م (${p.balance>=0?'مدين له':'دائن عليه'})`).join('، ');
    return { text: `وجدت أكثر من شريك مطابق: ${txt}.` };
  }

  // 20) Conversational memory fallback: a short follow-up like "وكام رصيده
  // دلوقتي؟" that refers back to whichever account/partner was last discussed
  // in this session, without repeating its name.
  if((q.includes('رصيد') || q.includes('كام') || q.includes('balance')) && ctx.lastPartner){
    const p = ctx.lastPartner;
    const stmt = partnerStatement(STATE.journal, p, '', f.end, {mode:'EGP'});
    return { text: `(بالإشارة إلى "${p}") رصيده الحالي ${fmt(Math.abs(stmt.closing))} ج.م (${stmt.closing>=0?'مدين له':'دائن عليه'}).`,
      action: { label:'فتح كشف حسابه', view:'partnerstatement', partner: p } };
  }
  if((q.includes('رصيد') || q.includes('كام') || q.includes('balance')) && ctx.lastAccountCode){
    const code = ctx.lastAccountCode;
    const bal = computeBalances(STATE.journal, f.end||todayISO(), null)[code] || {closing:0};
    return { text: `(بالإشارة إلى حساب "${accName(code)}") رصيده ${fmt(bal.closing)} ج.م كما في ${f.end||todayISO()}.`,
      action: { label:'فتح كشف الحساب', view:'accountstatement', account: code } };
  }

  return {
    text: 'لم أفهم السؤال بالتحديد بعد. اكتب "مساعدة" لعرض كل أنواع الأسئلة اللي أقدر أجاوب عليها، أو جرّب صياغة زي: "كم بلغت المبيعات هذا الشهر؟"، "من أكبر عميل؟"، "من أكبر مورد؟"، "اعرض أرصدة البنوك"، "هل ميزان المراجعة متوازن؟"، "ما هو هامش الربح؟"، "قارن هذا الشهر بالشهر السابق"، أو اكتب اسم/رقم حساب أو شريك أو مركز تكلفة مباشرة.'
  };
}

const AI_HELP_TEXT = 'أقدر أساعدك في: (1) كشوف الحسابات — اكتب اسم أو رقم أي حساب مباشرة. (2) كشوف العملاء والموردين — اكتب اسم الشريك، أو اسأل "من أكبر عميل/مورد؟". (3) مراكز التكلفة والمشاريع — "كشف مركز تكلفة كذا"، أو "أفضل/أسوأ مشروع". (4) تحليل الإيرادات والمصروفات — "المبيعات الشهر ده"، "أكبر المصروفات". (5) التدفقات النقدية — "التدفق النقدي" أو "أرصدة البنوك". (6) الربحية والنسب المالية — "هامش الربح"، "نسبة التداول"، "نسبة الدين". (7) قائمة المركز المالي — "إجمالي الأصول/الالتزامات/حقوق الملكية". (8) فحص جودة البيانات — "هل ميزان المراجعة متوازن؟"، "فيه قيود مكررة؟"، "فيه مصروفات غريبة؟". (9) مقارنة الفترات وتفسير التغيرات — "قارن هذا الشهر بالشهر اللي فات"، "ليه الأرباح نزلت؟". وبعد ما تسأل عن حساب أو شريك معيّن، تقدر تكمل بسؤال متابعة قصير زي "وكام رصيده دلوقتي؟" وهفهم إنك بتقصد نفسه.';


function generateAnalysis(lines, start, end){
  const is = incomeStatement(lines, start, end);
  const bs = balanceSheet(lines, end);
  const r = ratios(is, bs);
  const cf = cashFlowStatement(lines, start, end);
  const cc = costCenterPL(lines, start, end);
  const partners = partnerBalances(lines, '', end);

  // prior period of equal length, immediately before `start`
  let prior = null;
  if(start){
    const spanDays = Math.round((new Date(end) - new Date(start)) / 86400000);
    const priorEnd = addDaysISO(start, -1);
    const priorStart = addDaysISO(priorEnd, -spanDays);
    prior = incomeStatement(lines, priorStart, priorEnd);
  }

  const strengths = [], weaknesses = [], recommendations = [], notes = [];

  // Profitability
  if(is.netIncome >= 0){
    strengths.push(`تحقيق صافي ربح قدره ${fmt(is.netIncome)} ج.م خلال الفترة المحددة.`);
  } else {
    weaknesses.push(`تسجيل صافي خسارة قدرها ${fmt(Math.abs(is.netIncome))} ج.م خلال الفترة المحددة.`);
    recommendations.push('مراجعة هيكل التكاليف والمصروفات العمومية والإدارية لتحديد فرص خفضها، ومقارنة نمو الإيرادات بنمو المصروفات بشكل دوري.');
  }
  if(r.netMargin != null){
    if(r.netMargin >= 10) strengths.push(`هامش صافي ربح جيد (${fmt(r.netMargin)}%) مقارنة بالإيرادات.`);
    else if(r.netMargin < 0) notes.push(`هامش صافي الربح سالب (${fmt(r.netMargin)}%)، أي أن المصروفات تتجاوز الإيرادات خلال الفترة.`);
  }

  // Revenue trend vs prior period
  if(prior){
    const revChangePct = prior.revenue !== 0 ? ((is.revenue - prior.revenue) / Math.abs(prior.revenue)) * 100 : null;
    if(revChangePct != null){
      if(revChangePct > 5) strengths.push(`نمو في الإيرادات بنسبة ${fmt(revChangePct)}% مقارنة بالفترة السابقة المكافئة لها في الطول.`);
      else if(revChangePct < -5) weaknesses.push(`انخفاض في الإيرادات بنسبة ${fmt(Math.abs(revChangePct))}% مقارنة بالفترة السابقة المكافئة لها في الطول.`);
    }
    const niChangeAbs = is.netIncome - prior.netIncome;
    notes.push(`صافي الربح/الخسارة تغيّر بمقدار ${fmt(niChangeAbs)} ج.م مقارنة بالفترة السابقة المكافئة (من ${prior.start||'البداية'} إلى ${prior.end}).`);
  }

  // Liquidity
  if(r.currentRatio != null){
    if(r.currentRatio < 1) { weaknesses.push(`نسبة التداول أقل من الواحد الصحيح (${fmt(r.currentRatio)})، ما يعني أن الأصول المتداولة لا تغطي الالتزامات المتداولة بالكامل.`); recommendations.push('العمل على تسريع تحصيل أرصدة العملاء، أو إعادة جدولة/تفاوض الالتزامات قصيرة الأجل لتحسين السيولة.'); }
    else if(r.currentRatio >= 1.5) strengths.push(`نسبة تداول صحية (${fmt(r.currentRatio)}) تعكس قدرة جيدة على سداد الالتزامات قصيرة الأجل.`);
  }

  // Leverage
  if(r.debtRatio != null && r.debtRatio > 0.6){
    weaknesses.push(`نسبة الدين إلى إجمالي الأصول مرتفعة نسبياً (${fmt(r.debtRatio*100)}%).`);
    recommendations.push('تقييم مدى الاعتماد على التمويل بالدين مقابل حقوق الملكية، ووضع خطة لخفض الالتزامات إن أمكن.');
  }

  // Cash flow quality
  if(cf.operating < 0 && is.netIncome >= 0){
    notes.push('صافي الربح موجب إلا أن التدفق النقدي التشغيلي سالب — قد يشير ذلك إلى تعثر في تحصيل المستحقات أو نمو كبير في المخزون/أرصدة العملاء يستهلك السيولة رغم الربحية الدفترية.');
  }
  if(cf.operating >= 0) strengths.push(`التدفق النقدي من الأنشطة التشغيلية موجب (${fmt(cf.operating)} ج.م)، وهو مؤشر جيد على جودة الأرباح.`);

  // Cost centers
  const lossCenters = cc.filter(c => c.profit < 0);
  if(cc.length){
    if(lossCenters.length){
      weaknesses.push(`${lossCenters.length} من أصل ${cc.length} مركز تكلفة/مشروع حقق خسارة خلال الفترة (إجمالي خسائرها ${fmt(lossCenters.reduce((s,c)=>s+Math.abs(c.profit),0))} ج.م).`);
      recommendations.push(`مراجعة جدوى المشاريع/مراكز التكلفة الخاسرة، وأبرزها: ${lossCenters.slice(0,3).map(c=>c.name).join('، ')}.`);
    }
    const best = cc[0];
    if(best && best.profit > 0) strengths.push(`أفضل مركز تكلفة ربحية خلال الفترة هو "${best.name}" بصافي ربح ${fmt(best.profit)} ج.م.`);
  }

  // Partner concentration
  if(partners.length){
    const totalAbs = partners.reduce((s,p)=>s+Math.abs(p.balance),0);
    const top = partners[0];
    const topPct = totalAbs !== 0 ? (Math.abs(top.balance)/totalAbs)*100 : 0;
    if(topPct > 30){
      weaknesses.push(`تركز مرتفع في الأرصدة لدى شريك واحد ("${top.name}")، يمثل ${fmt(topPct)}% من إجمالي أرصدة العملاء والموردين.`);
      recommendations.push('تنويع قاعدة العملاء/الموردين لتقليل مخاطر التركز لدى طرف واحد.');
    }
  }

  return { is, bs, r, cf, cc, partners, prior, strengths, weaknesses, recommendations, notes };
}

/* =========================================================================
   Project & Collection Tracker — a lightweight sub-ledger that runs
   alongside (not inside) the formal double-entry books. Mirrors the
   spreadsheet workflow described: each project gets a sequential ID
   (EGP projects from 10000, USD from 5000), and its life is logged as a
   handful of dated transactions — 'deal' (contract value), 'collection'
   (a payment received), 'invoicing' (delivery/invoice issued). The
   project's own `amount` field is the CURRENT contract value (editable,
   since it sometimes changes after the deal); "remaining to collect" is
   always computed against that current value, not the historical deal
   log, so an amended contract is reflected immediately.
   Project names are used as Customer/Vendor names in the real journal too
   (confirmed), so this can be cross-referenced against the actual ledger
   balance for the same name to show the gap between "recognized in the
   books so far" and "actually still owed by the customer".
   ========================================================================= */
// Imports directly from the user's existing spreadsheet structure:
// ID-EGP / ID-USD sheets = project registry (Code, Customer/Project, Project
// Amount, Seller, Deal Date, at header row 2 / data from row 3), and a
// "Data" sheet = the transaction log (Customer Type, ID, Date, Description
// [Deals/Collection/Invoicing], Customer, Amount, Seller, Invoice No., ...,
// Ex. Rate, Amount USD — header row 3 / data from row 4). Existing projects
// are matched by (id + currency) and updated in place; transactions are
// deduped by (project, date, type, amount) so re-importing an updated
// export never creates duplicates.
async function importProjectsExcelFile(file){
  const wb = await readWorkbook(file);
  const date1904 = !!(wb && wb.Workbook && wb.Workbook.WBProps && wb.Workbook.WBProps.date1904);
  let added = 0, updated = 0, txAdded = 0, txSkipped = 0;

  for(const [sheetName, currency] of [['ID-EGP','EGP'], ['ID-USD','USD']]){
    if(!wb.SheetNames.includes(sheetName)) continue;
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header:1, raw:true, defval:null });
    for(let i = 2; i < rows.length; i++){ // data starts at row 3 (1-based)
      const r = rows[i];
      if(!r) continue;
      const code = r[0];
      if(typeof code !== 'number') continue;
      const name = (r[1]||'').toString().trim();
      if(!name) continue;
      const amount = Number(r[2]) || 0;
      const seller = (r[3]||'').toString().trim();
      const startDate = r[4] ? toISODate(r[4], date1904) : '';
      const idx = STATE.projects.findIndex(p => p.id===code && p.currency===currency);
      if(idx >= 0){ Object.assign(STATE.projects[idx], { name, amount, seller, startDate }); updated++; }
      else { STATE.projects.push({ id:code, name, currency, amount, seller, startDate }); added++; }
    }
  }

  if(wb.SheetNames.includes('Data')){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets['Data'], { header:1, raw:true, defval:null });
    const existingKeys = new Set(STATE.projectTx.map(t => t.importKey).filter(Boolean));
    for(let i = 3; i < rows.length; i++){ // data starts at row 4 (1-based)
      const r = rows[i];
      if(!r) continue;
      const custType = (r[2]||'').toString();
      const id = r[3];
      const rawDate = r[4];
      const desc = (r[5]||'').toString().trim();
      if(typeof id !== 'number' || !rawDate || !desc) continue;
      const type = desc === 'Deals' ? 'deal' : desc === 'Collection' ? 'collection' : desc === 'Invoicing' ? 'invoicing' : null;
      if(!type) continue;
      const currency = custType.includes('USD') ? 'USD' : 'EGP';
      const amount = currency === 'USD' ? (Number(r[14]) || 0) : (Number(r[7]) || 0); // col15 Amount USD / col8 Amount(EGP)
      if(!amount) continue;
      const invoiceNo = r[9] != null ? r[9].toString().trim() : '';
      const exRate = currency === 'USD' ? (Number(r[13]) || null) : null; // col14 Ex. Rate
      const isoDate = toISODate(rawDate, date1904);
      const importKey = `${id}|${isoDate}|${type}|${amount}`;
      if(existingKeys.has(importKey)){ txSkipped++; continue; }
      existingKeys.add(importKey);
      STATE.projectTx.push({ rowId:'tx_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), projectId:id, date:isoDate, type, amount, invoiceNo, exRate, remarks:'', importKey });
      txAdded++;
    }
  }

  await storeSet('projects', STATE.projects);
  await storeSet('projectTx', STATE.projectTx);
  return { added, updated, txAdded, txSkipped };
}

function nextProjectId(currency){
  const base = currency === 'USD' ? 5000 : 10000;
  const existing = STATE.projects.filter(p=>p.currency===currency).map(p=>p.id);
  return existing.length ? Math.max(...existing) + 1 : base;
}
function projectTxFor(projectId){
  return STATE.projectTx.filter(t=>t.projectId===projectId).sort((a,b)=>a.date.localeCompare(b.date));
}
function projectTotals(project){
  const txs = projectTxFor(project.id);
  const deals = txs.filter(t=>t.type==='deal').reduce((s,t)=>s+t.amount,0);
  const collections = txs.filter(t=>t.type==='collection').reduce((s,t)=>s+t.amount,0);
  const invoiced = txs.filter(t=>t.type==='invoicing').reduce((s,t)=>s+t.amount,0);
  const remaining = (project.amount||0) - collections;
  let status = 'notStarted';
  if(collections > 0 && remaining <= 0.01) status = 'complete';
  else if(collections > 0) status = 'partial';
  else if(invoiced > 0) status = 'invoicedNotCollected'; // has an invoice on record, but zero collected — distinct from a project that was never invoiced at all
  return { deals, collections, invoiced, remaining, status, txCount: txs.length };
}
// Cross-reference: the actual ledger balance for a partner with this exact
// name, as of today — null if no matching partner name exists in the
// journal yet (e.g. a brand-new project with no accounting entries posted).
function linkedLedgerBalance(projectName){
  if(!STATE.journal.some(l => l.partner === projectName)) return null;
  const stmt = partnerStatement(STATE.journal, projectName, '', todayISO(), {mode:'EGP'});
  return stmt.closing;
}

function costCenterPL(lines, start, end){
  const filtered = lines.filter(l => l.cc && !isClosingLine(l) && (!start || l.date >= start) && (!end || l.date <= end));
  const map = {};
  for(const l of filtered){
    if(!map[l.cc]) map[l.cc] = { name:l.cc, revenue:0, cost:0, partners:new Set() };
    const t = accType(l.code);
    const cls = CLASS_MAP[t];
    const rec = map[l.cc];
    if(l.partner) rec.partners.add(l.partner);
    if(cls && (cls.section === 'REV' || cls.section === 'OI')){
      rec.revenue += (l.credit - l.debit);
    } else if(cls && ['COGS','EXP','DEP'].includes(cls.section)){
      rec.cost += (l.debit - l.credit);
    }
  }
  return Object.values(map).map(r => ({
    name:r.name, revenue:r.revenue, cost:r.cost, profit:r.revenue - r.cost,
    margin: r.revenue !== 0 ? ((r.revenue-r.cost)/r.revenue*100) : null,
    partners:[...r.partners]
  })).sort((a,b)=> b.profit - a.profit);
}

function partnerBalances(lines, start, end){
  const filtered = lines.filter(l => l.partner && (!start || l.date >= start) && (!end || l.date <= end));
  const map = {};
  for(const l of filtered){
    if(!map[l.partner]) map[l.partner] = { name:l.partner, debit:0, credit:0, count:0, accounts:new Set(), nativeByCur:{} };
    const rec = map[l.partner];
    rec.debit += l.debit; rec.credit += l.credit; rec.count++;
    rec.accounts.add(l.code + ' ' + accName(l.code));
    const cur = l.cur || 'EGP';
    if(cur !== 'EGP'){
      const n = lineNative(l);
      rec.nativeByCur[cur] = (rec.nativeByCur[cur] || 0) + n.debit - n.credit;
    }
  }
  return Object.values(map).map(r => ({...r, balance: r.debit - r.credit, accounts:[...r.accounts],
    nativeByCur: Object.entries(r.nativeByCur).filter(([,v])=>Math.abs(v)>=0.01)}))
    .sort((a,b)=> Math.abs(b.balance) - Math.abs(a.balance));
}

// Multi-account / multi-partner ledger rows (unsorted, no cumulative yet — the
// view computes cumulative balance AFTER sorting, since the running balance
// must reflect whatever order is currently displayed).
function generalLedgerRows(lines, accountCodes, partnerNames, journals, start, end, opts){
  opts = opts || {};
  const descSearch = (opts.descSearch||'').trim().toLowerCase();
  const currencyFilter = opts.currencyFilter || 'ALL';
  const costCenters = opts.costCenters || null;
  const matchAcc = !accountCodes || !accountCodes.length;
  const matchPtn = !partnerNames || !partnerNames.length;
  const matchJournal = !journals || !journals.length;
  const matchCC = !costCenters || !costCenters.length;
  const matches = l => (matchAcc || accountCodes.includes(l.code))
    && (matchPtn || partnerNames.includes(l.partner))
    && (matchJournal || journals.includes(l.journal||''))
    && (matchCC || costCenters.includes(l.cc||''))
    && (!descSearch || (l.ref||'').toLowerCase().includes(descSearch))
    && (currencyFilter==='ALL' || (l.cur||'EGP')===currencyFilter);
  const opening = lines.filter(l => matches(l) && start && l.date < start).reduce((s,l)=> s + l.debit - l.credit, 0);
  const openingNative = lines.filter(l => matches(l) && start && l.date < start)
    .reduce((s,l)=> { const a = lineNative(l); return s + a.debit - a.credit; }, 0);
  const rows = lines.filter(l => matches(l) && (!start || l.date >= start) && (!end || l.date <= end))
    .map(l => ({ ...l, movement: l.debit - l.credit }));
  return { opening, openingNative, rows };
}

function accountStatement(lines, code, start, end, opts){
  opts = opts || {};
  const mode = opts.mode || 'EGP';
  const partnerFilter = opts.partner || '';
  const matches = l => l.code === code && (!partnerFilter || l.partner === partnerFilter) && (mode !== 'NATIVE' || !isFxAdjustmentLine(l));
  const opening = lines.filter(l => matches(l) && start && l.date < start)
    .reduce((s,l)=> { const a = rowAmounts(l, mode); return s + a.debit - a.credit; }, 0);
  const rows = lines.filter(l => matches(l) && (!start || l.date >= start) && (!end || l.date <= end))
    .sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  let running = opening;
  const out = rows.map(l => { const a = rowAmounts(l, mode); running += (a.debit - a.credit); return {...l, dispDebit:a.debit, dispCredit:a.credit, running}; });
  return { opening, rows: out, closing: running };
}

function partnerStatement(lines, partner, start, end, opts){
  opts = opts || {};
  const mode = opts.mode || 'EGP';
  const accountCodes = opts.accountCodes || null; // restrict to specific account codes (Customer Statement / Other Balances)
  const inScope = l => !accountCodes || accountCodes.includes(l.code);
  const opening = lines.filter(l => l.partner === partner && inScope(l) && start && l.date < start)
    .reduce((s,l)=> s + l.debit - l.credit, 0);
  const rows = lines.filter(l => l.partner === partner && inScope(l) && (!start || l.date >= start) && (!end || l.date <= end))
    .sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  let running = opening;
  const out = rows.map(l => { running += (l.debit - l.credit); return {...l, dispDebit:l.debit, dispCredit:l.credit, running}; });

  if(mode !== 'NATIVE'){
    return { opening, rows: out, closing: running, byCurrency: null };
  }
  // Native mode: group by currency since a partner's lines may span accounts in different currencies.
  // FX-revaluation entries are excluded entirely — they must never appear in a foreign-currency ledger.
  const currencies = uniq(rows.filter(l=>!isFxAdjustmentLine(l)).map(l => l.cur || 'EGP'));
  const byCurrency = currencies.map(cur => {
    const curRows = lines.filter(l => l.partner === partner && inScope(l) && (l.cur||'EGP') === cur && !isFxAdjustmentLine(l));
    const curOpening = curRows.filter(l => start && l.date < start)
      .reduce((s,l)=> { const a = lineNative(l); return s + a.debit - a.credit; }, 0);
    const curPeriodRows = curRows.filter(l => (!start || l.date >= start) && (!end || l.date <= end))
      .sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    let run = curOpening;
    const outRows = curPeriodRows.map(l => { const a = lineNative(l); run += (a.debit - a.credit); return {...l, dispDebit:a.debit, dispCredit:a.credit, running:run}; });
    return { currency: cur, opening: curOpening, rows: outRows, closing: run };
  });
  return { opening, rows: out, closing: running, byCurrency };
}

// Exact account codes that define the "Customer Statement" (كشف عميل/مورد) page —
// customers (112101, 112201) and vendors/suppliers (211101, 211201) only.
const CUSTOMER_STATEMENT_ACCOUNTS = ['112101','112201','211101','211201'];
// Accounts for the "Other Debit / Credit Balances" page (req. 7): everything
// starting with these four prefixes (other debit/credit balances, EGP & USD).
const OTHER_BALANCES_PREFIXES = ['1123','1124','2113','2114'];
function accountsWithPrefixes(prefixes){
  return STATE.accounts.filter(a => prefixes.some(p => a.code.startsWith(p))).map(a=>a.code);
}

function monthlySeries(lines, rangeStart, rangeEnd, maxBuckets){
  // returns [{label, revenue, expenses, net}] — one bucket per month within [rangeStart, rangeEnd]
  maxBuckets = maxBuckets || 18;
  const end = rangeEnd ? new Date(rangeEnd) : new Date();
  let start;
  if(rangeStart){
    start = new Date(rangeStart);
  } else if(lines.length){
    const earliest = lines.reduce((m,l)=> l.date < m ? l.date : m, lines[0].date);
    start = new Date(earliest);
  } else {
    start = new Date(end.getFullYear(), end.getMonth(), 1);
  }

  let months = [];
  let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
  const last = new Date(end.getFullYear(), end.getMonth(), 1);
  while(cursor <= last){
    months.push(new Date(cursor));
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }
  if(months.length > maxBuckets){
    months = months.slice(months.length - maxBuckets); // keep the most recent N months of the selected range
  }
  if(!months.length) months = [last];

  return months.map(d => {
    const mStart = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-01`;
    const monthEndD = new Date(d.getFullYear(), d.getMonth()+1, 0);
    let mEnd = `${monthEndD.getFullYear()}-${pad2(monthEndD.getMonth()+1)}-${pad2(monthEndD.getDate())}`;
    // clip the first/last bucket to the actual selected range
    const effStart = rangeStart && rangeStart > mStart ? rangeStart : mStart;
    const effEnd = rangeEnd && rangeEnd < mEnd ? rangeEnd : mEnd;
    const is = incomeStatement(lines, effStart, effEnd);
    return { label: `${d.getFullYear()}/${pad2(d.getMonth()+1)}`, revenue: is.revenue+is.otherIncome, expenses: is.cogs+is.expenses+is.depreciation, net: is.netIncome };
  });
}

/* =========================================================================
   Import pipeline
   ========================================================================= */

function readWorkbook(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try{
        const data = new Uint8Array(e.target.result);
        // cellDates:false (the default) keeps Excel date cells as raw numeric
        // serials instead of JS Date objects. This is required by the date
        // import fix in toISODate(): converting a serial to a Date bakes in a
        // timezone assumption that breaks for some viewers; working with the
        // raw serial number avoids that entirely. See toISODate() for details.
        const wb = XLSX.read(data, { type:'array', cellDates:false });
        resolve(wb);
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

async function parseFileForPreview(file, kind){
  // kind: 'journal' | 'accounts' | 'groups'
  const wb = await readWorkbook(file);
  let sheetName = wb.SheetNames[0];
  if(kind === 'journal'){
    const preferred = wb.SheetNames.find(n => normalize(n) === normalize('Data')) ||
                       wb.SheetNames.find(n => normalize(n).includes(normalize('Data')));
    if(preferred) sheetName = preferred;
  }
  return { wb, sheetName, sheetNames: wb.SheetNames, file };
}

function rowsFromSheet(wb, sheetName){
  const ws = wb.Sheets[sheetName];
  return XLSX.utils.sheet_to_json(ws, { defval:null, raw:true });
}

function buildJournalPreview(wb, sheetName, source){
  const rows = rowsFromSheet(wb, sheetName);
  if(!rows.length) return { mapping:{}, lines:[], totalRows:0, headers:[] };
  const date1904 = !!(wb && wb.Workbook && wb.Workbook.WBProps && wb.Workbook.WBProps.date1904);
  const headers = Object.keys(rows[0]);
  const mapping = detectMapping(headers);
  const lines = [];
  for(const row of rows){
    const l = buildLine(row, mapping, source, date1904);
    if(l) lines.push(l);
  }
  return { mapping, lines, totalRows: rows.length, headers };
}

async function mergeJournalImport(lines, filename, mode){
  // Multiset-based dedup: a journal entry (voucher) can legitimately contain
  // several lines that are byte-identical (same account/amount/partner) — e.g.
  // two equal debit lines in one voucher. We must not drop those. We only skip
  // a line when we've already SEEN that many occurrences of the exact same key
  // in previously-stored data — i.e. we only skip true re-imports of the same
  // rows, never a second distinct-but-identical-looking row from a fresh import.
  const existingCounts = new Map();
  for(const l of STATE.journal){
    const k = lineKey(l);
    existingCounts.set(k, (existingCounts.get(k) || 0) + 1);
  }
  const seenInBatch = new Map();
  const toAdd = [];
  for(const l of lines){
    const k = lineKey(l);
    const already = existingCounts.get(k) || 0;
    const seenSoFar = seenInBatch.get(k) || 0;
    seenInBatch.set(k, seenSoFar + 1);
    if(seenSoFar < already) continue; // this occurrence already exists in storage — true duplicate import
    toAdd.push(l);
  }

  // Sequential Journal Number (General Ledger req. 4.1): every line gets a
  // permanent, ever-increasing `seq` the first time it is imported, assigned
  // in the exact order the rows appeared in the source Excel file (`lines` is
  // already in that order — see buildJournalPreview). This survives future
  // imports/updates and reloads, unlike a position computed from the
  // currently-displayed/sorted table.
  let seqCounter = STATE.meta.journalSeqCounter || 0;
  for(const l of toAdd){ l.seq = ++seqCounter; }
  STATE.meta.journalSeqCounter = seqCounter;

  const byYear = {};
  for(const l of toAdd){
    const y = l.date.slice(0,4);
    (byYear[y] = byYear[y] || []).push(l);
  }
  for(const y in byYear){
    const shardKey = 'journal:' + y;
    const existingShard = (await storeGet(shardKey)) || [];
    const merged = existingShard.concat(byYear[y]);
    await storeSet(shardKey, merged);
  }
  STATE.journal = STATE.journal.concat(toAdd);

  let lastLine = null;
  for(const l of toAdd){
    if(!lastLine || l.date > lastLine.date || (l.date === lastLine.date && l.entry > lastLine.entry)) lastLine = l;
  }
  STATE.meta.lastImportAt = new Date().toISOString();
  STATE.meta.totalLines = STATE.journal.length;
  if(lastLine){ STATE.meta.lastEntry = lastLine.entry; STATE.meta.lastEntryDate = lastLine.date; }
  STATE.meta.log.unshift({ date: STATE.meta.lastImportAt, filename, mode, added: toAdd.length, skipped: lines.length - toAdd.length, totalRows: lines.length });
  STATE.meta.log = STATE.meta.log.slice(0, 30);
  await storeSet('meta', STATE.meta);
  return { added: toAdd.length, skipped: lines.length - toAdd.length };
}

async function importAccountsFile(file){
  const wb = await readWorkbook(file);
  const sheetName = wb.SheetNames[0];
  const rows = rowsFromSheet(wb, sheetName);
  const headers = Object.keys(rows[0] || {});
  const norm = {};
  headers.forEach(h => norm[normalize(h)] = h);
  const codeH = norm[normalize('رمز')] || norm[normalize('code')] || headers[0];
  const nameH = norm[normalize('اسم الحساب')] || norm[normalize('name')] || headers[1];
  const typeH = norm[normalize('النوع')] || norm[normalize('type')] || headers[2];
  const curH = norm[normalize('عملة الحساب')] || norm[normalize('currency')];
  const nameEnH = norm[normalize('الاسم بالإنجليزية')] || norm[normalize('English Name')] || norm[normalize('name en')] || norm[normalize('nameEn')];
  const map = {}; STATE.accounts.forEach(a => map[a.code] = a);
  let added=0, updated=0;
  for(const row of rows){
    const code = (row[codeH]||'').toString().trim();
    if(!code) continue;
    const rec = { code, name:(row[nameH]||'').toString().trim(), type:(row[typeH]||'').toString().trim(), currency: curH?(row[curH]||'EGP').toString().trim():'EGP' };
    const nameEn = nameEnH ? (row[nameEnH]||'').toString().trim() : '';
    if(nameEn) rec.nameEn = nameEn;
    else if(map[code] && map[code].nameEn) rec.nameEn = map[code].nameEn; // keep existing English name if the re-uploaded file doesn't include one
    if(map[code]) updated++; else added++;
    map[code] = rec;
  }
  STATE.accounts = Object.values(map);
  rebuildAccountIndex();
  await storeSet('accounts', STATE.accounts);
  return { added, updated, total: STATE.accounts.length };
}

async function importGroupsFile(file){
  const wb = await readWorkbook(file);
  const sheetName = wb.SheetNames[0];
  const rows = rowsFromSheet(wb, sheetName);
  const headers = Object.keys(rows[0] || {});
  const norm = {};
  headers.forEach(h => norm[normalize(h)] = h);
  const startH = norm[normalize('بداية بادئة الكود')] || headers[0];
  const endH = norm[normalize('نهاية بادئة الكود')] || headers[1];
  const nameH = norm[normalize('الاسم')] || headers[2];
  const nameEnH = norm[normalize('الاسم بالإنجليزية')] || norm[normalize('English Name')] || norm[normalize('name en')] || norm[normalize('nameEn')];
  const groups = [];
  for(const row of rows){
    const start = (row[startH]||'').toString().trim();
    if(!start) continue;
    const g = { start, end:(row[endH]||start).toString().trim(), name:(row[nameH]||'').toString().trim() };
    const nameEn = nameEnH ? (row[nameEnH]||'').toString().trim() : '';
    if(nameEn) g.nameEn = nameEn;
    groups.push(g);
  }
  STATE.groups = groups;
  await storeSet('groups', STATE.groups);
  return { total: STATE.groups.length };
}

// window.confirm()/alert()/prompt() are frequently blocked or silently return
// false inside sandboxed iframes (which is how this app runs when embedded as
// an artifact) — relying on them makes destructive-action confirmations look
// broken even though the surrounding code is correct. This is a real in-page
// modal instead, which works regardless of iframe sandboxing.
function showConfirmModal(title, message, onConfirm){
  const overlay = document.getElementById('confirmModalOverlay');
  if(!overlay) { onConfirm(); return; }
  overlay.innerHTML = `
    <div class="modal-box modal-box-anim">
      <h3>${escapeHtml(title)}</h3>
      <p>${escapeHtml(message)}</p>
      <div class="modal-actions">
        <button class="btn btn-outline" id="confirmModalCancel">إلغاء</button>
        <button class="btn" style="background:var(--brick);border-color:var(--brick)" id="confirmModalOk">تأكيد</button>
      </div>
    </div>
  `;
  overlay.className = 'modal-overlay modal-overlay-anim';
  overlay.style.display = 'flex';
  const close = () => { overlay.style.display = 'none'; overlay.innerHTML = ''; };
  document.getElementById('confirmModalCancel').addEventListener('click', close);
  document.getElementById('confirmModalOk').addEventListener('click', () => { close(); onConfirm(); });
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
}

// Reset System is uniquely destructive (wipes ALL journal entries, the
// entire Chart of Accounts, and all Account Groups permanently), so it uses
// its own type-to-confirm modal rather than the generic Yes/No one.
function showResetConfirmModal(onConfirm){
  const overlay = document.getElementById('confirmModalOverlay');
  if(!overlay) { onConfirm(); return; }
  overlay.innerHTML = `
    <div class="modal-box modal-box-anim">
      <h3>إعادة تعيين النظام بالكامل</h3>
      <p>سيتم حذف كل البيانات المخزّنة نهائياً: جميع قيود اليومية، وشجرة الحسابات بالكامل، وجميع مجموعات الحسابات — والعودة لحالة البداية قبل استيراد أي بيانات. <strong>هذا الإجراء لا يمكن التراجع عنه.</strong></p>
      <p>للتأكيد، اكتب كلمة <strong>RESET</strong> في الحقل أدناه:</p>
      <input type="text" id="resetConfirmInput" class="input" style="width:100%;margin-bottom:12px" autocomplete="off" placeholder="RESET">
      <div class="modal-actions">
        <button class="btn btn-outline" id="confirmModalCancel">إلغاء</button>
        <button class="btn" style="background:var(--brick);border-color:var(--brick)" id="confirmModalOk" disabled>تأكيد الحذف النهائي</button>
      </div>
    </div>
  `;
  overlay.className = 'modal-overlay modal-overlay-anim';
  overlay.style.display = 'flex';
  const close = () => { overlay.style.display = 'none'; overlay.innerHTML = ''; };
  const input = document.getElementById('resetConfirmInput');
  const okBtn = document.getElementById('confirmModalOk');
  input.addEventListener('input', () => { okBtn.disabled = input.value.trim().toUpperCase() !== 'RESET'; });
  input.focus();
  document.getElementById('confirmModalCancel').addEventListener('click', close);
  okBtn.addEventListener('click', () => {
    if(input.value.trim().toUpperCase() !== 'RESET') return;
    close(); onConfirm();
  });
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
}
