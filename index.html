          ${filterableTh(vk,'ref',t('description'),colf.ref,rows.map(r=>r.ref||''))}
          ${filterableTh(vk,'partner',t('partner'),colf.partner,rows.map(r=>r.partner||''))}
          ${filterableTh(vk,'dispDebit',t('debit')+' '+curLabel,colf.debit,rows.map(r=>r.dispDebit||0),{extraClass:'num-cell',displayLabel:fmt})}
          ${filterableTh(vk,'dispCredit',t('credit')+' '+curLabel,colf.credit,rows.map(r=>r.dispCredit||0),{extraClass:'num-cell',displayLabel:fmt})}
          ${filterableTh(vk,'product',t('productCol'),colf.product,rows.map(r=>r.product||''))}
          ${filterableTh(vk,'curAmt',t('origCurrencyAmountCol'),colf.curAmt,rows.map(r=>r.curAmt||0),{extraClass:'num-cell',displayLabel:fmt})}
          ${sortTh(vk,'convFactor',t('conversionFactorCol'),'num-cell')}
          ${filterableTh(vk,'running',t('runningBalance'),colf.running,rows.map(r=>r.running),{extraClass:'num-cell',displayLabel:fmt})}
        </tr></thead><tbody>
          <tr class="total-row"><td colspan="7">${t('openingBalance')}</td><td></td><td></td><td class="num-cell num">${fmt(opening)}</td></tr>
          ${sorted.length ? sorted.map(r=>{
            const hasFx = r.curAmt && r.cur && r.cur!=='EGP';
            const convFactor = hasFx ? (r.dispDebit||r.dispCredit)/Math.abs(r.curAmt) : null;
            return `<tr>
            <td class="num">${r.seq||''}</td>
            <td class="num">${r.date}</td>
            <td class="num">${escapeHtml(r.entry)}</td>
            <td>${escapeHtml(r.ref||'')}</td>
            <td class="${r.partner?'drill':''}" ${r.partner?`onclick="drillToPartner('${jsAttrEscape(r.partner)}')"`:''}>${escapeHtml(r.partner||'')}</td>
            <td class="num-cell num">${r.dispDebit?fmt(r.dispDebit):''}</td>
            <td class="num-cell num">${r.dispCredit?fmt(r.dispCredit):''}</td>
            <td>${r.product?escapeHtml(r.product):'—'}</td>
            <td class="num-cell num">${r.curAmt?fmt(r.curAmt)+' '+escapeHtml(r.cur||''):'—'}</td>
            <td class="num-cell num">${convFactor!=null?fmt(convFactor):'—'}</td>
            <td class="num-cell num ${r.running>=0?'pos-text':'neg-text'}">${fmt(r.running)}</td>
          </tr>`;}).join('') : `<tr><td colspan="11" class="empty">${t('noMatchingFilterMovement')}</td></tr>`}
          ${sorted.length ? `<tr class="total-row"><td colspan="5">${t('total')}</td><td class="num-cell num">${fmt(totDF)}</td><td class="num-cell num">${fmt(totCF)}</td><td></td><td></td><td></td><td></td></tr>` : ''}
        </tbody></table>
      </div>`;
    }
    bodyHtml = perAccount.map(a => `
      <div class="card">
        <div class="section-title"><span>${escapeHtml(a.code)} — ${escapeHtml(a.name)}</span>
          <span class="hint">${t('openingBalance')}: ${fmt(a.opening)} — ${t('closingBalance')}: ${fmt(a.closing)}</span>
        </div>
        <div class="desc" style="margin-bottom:6px">${t('inEgpLabel')}</div>
        ${accLedgerTable(a.rows, 'EGP', a.opening, a.totD, a.totC, a.code+'_egp')}
        ${a.nativeStmt ? `
          <div class="desc" style="margin:14px 0 6px">${t('inOriginalAccountCurrencyLabel')} (${escapeHtml(a.currency)})</div>
          ${accLedgerTable(a.nativeStmt.rows, escapeHtml(a.currency), a.nativeStmt.opening, a.nativeStmt.rows.reduce((s,r)=>s+r.dispDebit,0), a.nativeStmt.rows.reduce((s,r)=>s+r.dispCredit,0), a.code+'_native')}
        ` : ''}
      </div>
    `).join('');
  }else{
    const colCount = singleForeign ? 18 : 15;
    // Performance fix: with the full real journal loaded (potentially many
    // thousands of lines), rendering every matching row as a <tr> — then
    // rebuilding that entire table from scratch on every single filter
    // click, checkbox, or keystroke — was the actual cause of the General
    // Ledger / Journal Entries pages feeling slow to open and laggy to
    // filter. Only the visible page of rows is now rendered in the DOM;
    // totals and the Excel export above still cover every matching row
    // regardless of page.
    const GL_PAGE_SIZE = 300;
    const glTotalPages = Math.max(1, Math.ceil(displayRows.length / GL_PAGE_SIZE));
    const glPage = Math.min(Math.max(0, STATE.ui.glPage||0), glTotalPages-1);
    const pageRows = displayRows.slice(glPage*GL_PAGE_SIZE, (glPage+1)*GL_PAGE_SIZE);
    bodyHtml = `
      <div class="card">
        <div class="table-wrap" style="max-height:600px;overflow-y:auto">
          <table><thead><tr>
            ${filterableTh(viewKey,'seq','#',glColf.seq,rows.map(r=>r.seq||''))}
            ${filterableTh(viewKey,'date',t('date'),glColf.date,rows.map(r=>r.date))}
            ${filterableTh(viewKey,'entry',t('entry'),glColf.entry,rows.map(r=>r.entry))}
            ${filterableTh(viewKey,'ref',t('description'),glColf.ref,rows.map(r=>r.ref||''))}
            ${filterableTh(viewKey,'account',t('account'),glColf.account,rows.map(r=>r.code+' '+accName(r.code)))}
            ${filterableTh(viewKey,'partner',t('partner'),glColf.partner,rows.map(r=>r.partner||''))}
            ${filterableTh(viewKey,'cur',t('currency'),glColf.cur,rows.map(r=>r.cur||'EGP'))}
            ${filterableTh(viewKey,'debit',t('debit')+' EGP',glColf.debit,rows.map(r=>r.debit||0),{extraClass:'num-cell',displayLabel:fmt})}
            ${filterableTh(viewKey,'credit',t('credit')+' EGP',glColf.credit,rows.map(r=>r.credit||0),{extraClass:'num-cell',displayLabel:fmt})}
            ${sortTh(viewKey,'running',t('runningBalance')+(singleForeign?' (EGP)':''),'num-cell')}
            ${filterableTh(viewKey,'product',t('productCol'),glColf.product,rows.map(r=>r.product||''))}
            ${filterableTh(viewKey,'curAmt',t('origCurrencyAmountCol'),glColf.curAmt,rows.map(r=>r.curAmt||0),{extraClass:'num-cell',displayLabel:fmt})}
            ${sortTh(viewKey,'convFactor',t('conversionFactorCol'),'num-cell')}
            ${singleForeign ? `<th class="num-cell">${t('debit')} ${escapeHtml(singleForeign)}</th><th class="num-cell">${t('credit')} ${escapeHtml(singleForeign)}</th>` : ''}
            ${filterableTh(viewKey,'movement',t('movement'),glColf.movement,rows.map(r=>r.movement),{extraClass:'num-cell',displayLabel:fmt})}
            ${singleForeign ? sortTh(viewKey,'runningNative',t('runningBalance')+' ('+singleForeign+')','num-cell') : ''}
            <th>${t('actionsCol')}</th>
          </tr></thead><tbody>
            ${(showOpening && glPage===0) ? `<tr class="total-row">
              <td colspan="7">${t('openingBalanceBeforePeriod')}</td>
              <td></td>
              <td></td>
              <td class="num-cell num">${fmt(opening)}</td>
              <td></td><td></td><td></td>
              ${singleForeign?`<td></td><td></td>`:''}
              <td></td>
              ${singleForeign?`<td class="num-cell num">${fmt(openingNative)}</td>`:''}
              <td></td>
            </tr>` : ''}
            ${pageRows.length ? pageRows.map(r=>{
              const hasFx = r.curAmt && r.cur && r.cur!=='EGP';
              const convFactor = hasFx ? (r.debit||r.credit)/Math.abs(r.curAmt) : null;
              return `<tr>
              <td class="num">${r.seq||''}</td>
              <td class="num">${r.date}</td>
              <td class="num">${escapeHtml(r.entry)}</td>
              <td>${escapeHtml(r.ref||'')}</td>
              <td class="drill" onclick="drillToAccount('${r.code}')">${r.code} ${escapeHtml(accName(r.code))}</td>
              <td class="${r.partner?'drill':''}" ${r.partner?`onclick="drillToPartner('${jsAttrEscape(r.partner)}')"`:''}>${escapeHtml(r.partner||'')}</td>
              <td><span class="pill pill-gold">${escapeHtml(r.cur||'EGP')}</span></td>
              <td class="num-cell num">${r.debit?fmt(r.debit):''}</td>
              <td class="num-cell num">${r.credit?fmt(r.credit):''}</td>
              <td class="num-cell num ${r.running>=0?'pos-text':'neg-text'}">${fmt(r.running)}</td>
              <td>${r.product?escapeHtml(r.product):'—'}</td>
              <td class="num-cell num">${r.curAmt?fmt(r.curAmt)+' '+escapeHtml(r.cur||''):'—'}</td>
              <td class="num-cell num">${convFactor!=null?fmt(convFactor):'—'}</td>
              ${singleForeign ? `<td class="num-cell num">${r.nativeDebit?fmt(r.nativeDebit):''}</td><td class="num-cell num">${r.nativeCredit?fmt(r.nativeCredit):''}</td>` : ''}
              <td class="num-cell num ${r.movement>=0?'pos-text':'neg-text'}">${fmt(r.movement)}</td>
              ${singleForeign ? `<td class="num-cell num ${r.runningNative>=0?'pos-text':'neg-text'}">${fmt(r.runningNative)}</td>` : ''}
              <td class="num-cell"><span class="drill" title="${t('editEntry')}" onclick="openEditJournalEntryModal('${jsAttrEscape(r.entry)}','${r.date}')">✎</span></td>
            </tr>`;}).join('') : `<tr><td colspan="${colCount}" class="empty">${t('noMatchingFilterMovement')}</td></tr>`}
            ${displayRows.length ? `<tr class="total-row">
              <td colspan="7">${t('total')}</td>
              <td class="num-cell num">${fmt(totalDebit)}</td>
              <td class="num-cell num">${fmt(totalCredit)}</td>
              <td></td>
              <td></td><td></td><td></td>
              ${singleForeign ? `<td class="num-cell num">${fmt(totalNativeDebit)}</td><td class="num-cell num">${fmt(totalNativeCredit)}</td>` : ''}
              <td class="num-cell num">${fmt(totalMovement)}</td>
              ${singleForeign ? '<td></td>' : ''}
              <td></td>
            </tr>` : ''}
          </tbody></table>
        </div>
        ${glTotalPages > 1 ? `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px">
          <span class="hint">${tf('glPageIndicator', {page: glPage+1, total: glTotalPages, count: fmtInt(displayRows.length)})}</span>
          <div style="display:flex;gap:6px">
            <button type="button" class="btn btn-outline" style="padding:5px 12px;font-size:11.5px" id="glPagePrev" ${glPage===0?'disabled':''}>${t('glPagePrev')}</button>
            <button type="button" class="btn btn-outline" style="padding:5px 12px;font-size:11.5px" id="glPageNext" ${glPage>=glTotalPages-1?'disabled':''}>${t('glPageNext')}</button>
          </div>
        </div>` : ''}
      </div>
    `;
  }

  root.innerHTML = filterBarHtml + bodyHtml;
  attachSortEvents();
  STATE.ui.__msHandler = (id, values) => {
    if(id === 'gl_accounts') STATE.ui.glAccounts = values;
    if(id === 'gl_partners') STATE.ui.glPartners = values;
    if(id === 'gl_journals') STATE.ui.glJournals = values;
    if(id === 'gl_costcenters') STATE.ui.glCostCenters = values;
    renderApp();
  };
  bindColFilterHandler([...Object.values(glColf), ...accColfIds]);
  const chk = document.getElementById('glShowOpeningChk');
  if(chk) chk.addEventListener('change', () => { STATE.ui.glShowOpening = chk.checked; renderApp(); });
  attachDebouncedSearchInput('glVoucherSearch', v => { STATE.ui.glVoucherSearch = v; });
  attachDebouncedSearchInput('glDescSearch', v => { STATE.ui.glDescSearch = v; });
  document.querySelectorAll('[data-gl-cur]').forEach(btn => btn.addEventListener('click', () => {
    STATE.ui.glCurrencyFilter = btn.dataset.glCur;
    renderApp();
  }));
  const glPagePrev = document.getElementById('glPagePrev');
  if(glPagePrev) glPagePrev.addEventListener('click', () => { STATE.ui.glPage = Math.max(0, (STATE.ui.glPage||0) - 1); renderApp(); });
  const glPageNext = document.getElementById('glPageNext');
  if(glPageNext) glPageNext.addEventListener('click', () => { STATE.ui.glPage = (STATE.ui.glPage||0) + 1; renderApp(); });
}

/* =========================================================================
   Partner statement view
   ========================================================================= */
// Generic partner/customer ledger page — used by BOTH "كشف عميل / مورد"
// (Customer Statement, restricted to CUSTOMER_STATEMENT_ACCOUNTS) and the
// "Other Debit / Credit Balances" page (req. 7, restricted to
// OTHER_BALANCES_PREFIXES accounts) so the two stay identical in behaviour
// by construction rather than by copy-paste.
function renderCustomerLedgerPage(root, cfg){
  // cfg: { title, msId, uiSelKey, uiCurKey, accountCodes, exportKey, exportFilename }
  if(!STATE.journal.length){ root.innerHTML = emptyState(t('noDataYet'),t('startImporting'),'import'); return; }
  const f = STATE.ui.filters;
  const curFilter = STATE.ui[cfg.uiCurKey] || 'ALL';
  const accountCodes = cfg.accountCodes; // exact list of allowed account codes for this page

  const inScope = l => accountCodes.includes(l.code);
  const partnerCurrency = {}; // partner -> Set of currencies of IN-SCOPE accounts they transacted on
  STATE.journal.forEach(l => { if(l.partner && inScope(l)){ const cur = (STATE.accountsByCode[l.code]||{}).currency || 'EGP'; (partnerCurrency[l.partner] = partnerCurrency[l.partner] || new Set()).add(cur); } });

  // Account sub-filter: lets the user narrow within this page's fixed account
  // set (e.g. only 112101 out of 112101/112201/211101/211201). Empty = all.
  const accOptions = accountCodes.map(c => `${c} — ${accName(c)}`).sort((a,b)=>a.localeCompare(b));
  const codeByAccLabel = {}; accountCodes.forEach(c => codeByAccLabel[`${c} — ${accName(c)}`] = c);
  const selectedAccLabels = (STATE.ui[cfg.uiAccKey]||[]);
  const selectedAccCodes = selectedAccLabels.map(l=>codeByAccLabel[l]).filter(Boolean);
  const scopedAccountCodes = selectedAccCodes.length ? selectedAccCodes : accountCodes;

  let allPartners = uniq(STATE.journal.filter(l=>l.partner && scopedAccountCodes.includes(l.code)).map(l=>l.partner)).sort((a,b)=>a.localeCompare(b,'ar'));
  // BUG FIX (currency filter bug): "EGP" is the base currency every account
  // has an equivalent in — selecting it must show ALL partners (each with
  // their EGP-equivalent ledger), not just partners whose account happens to
  // natively BE in EGP. Only a genuinely foreign currency filter (USD, etc.)
  // should narrow the partner list down to partners who actually have activity
  // in that specific foreign currency.
  if(curFilter !== 'ALL' && curFilter !== 'EGP') allPartners = allPartners.filter(p => partnerCurrency[p] && partnerCurrency[p].has(curFilter));
  if(!allPartners.length){ root.innerHTML = `<div class="card"><div class="empty">${t('noMatchForFilter')}</div></div>`; return; }

  // Default = ALL customers/vendors shown, none pre-selected — matches the
  // same "empty selection = show all" convention used by every other
  // multi-select filter in the app (accounts, journals, cost centers, etc.).
  // Previously this defaulted to a single auto-selected partner, which is
  // what caused the earlier "sticky first customer" confusion — now an empty
  // selection always means "all", full stop, with nothing pre-picked.
  const selectedPartners = (STATE.ui[cfg.uiSelKey]||[]).filter(p=>allPartners.includes(p));
  const displayPartners = selectedPartners.length ? selectedPartners : allPartners;

  const ledgerColfIds = [];
  function ledgerTable(rows, curLabel, idPrefix){
    const vk = 'custledger_' + idPrefix;
    const colf = { date:'colf_'+idPrefix+'_date', entry:'colf_'+idPrefix+'_entry', account:'colf_'+idPrefix+'_account', ref:'colf_'+idPrefix+'_ref', debit:'colf_'+idPrefix+'_debit', credit:'colf_'+idPrefix+'_credit', product:'colf_'+idPrefix+'_product', curAmt:'colf_'+idPrefix+'_curAmt', balance:'colf_'+idPrefix+'_balance' };
    ledgerColfIds.push(...Object.values(colf));
    const rowsF = rows.filter(r =>
      passesColFilter(colf.date, r.date) && passesColFilter(colf.entry, r.entry) && passesColFilter(colf.account, r.code+' '+(accName(r.code)||r.name||'')) &&
      passesColFilter(colf.ref, r.ref||'') && passesColFilter(colf.debit, r.dispDebit||0) && passesColFilter(colf.credit, r.dispCredit||0) &&
      passesColFilter(colf.product, r.product||'') && passesColFilter(colf.curAmt, r.curAmt||0) && passesColFilter(colf.balance, r.running));
    const sorted = applySort(vk, rowsF, (r,col) => col==='account' ? r.code+' '+(accName(r.code)||r.name||'') : r[col]);
    const totalDebit = rowsF.reduce((s,r)=>s+(r.dispDebit||0),0);
    const totalCredit = rowsF.reduce((s,r)=>s+(r.dispCredit||0),0);
    return `<div class="table-wrap" style="max-height:400px;overflow-y:auto">
      <table><thead><tr>
        ${filterableTh(vk,'date',t('date'),colf.date,rows.map(r=>r.date))}
        ${filterableTh(vk,'entry',t('entry'),colf.entry,rows.map(r=>r.entry))}
        ${filterableTh(vk,'account',t('account'),colf.account,rows.map(r=>r.code+' '+(accName(r.code)||r.name||'')))}
        ${filterableTh(vk,'ref',t('description'),colf.ref,rows.map(r=>r.ref||''))}
        ${filterableTh(vk,'dispDebit',t('debit')+' ('+curLabel+')',colf.debit,rows.map(r=>r.dispDebit||0),{extraClass:'num-cell',displayLabel:fmt})}
        ${filterableTh(vk,'dispCredit',t('credit')+' ('+curLabel+')',colf.credit,rows.map(r=>r.dispCredit||0),{extraClass:'num-cell',displayLabel:fmt})}
        ${filterableTh(vk,'product',t('productCol'),colf.product,rows.map(r=>r.product||''))}
        ${filterableTh(vk,'curAmt',t('origCurrencyAmountCol'),colf.curAmt,rows.map(r=>r.curAmt||0),{extraClass:'num-cell',displayLabel:fmt})}
        ${sortTh(vk,'convFactor',t('conversionFactorCol'),'num-cell')}
        ${filterableTh(vk,'running',t('balance'),colf.balance,rows.map(r=>r.running),{extraClass:'num-cell',displayLabel:fmt})}
      </tr></thead><tbody>
        ${sorted.length ? sorted.map(r=>{
          const hasFx = r.curAmt && r.cur && r.cur!=='EGP';
          const convFactor = hasFx ? (r.dispDebit||r.dispCredit)/Math.abs(r.curAmt) : null;
          return `<tr>
          <td class="num">${r.date}</td>
          <td class="num">${escapeHtml(r.entry)}</td>
          <td class="drill" onclick="drillToAccount('${r.code}')">${r.code} ${escapeHtml(accName(r.code)||r.name||'')}</td>
          <td>${escapeHtml(r.ref||'')}</td>
          <td class="num-cell num">${r.dispDebit?fmt(r.dispDebit):''}</td>
          <td class="num-cell num">${r.dispCredit?fmt(r.dispCredit):''}</td>
          <td>${r.product?escapeHtml(r.product):'—'}</td>
          <td class="num-cell num">${r.curAmt?fmt(r.curAmt)+' '+escapeHtml(r.cur||''):'—'}</td>
          <td class="num-cell num">${convFactor!=null?fmt(convFactor):'—'}</td>
          <td class="num-cell num ${r.running>=0?'pos-text':'neg-text'}">${fmt(r.running)}</td>
        </tr>`;}).join('') : `<tr><td colspan="10" class="empty">${t('noMovementInPeriod')}</td></tr>`}
        ${sorted.length ? `<tr class="total-row"><td colspan="4">${t('total')}</td><td class="num-cell num">${fmt(totalDebit)}</td><td class="num-cell num">${fmt(totalCredit)}</td><td></td><td></td><td></td><td></td></tr>` : ''}
      </tbody></table>
    </div>`;
  }

  const perPartner = displayPartners.map(p => {
    const stmt = partnerStatement(STATE.journal, p, f.start, f.end, {mode:'EGP', accountCodes: scopedAccountCodes});
    const stmtNative = partnerStatement(STATE.journal, p, f.start, f.end, {mode:'NATIVE', accountCodes: scopedAccountCodes});
    const foreignGroups = (stmtNative.byCurrency||[]).filter(g => g.currency !== 'EGP' && (g.rows.length || g.opening));
    return { name: p, stmt, foreignGroups };
  });
  const combinedBalance = perPartner.reduce((s,p)=>s+p.stmt.closing,0);
  const availableCurrencies = uniq(Object.values(partnerCurrency).flatMap(s=>[...s]));

  // Export: every visible row across the selected partners, EGP ledger
  const exportRows = [];
  perPartner.forEach(p => p.stmt.rows.forEach(r => {
    const hasFx = r.curAmt && r.cur && r.cur!=='EGP';
    const convFactor = hasFx ? (r.dispDebit||r.dispCredit)/Math.abs(r.curAmt) : '';
    exportRows.push([p.name, r.date, r.entry, `${r.code} ${accName(r.code)||r.name||''}`, r.ref||'', r.dispDebit, r.dispCredit, r.product||'', r.curAmt?`${r.curAmt} ${r.cur||''}`:'', convFactor, r.running]);
  }));
  registerExport(cfg.exportKey, cfg.exportFilename, [t('partnerColLabel'),t('date'),t('entry'),t('account'),t('description'),t('debit')+' EGP',t('credit')+' EGP',t('productCol'),t('origCurrencyAmountCol'),t('conversionFactorCol'),t('balance')], exportRows);

  root.innerHTML = `
    <div class="card">
      <h2>${ICONS.users.replace('currentColor','var(--gold-dim)')} ${escapeHtml(cfg.title)}</h2>
      <div style="display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:14px;">
        ${multiSelectHtml(cfg.msId, t('customersVendors'), allPartners, selectedPartners)}
        ${multiSelectHtml(cfg.accMsId, t('accountsSubfilter'), accOptions, selectedAccLabels)}
        <div>
          <label class="lbl">${t('currency')}</label>
          <div class="chip-btns">
            <button class="chip ${curFilter==='ALL'?'active':''}" data-cust-cur="ALL">${t('currencyAll')}</button>
            ${availableCurrencies.map(c=>`<button class="chip ${curFilter===c?'active':''}" data-cust-cur="${escapeHtml(c)}">${c==='EGP'?t('currencyEGPLabel'):c==='USD'?t('currencyUSDLabel'):escapeHtml(c)}</button>`).join('')}
          </div>
        </div>
        ${selectedPartners.length > 1 ? kpi(t('combinedSelectedBalance'), fmt(combinedBalance), combinedBalance>=0?'pos':'neg', `${selectedPartners.length} ${t('partnerCount')}`) : ''}
        ${exportBtnHtml(cfg.exportKey)}
      </div>
    </div>
    ${perPartner.map((p, pIdx) => `
      <div class="card">
        <div class="section-title"><span>${escapeHtml(p.name)}</span>
          <span class="hint">${t('currentBalance')}: ${fmt(Math.abs(p.stmt.closing))} (${p.stmt.closing>=0?t('debtorTo'):t('creditorFrom')})</span>
        </div>
        ${curFilter==='ALL' || curFilter==='EGP' ? ledgerTable(p.stmt.rows, 'EGP', cfg.exportKey+'_'+pIdx+'_egp') : ''}
        ${(curFilter==='ALL' || curFilter!=='EGP') && p.foreignGroups.length ? `
          ${curFilter==='ALL' ? `<div class="hint" style="margin:14px 0 4px">${t('foreignCurrencyNote')}</div>` : ''}
          ${p.foreignGroups.filter(g=>curFilter==='ALL'||g.currency===curFilter).map(g => `
            <div class="section-title"><span>${t('currencyOf')} ${escapeHtml(g.currency)}</span><span class="hint">${t('openingShort')} ${fmt(g.opening)} — ${t('closingShort')} ${fmt(g.closing)}</span></div>
            ${ledgerTable(g.rows, g.currency, cfg.exportKey+'_'+pIdx+'_'+g.currency)}
          `).join('')}
        ` : ''}
      </div>
    `).join('')}
  `;
  attachSortEvents();
  STATE.ui.__msHandler = (id, values) => {
    if(id === cfg.msId){ STATE.ui[cfg.uiSelKey] = values; renderApp(); }
    if(id === cfg.accMsId){ STATE.ui[cfg.uiAccKey] = values; renderApp(); }
  };
  bindColFilterHandler(ledgerColfIds);
  document.querySelectorAll('[data-cust-cur]').forEach(btn => btn.addEventListener('click', () => {
    STATE.ui[cfg.uiCurKey] = btn.dataset.custCur;
    // NOTE: previously this reset the partner selection to [] on every currency

// Cost Center drill-down (requirement 9): every number in the Cost Center
// report opens the exact source transactions behind it in a NEW tab.
function ccDrill(ccName, kind){
  // Navigates to the General Ledger, pre-filtered by cost center (and, for
  // revenue/cost specifically, by the matching account types too) — the same
  // in-app pattern as the Income Statement drill-down, instead of
  // window.open() which browsers often block as a pop-up.
  let names;
  if(ccName){
    names = [ccName];
  }else{
    const f = STATE.ui.filters;
    const _r = effectiveRange(f);
    const start = _r.start, end = periodFilterActive(f) ? '' : f.end;
    const cc = costCenterPL(filterLinesByPeriod(STATE.journal, f), start, end);
    const allNames = cc.map(c=>c.name);
    const selected = (STATE.ui.selectedCostCenters||[]).filter(n=>allNames.includes(n));
    const activeFilter = selected.length > 0 && selected.length < allNames.length;
    names = activeFilter ? selected : allNames;
  }
  STATE.ui.glCostCenters = names;
  STATE.ui.glPartners = [];
  STATE.ui.glJournals = [];
  if(kind === 'revenue'){
    STATE.ui.glAccounts = STATE.accounts.filter(a => { const cls = CLASS_MAP[a.type]; return cls && (cls.section==='REV'||cls.section==='OI'); }).map(a=>`${a.code} — ${accName(a.code)}`);
  }else if(kind === 'cost'){
    STATE.ui.glAccounts = STATE.accounts.filter(a => { const cls = CLASS_MAP[a.type]; return cls && ['COGS','EXP','DEP'].includes(cls.section); }).map(a=>`${a.code} — ${accName(a.code)}`);
  }else{
    STATE.ui.glAccounts = []; // profit/margin/total: show every account touched by this cost center
  }
  switchView('accountstatement');
}

function toggleISSection(key){ STATE.ui.expandedIS = STATE.ui.expandedIS || {}; STATE.ui.expandedIS[key] = !(STATE.ui.expandedIS[key] === true); renderApp(); }

function availableYears(lines){
  return uniq(lines.map(l=>l.date.slice(0,4))).sort();
}
function comparisonColumns(lines, mode, selections){
  const columns = [];
  if(mode === 'years'){
    (selections.years||[]).forEach(y => {
      const start = y+'-01-01', end = y+'-12-31';
      columns.push({ label:y, is: incomeStatement(lines,start,end), bs: balanceSheet(lines,end) });
    });
  } else if(mode === 'months'){
    const year = selections.year;
    (selections.months||[]).forEach(m => {
      const mi = parseInt(m,10);
      const start = `${year}-${pad2(mi)}-01`;
      const endD = new Date(parseInt(year,10), mi, 0);
      const end = `${endD.getFullYear()}-${pad2(endD.getMonth()+1)}-${pad2(endD.getDate())}`;
      columns.push({ label: `${year}/${pad2(mi)}`, is: incomeStatement(lines,start,end), bs: balanceSheet(lines,end) });
    });
  }
  return columns;
}

function renderStatementsView(root){
  if(!STATE.journal.length){ root.innerHTML = emptyState(t('noDataYet'),t('startImporting'),'import'); return; }
  const f = STATE.ui.filters;
  const pLines = filterLinesByPeriod(STATE.journal, f);
  const pStart = periodFilterActive(f) ? '' : f.start;
  const is = incomeStatement(pLines, pStart, f.end);
  const bs = balanceSheet(STATE.journal, f.end || todayISO());
  const balPeriod = computeBalances(pLines, f.end || todayISO(), pStart); // opening/movement/closing per account for THIS period

  STATE.ui.expandedIS = STATE.ui.expandedIS || {};
  STATE.ui.expandedBS = STATE.ui.expandedBS || {};

  function isSectionAccounts(types, flip){
    return Object.values(is.balMap).filter(r=>types.includes(r.type) && (r.debit-r.credit)!==0)
      .map(r=>({code:r.code, name:r.name, movement: flip ? -(r.debit-r.credit) : (r.debit-r.credit)}))
      .sort((a,b)=>a.code.localeCompare(b.code));
  }
  function isLine(key, label, val, types, flip, bold){
    const expanded = STATE.ui.expandedIS[key] === true; // default: collapsed
    const accounts = types ? isSectionAccounts(types, flip) : [];
    const toggle = types ? `<span class="drill" onclick="toggleISSection('${key}')" style="margin-left:6px;font-weight:800">${expanded?'−':'+'}</span>` : '';
    let html = `<tr class="${bold?'total-row':''}"><td>${toggle}${label}</td><td class="num-cell num ${val>=0?'':'neg-text'}">${fmt(val)}</td></tr>`;
    if(types && expanded){
      html += accounts.map(a=>`<tr><td style="padding-right:26px;font-size:12px" class="drill" onclick="drillToAccount('${a.code}')">${a.code} ${escapeHtml(a.name)}</td><td class="num-cell num" style="font-size:12px">${fmt(a.movement)}</td></tr>`).join('');
    }
    return html;
  }

  // Requirement: the Balance Sheet must be grouped exactly like the Chart of
  // Accounts tree, with its own levels (e.g. Assets → Current Assets → Cash
  // & Equivalents → ...), not a flat two-level "section header + account
  // list". This reuses the same group-nesting logic as buildAccountTree()
  // (nest by STATE.groups prefix ranges), but attaches balPeriod balances at
  // the leaves and rolls totals up through every level, restricted to
  // whichever account `types` belong to this call (Assets / Liabilities /
  // Equity) so that, e.g., the "الاصول" root node naturally ends up
  // containing "الأصول المتداولة" AND "الأصول الثابتة" as its own children,
  // exactly matching the chart of accounts structure.
  function buildBalanceSheetTree(types){
    const groups = STATE.groups.slice().sort((a,b)=>a.start.length-b.start.length || a.start.localeCompare(b.start));
    const nodes = {};
    groups.forEach(g => { nodes[g.start] = { key:'g:'+g.start, name:groupDisplayName(g), start:g.start, end:g.end, children:[], items:[] }; });
    const roots = [];
    groups.forEach(g => {
      const node = nodes[g.start];
      let bestParent = null;
      groups.forEach(p => {
        if(p.start.length < g.start.length && g.start.length > 0 && g.start.slice(0,p.start.length) >= p.start && g.start.slice(0,p.start.length) <= p.end){
          if(!bestParent || p.start.length > bestParent.start.length) bestParent = p;
        }
      });
      if(bestParent) nodes[bestParent.start].children.push(node);
      else roots.push(node);
    });
    const unclassified = { key:'g:unclassified', name:t('unclassifiedAccountsGroup'), start:'', children:[], items:[] };
    Object.values(balPeriod).forEach(r => {
      if(!types.includes(r.type)) return;
      if(r.opening===0 && r.debit===0 && r.credit===0 && r.closing===0) return; // no balance/activity in period — omit, same as before
      let best = null;
      groups.forEach(g => { if(codeInGroupRange(r.code, g)){ if(!best || g.start.length > best.start.length) best = g; } });
      if(best) nodes[best.start].items.push(r); else unclassified.items.push(r);
    });
    function sortNode(n){ n.children.sort((a,b)=>a.start.localeCompare(b.start)); n.items.sort((a,b)=>a.code.localeCompare(b.code)); n.children.forEach(sortNode); }
    roots.sort((a,b)=>a.start.localeCompare(b.start));
    roots.forEach(sortNode);
    if(unclassified.items.length) roots.push(unclassified);
    function hasAny(n){ return n.items.length>0 || n.children.some(hasAny); }
    function prune(n){ n.children = n.children.filter(hasAny); n.children.forEach(prune); }
    const nonEmpty = roots.filter(hasAny);
    nonEmpty.forEach(prune);
    function totals(n){
      let opening=0, debit=0, credit=0, closing=0;
      n.items.forEach(r=>{ opening+=r.opening; debit+=r.debit; credit+=r.credit; closing+=r.closing; });
      n.children.forEach(c=>{ const ct = totals(c); opening+=ct.opening; debit+=ct.debit; credit+=ct.credit; closing+=ct.closing; });
      n._totals = { opening, debit, credit, closing };
      return n._totals;
    }
    nonEmpty.forEach(totals);
    return nonEmpty;
  }

  function bsTreeNodeRows(node, depth, flipSign){
    const key = 'bst_' + node.key.replace(/[^a-zA-Z0-9]/g,'_');

function cfDrill(kind, code){
  // Navigates to the General Ledger (كشف الأستاذ العام), pre-filtered to the
  // exact accounts behind this figure — the SAME in-app pattern already used
  // by the Income Statement's drill-down (drillToAccount), instead of
  // window.open() which browsers often block as a pop-up.
  const excludeCodes = kind === 'financing' ? new Set(STATE.journal.filter(isClosingLine).map(l=>l.code)) : null;
  let codes;
  if(code){
    codes = [code];
  }else{
    const types = CF_TYPE_GROUPS[kind] || [];
    codes = STATE.accounts.filter(a => types.includes(a.type) && (!excludeCodes || !excludeCodes.has(a.code))).map(a=>a.code);
  }
  STATE.ui.glAccounts = codes.map(c => STATE.accountsByCode[c] ? `${c} — ${STATE.accountsByCode[c].name}` : c);
  STATE.ui.glPartners = [];
  STATE.ui.glJournals = [];
  STATE.ui.glCostCenters = [];
  switchView('accountstatement');
}

        ${filterableTh('cashflow','debit',t('debitDeposits'),cfColf.debit,cashRowsAll.map(r=>r.debit),{extraClass:'num-cell',displayLabel:fmt})}
        ${filterableTh('cashflow','credit',t('creditWithdrawals'),cfColf.credit,cashRowsAll.map(r=>r.credit),{extraClass:'num-cell',displayLabel:fmt})}
        ${filterableTh('cashflow','movement',t('netMovement'),cfColf.movement,cashRowsAll.map(r=>r.debit-r.credit),{extraClass:'num-cell',displayLabel:fmt})}
        ${filterableTh('cashflow','closing',t('closingBalanceShort2'),cfColf.closing,cashRowsAll.map(r=>r.closing),{extraClass:'num-cell',displayLabel:fmt})}
      </tr></thead><tbody>
        ${cashRows.length ? cashRowsSorted.map(r=>`<tr>
          <td class="drill" onclick="cfDrill(null,'${r.code}')">${r.code} ${escapeHtml(r.name)}</td>
          <td class="num-cell num">${fmt(r.opening)}</td>
          <td class="num-cell num">${fmt(r.debit)}</td>
          <td class="num-cell num">${fmt(r.credit)}</td>
          <td class="num-cell num drill ${(r.debit-r.credit)>=0?'':'neg-text'}" onclick="cfDrill(null,'${r.code}')">${fmt(r.debit-r.credit)}</td>
          <td class="num-cell num">${fmt(r.closing)}</td>
        </tr>`).join('') : `<tr><td colspan="6" class="empty">${t('noCashAccountsMovement')}</td></tr>`}
        <tr class="total-row">
          <td>${t('totalNetChange')}</td>
          <td class="num-cell num">${fmt(cashRows.reduce((s,r)=>s+r.opening,0))}</td>
          <td class="num-cell num">${fmt(cashRows.reduce((s,r)=>s+r.debit,0))}</td>
          <td class="num-cell num">${fmt(cashRows.reduce((s,r)=>s+r.credit,0))}</td>
          <td class="num-cell num drill" onclick="cfDrill('cash')">${fmt(cashRowsTotal)}</td>
          <td class="num-cell num">${fmt(cashRows.reduce((s,r)=>s+r.closing,0))}</td>
        </tr>
      </tbody></table></div>
    </div>
    <div class="card">
      <h2>${ICONS.scale.replace('currentColor','var(--gold-dim)')} ${t('reconciliationTitle')}</h2>
      <div class="desc">${t('reconciliationDesc')}</div>
      <div class="grid-3">
        <div class="kpi"><div class="lbl">${t('computedNetChange')}</div><div class="val num" style="font-size:16px">${fmt(cf.netChange)}</div></div>
        <div class="kpi"><div class="lbl">${t('actualCashChange')}</div><div class="val num drill" style="font-size:16px" onclick="cfDrill('cash')">${fmt(cf.cashDelta)}</div></div>
        <div class="kpi ${Math.abs(cf.diff)<1?'pos':'neg'}"><div class="lbl">${t('difference')}</div><div class="val num" style="font-size:16px">${fmt(cf.diff)}</div></div>
      </div>
      ${Math.abs(cf.diff)>=1 ? `<div class="progress-note" style="color:var(--brick)">${t('reconciliationDiff')}</div>` : `<div class="progress-note" style="color:var(--emerald)">${t('reconciliationOk')}</div>`}
      <div class="section-title" style="margin-top:18px"><span>${t('ias7ValidationTitle')}</span></div>
      <div class="desc">${t('ias7ValidationDesc')}</div>
      <div class="grid-3">
        <div class="kpi"><div class="lbl">${t('cfCashEndingFormula')}</div><div class="val num" style="font-size:16px">${fmt(cf.cashEndingComputed)}</div></div>
        <div class="kpi"><div class="lbl">${t('cfCashEndingActual')}</div><div class="val num drill" style="font-size:16px" onclick="cfDrill('cash')">${fmt(cf.cashEndingActual)}</div></div>
        <div class="kpi ${Math.abs(cf.endingDiff)<1?'pos':'neg'}"><div class="lbl">${t('cfEndingVariance')}</div><div class="val num" style="font-size:16px">${fmt(cf.endingDiff)}</div></div>
      </div>
      ${Math.abs(cf.endingDiff)>=1 ? `<div class="progress-note" style="color:var(--brick)">⚠ ${t('cfEndingVarianceWarning')} ${fmt(cf.endingDiff)}</div>` : `<div class="progress-note" style="color:var(--emerald)">${t('cfEndingVarianceOk')}</div>`}
    </div>
  `;
  attachSortEvents();
  bindColFilterHandler(Object.values(cfColf));
}

/* =========================================================================
   Ratios view
   ========================================================================= */
function renderRatiosView(root){
  if(!STATE.journal.length){ root.innerHTML = emptyState(t('noDataYet'),t('startImporting'),'import'); return; }
  const f = STATE.ui.filters;
  const lines = filterLinesByPeriod(STATE.journal, f);
  const _r = effectiveRange(f);
  const asOf = asOfDateForFilters(f);
  const is = incomeStatement(lines, _r.start, _r.end);
  const bs = balanceSheet(STATE.journal, asOf);
  const r = ratios(is, bs);

  // One batch pass over the trailing 6 months powers every chart on this
  // page (item 1: "every ratio should have its own chart, must update
  // instantly when filters change") — computed once here and sliced per
  // card below, instead of each card re-scanning the journal independently.
  const monthly = trailingMonthlyRatios(6);
  const s = (key) => monthly.map(m => m[key]);

  root.innerHTML = `
    ${currencyNote()}
    <div class="card">
      <h2>${ICONS.ratio.replace('currentColor','var(--gold-dim)')} ${t('liquidityRatios')}</h2>
      <div class="desc">${t('asOfRatiosNote')} <strong class="num">${asOf}</strong></div>
      <div class="grid-4">
        ${rcardGauge(t('currentRatio'), r.currentRatio, '', t('currentRatioNote'), 1.5, false, s('currentRatio'))}
        ${rcardGauge(t('quickRatio'), r.quickRatio, '', t('quickRatioNote'), 1, false, s('quickRatio'))}
        ${rcardGauge(t('cashRatioLabel'), r.cashRatio, '', t('cashRatioNote'), 0.5, false, s('cashRatio'))}
        ${rcardSpark(t('workingCapitalRatio'), r.workingCapital, '', t('workingCapitalNote'), s('workingCapital'))}
      </div>
    </div>
    <div class="card">
      <h2>${ICONS.ratio.replace('currentColor','var(--gold-dim)')} ${t('workingCapitalEfficiencyTitle')}</h2>
      <div class="desc">${t('asOfRatiosNote')} <strong class="num">${asOf}</strong></div>
      <div class="grid-3">
        ${rcardSpark(t('receivableTurnoverLabel'), r.receivableTurnover, '', t('receivableTurnoverNote'), s('receivableTurnover'))}
        ${rcardSpark(t('receivableDaysLabel'), r.receivableDays, '', t('receivableDaysNote'), s('receivableDays'))}
        ${rcardSpark(t('cashConversionCycleLabel'), r.cashConversionCycle, '', t('cashConversionCycleNote'), s('cashConversionCycle'))}
        ${rcardSpark(t('payableTurnoverLabel'), r.payableTurnover, '', t('payableTurnoverNote'), s('payableTurnover'))}
        ${rcardSpark(t('payableDaysLabel'), r.payableDays, '', t('payableDaysNote'), s('payableDays'))}
      </div>
    </div>
    <div class="card">
      <h2>${ICONS.scale.replace('currentColor','var(--gold-dim)')} ${t('leverageRatios')}</h2>
      <div class="desc">${t('asOfRatiosNote')} <strong class="num">${asOf}</strong></div>
      <div class="grid-4">
        ${rcardGauge(t('debtToAssets'), r.debtRatio!=null?r.debtRatio*100:null, '%', t('debtToAssetsNote'), 50, true, s('debtRatio').map(v=>v!=null?v*100:null))}
        ${rcardGauge(t('debtToEquityRatio'), r.debtToEquity, '', t('debtToEquityNote'), 1, true, s('debtToEquity'))}
        ${rcardSpark(t('totalLiabilities'), bs.liabilities, '', `${t('asOfLabel')} ${asOf}`, s('__liabilities'))}
        ${rcardSpark(t('totalEquity'), bs.equityTotal, '', `${t('asOfLabel')} ${asOf}`, s('__equity'))}
      </div>
    </div>
    <div class="card">
      <h2>${ICONS.statement.replace('currentColor','var(--gold-dim)')} ${t('profitabilityRatios')}</h2>
      <div class="grid-4">
        ${rcardSpark(t('grossMarginRatio'), r.grossMargin, '%', t('grossMarginNote'), s('grossMargin'))}
        ${rcardSpark(t('operatingMarginRatio'), r.operatingMargin, '%', t('operatingMarginNote'), s('operatingMargin'))}
        ${rcardSpark(t('netMarginRatio'), r.netMargin, '%', t('netMarginNote'), s('netMargin'))}
        ${rcardSpark(t('roaRatio'), r.roa, '%', t('roaNote'), s('roa'))}
      </div>
      <div class="grid-4" style="margin-top:16px">
        ${rcardSpark(t('roeRatio'), r.roe, '%', t('roeNote'), s('roe'))}
        ${rcardSpark(t('netIncomeLabel'), is.netIncome, '', periodFilterActive(f) ? periodLabelForFilters(f) : `${t('from')} ${f.start||t('activityStart')} ${t('to')} ${f.end}`, s('__netIncome'))}
        ${rcardSpark(t('totalRevenueLabel'), is.revenue+is.otherIncome, '', '', s('__revenue'))}
        ${rcardSpark(t('totalCostsExpenses'), is.cogs+is.expenses+is.depreciation, '', '', s('__costs'))}
      </div>
    </div>
    <div class="card">
      <div class="hint">${t('ratiosDisclaimer')}</div>
    </div>
  `;
}

/* =========================================================================
   Notes & Financial Analysis view
   ========================================================================= */
function renderNotesView(root){
  if(!STATE.journal.length){ root.innerHTML = emptyState(t('noDataYet'),t('startImporting'),'import'); return; }
  const f = STATE.ui.filters;
  const a = generateAnalysis(STATE.journal, f.start, f.end);

  function bulletList(items, cls){
    if(!items.length) return `<div class="hint">${t('noNotesInSection')}</div>`;
    return `<ul style="margin:0;padding-${document.dir==='rtl'?'right':'left'}:18px;line-height:1.9">${items.map(t=>`<li class="${cls||''}" style="margin-bottom:6px">${t}</li>`).join('')}</ul>`;
  }

  root.innerHTML = `
    ${currencyNote()}
    <div class="card">
      <h2>${ICONS.notes.replace('currentColor','var(--gold-dim)')} ${t('performanceSummary')}</h2>
      <div class="desc">${t('from')} ${f.start||t('activityStart')} ${t('to')} ${f.end} — ${t('analysisFromRealData')}</div>
      <div class="grid-4">
        ${kpi(t('netIncomeLoss'), fmt(a.is.netIncome), a.is.netIncome>=0?'pos':'neg', '')}
        ${kpi(t('netProfitMargin'), a.r.netMargin!=null?fmt(a.r.netMargin)+'%':'—', a.r.netMargin>=0?'pos':'neg', '')}
        ${kpi(t('currentRatio'), a.r.currentRatio!=null?fmt(a.r.currentRatio):'—', '', '')}
        ${kpi(t('operatingCashFlow'), fmt(a.cf.operating), a.cf.operating>=0?'pos':'neg', '')}
      </div>
    </div>

    <div class="grid-2">
      <div class="card" style="border-top-color:var(--emerald)">
        <h2 style="color:var(--emerald)">${t('strengthsTitle')}</h2>
        ${bulletList(a.strengths)}
      </div>
      <div class="card" style="border-top-color:var(--brick)">
        <h2 style="color:var(--brick)">${t('weaknessesTitle')}</h2>
        ${bulletList(a.weaknesses)}
      </div>
    </div>

    <div class="card">
      <h2>${ICONS.ratio.replace('currentColor','var(--gold-dim)')} ${t('recommendationsTitle')}</h2>
      ${bulletList(a.recommendations)}
    </div>

    <div class="card">
      <h2>${ICONS.clock.replace('currentColor','var(--gold-dim)')} ${t('notesChangesTitle')}</h2>
      ${bulletList(a.notes)}
    </div>

    <div class="card">
      <h2>${ICONS.scale.replace('currentColor','var(--gold-dim)')} ${t('keyFiguresExplained')}</h2>
      <div class="table-wrap"><table><tbody>
        <tr><td>${t('totalRevenueLabel')}</td><td class="num-cell num">${fmt(a.is.revenue+a.is.otherIncome)}</td><td class="hint">${t('totalRevenueNote')}</td></tr>
        <tr><td>${t('totalCostsExpenses')}</td><td class="num-cell num">${fmt(a.is.cogs+a.is.expenses+a.is.depreciation)}</td><td class="hint">${t('totalCostsNote')}</td></tr>
        <tr><td>${t('totalAssets')}</td><td class="num-cell num">${fmt(a.bs.assets)}</td><td class="hint">${t('totalAssetsNote')} ${f.end||todayISO()}${t('includesAllAssets')}</td></tr>
        <tr><td>${t('totalLiabilities')}</td><td class="num-cell num">${fmt(a.bs.liabilities)}</td><td class="hint">${t('totalLiabilitiesNote')} ${f.end||todayISO()}.</td></tr>
        <tr><td>${t('netEquity')}</td><td class="num-cell num">${fmt(a.bs.equityTotal)}</td><td class="hint">${t('netEquityNote')}</td></tr>
      </tbody></table></div>
    </div>
  `;
}

/* =========================================================================
   AI Assistant (Chat) view
   ========================================================================= */
function renderAiChatView(root){
  const msgs = STATE.ui.chatMessages || [];
  root.innerHTML = `
    <div class="card" style="border-top-color:var(--gold)">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap">
        <div>
          <h2>${ICONS.chat.replace('currentColor','var(--gold-dim)')} ${t('aiAssistantTitle')}</h2>
          <div class="desc">${t('aiAssistantDesc')}</div>
        </div>
        ${msgs.length ? `<button class="btn btn-outline" id="chatClearBtn" style="padding:6px 12px;font-size:11.5px">${t('clearConversation')}</button>` : ''}
      </div>
      <div id="chatLog" style="max-height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px;margin-bottom:12px;">
        ${msgs.length ? msgs.map(m => `
          <div style="align-self:${m.role==='user'?'flex-start':'flex-end'};max-width:80%;">
            <div style="background:${m.role==='user'?'var(--paper-2)':'var(--ink-2)'};color:${m.role==='user'?'var(--ink)':'var(--paper)'};padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.8;">
              ${escapeHtml(m.text)}
              ${m.action ? `<div style="margin-top:8px"><button class="btn btn-gold" style="padding:5px 12px;font-size:11.5px" onclick="handleChatAction(${JSON.stringify(m.action).replace(/"/g,'&quot;')})">${escapeHtml(m.action.label)}</button></div>` : ''}
            </div>
          </div>
        `).join('') : `
          <div class="empty" style="text-align:right;padding:14px 16px">
            <div style="font-weight:800;color:var(--ink);margin-bottom:8px">${t('chatCapabilitiesTitle')}</div>
            <ul style="margin:0 0 10px;padding-inline-start:20px;line-height:2;font-size:12.5px;color:var(--ink-soft)">
              <li>${t('chatCapCat1')}</li>
              <li>${t('chatCapCat2')}</li>
              <li>${t('chatCapCat3')}</li>
              <li>${t('chatCapCat4')}</li>
              <li>${t('chatCapCat5')}</li>
              <li>${t('chatCapCat6')}</li>
            </ul>
            <div>${t('chatEmptyPrompt')}</div>
          </div>
        `}
      </div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="chatInput" class="input" style="flex:1" placeholder="${t('chatInputPlaceholder')}">
        <button class="btn btn-gold" id="chatSendBtn">${t('send')}</button>
      </div>
      <div style="margin-top:10px">
        <div class="hint" style="margin-bottom:6px">${t('chatSuggestionsTitle')}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${[
            'كم بلغت المبيعات هذا الشهر؟','من أكبر عميل؟','من أكبر مورد؟','اعرض أرصدة البنوك','اعرض أكبر المصروفات',
            'ما هو هامش الربح؟','نسبة التداول كام؟','التدفق النقدي','هل ميزان المراجعة متوازن؟','فيه قيود مكررة؟',
            'أعلى 5 عملاء','أعلى 5 موردين','اتجاه الإيرادات آخر 6 شهور','عدد القيود المحمّلة','قارن هذا الشهر بالشهر اللي فات','مساعدة',
          ].map(s=>`<button class="chip" onclick="sendChatQuestion('${jsAttrEscape(s)}')">${escapeHtml(s)}</button>`).join('')}
        </div>
      </div>
    </div>
  `;
  const log = document.getElementById('chatLog');
  if(log) log.scrollTop = log.scrollHeight;
  const input = document.getElementById('chatInput');
  const send = () => {
    const val = input.value.trim();
    if(!val) return;
    sendChatQuestion(val);
  };
  document.getElementById('chatSendBtn').addEventListener('click', send);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });
  input.focus();
  const clearBtn = document.getElementById('chatClearBtn');
  if(clearBtn) clearBtn.addEventListener('click', () => {
    STATE.ui.chatMessages = [];
    STATE.ui.chatContext = {};
    renderApp();
  });
}

function sendChatQuestion(text){
  STATE.ui.chatMessages = STATE.ui.chatMessages || [];
  STATE.ui.chatMessages.push({ role:'user', text });
  const answer = answerQuery(text);
  STATE.ui.chatMessages.push({ role:'assistant', text: answer.text, action: answer.action || null });
  renderApp();
}

function handleChatAction(action){
  if(!action || !action.view) return;
  if(action.account) STATE.ui.glAccounts = (() => { const a = STATE.accountsByCode[action.account]; return a ? [`${a.code} — ${accName(a.code)}`] : []; })();
  if(action.partner){ STATE.ui.selectedPartner = action.partner; STATE.ui.glPartnersStmt = [action.partner]; }
  switchView(action.view);
}

</script>
</body>
