// View & manage a project's transaction history (deal/collection/invoicing entries).
function openProjectTxModal(projectId){
  const overlay = document.getElementById('projectTxModalOverlay');
  if(!overlay) return;
  const project = STATE.projects.find(p=>p.id===projectId);
  if(!project) return;
  let showAddForm = false;
  let editingRowId = null; // null = adding a new transaction; set = editing this existing one
  let localSort = { col: 'date', dir: 'asc' }; // this modal has its own render() loop (not the global renderApp()), so sorting is handled locally rather than via the shared filterableTh/toggleSort machinery
  function txSortValue(tx, col){
    if(col==='amount') return tx.amount||0;
    if(col==='exRate') return tx.exRate||0;
    if(col==='type') return tx.type==='deal'?t('txTypeDeal'):tx.type==='collection'?t('txTypeCollection'):t('txTypeInvoicing');
    return tx[col]||'';
  }
  function localSortTh(col, label, extraClass){
    const active = localSort.col === col;
    const arrow = active ? (localSort.dir==='asc'?' ▲':' ▼') : '';
    return `<th class="sortable-th${extraClass?' '+extraClass:''}" data-local-sort-col="${col}">${label}${arrow}</th>`;
  }

  function render(){
    const txs = projectTxFor(projectId);
    const sortedTxs = [...txs].sort((a,b) => {
      const va = txSortValue(a, localSort.col), vb = txSortValue(b, localSort.col);
      const cmp = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va).localeCompare(String(vb), 'ar');
      return localSort.dir === 'asc' ? cmp : -cmp;
    });
    const tot = projectTotals(project);
    const editing = editingRowId ? txs.find(tx=>tx.rowId===editingRowId) : null;
    overlay.innerHTML = `
      <div class="modal-box" style="max-width:720px;width:96%">
        <h3>${t('projectTxModalTitle')} — ${escapeHtml(project.name)} (${project.id})</h3>
        <div class="grid-3" style="margin-bottom:12px">
          ${kpi(t('projectAmountCol'), fmt(project.amount)+' '+project.currency, '', '')}
          ${kpi(t('projectCollectedCol'), fmt(tot.collections), '', '')}
          ${kpi(t('projectRemainingCol'), fmt(tot.remaining), tot.remaining>0?'neg':'pos', '')}
        </div>
        <div class="table-wrap" style="max-height:320px;overflow:auto">
          <table><thead><tr>
            ${localSortTh('date',t('txDateCol'))}${localSortTh('type',t('txTypeCol'))}${localSortTh('amount',t('txAmountCol'),'num-cell')}${localSortTh('invoiceNo',t('txInvoiceNoCol'))}${localSortTh('exRate',t('txExRateCol'))}${localSortTh('remarks',t('txRemarksCol'))}<th></th>
          </tr></thead><tbody>
            ${sortedTxs.length ? sortedTxs.map(tx=>`<tr>
              <td class="num">${tx.date}</td>
              <td><span class="pill pill-gold">${tx.type==='deal'?t('txTypeDeal'):tx.type==='collection'?t('txTypeCollection'):t('txTypeInvoicing')}</span></td>
              <td class="num-cell num">${fmt(tx.amount)}</td>
              <td class="num">${escapeHtml(tx.invoiceNo||'—')}</td>
              <td class="num">${tx.exRate?fmt(tx.exRate):'—'}</td>
              <td>${escapeHtml(tx.remarks||'—')}</td>
              <td style="white-space:nowrap">
                <span class="drill" title="${t('editTxBtn')}" data-edit-tx="${tx.rowId}">✎</span>
                <span class="drill" title="${t('deleteTxConfirm')}" data-del-tx="${tx.rowId}" style="color:var(--brick);margin-inline-start:6px">✕</span>
              </td>
            </tr>`).join('') : `<tr><td colspan="7" class="empty">${t('noTxYet')}</td></tr>`}
          </tbody></table>
        </div>
        ${(showAddForm || editing) ? `
          <div class="card" style="margin:12px 0;background:var(--paper-2)">
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">
              <div><label class="lbl">${t('txTypeCol')}</label>
                <select class="input" id="txType">
                  <option value="deal" ${editing&&editing.type==='deal'?'selected':''}>${t('txTypeDeal')}</option>
                  <option value="collection" ${!editing||editing.type==='collection'?'selected':''}>${t('txTypeCollection')}</option>
                  <option value="invoicing" ${editing&&editing.type==='invoicing'?'selected':''}>${t('txTypeInvoicing')}</option>
                </select>
              </div>
              <div><label class="lbl">${t('txDateCol')}</label><input type="date" class="input" id="txDate" value="${editing?editing.date:todayISO()}"></div>
              <div><label class="lbl">${t('txAmountCol')}</label><input type="number" step="0.01" class="input" id="txAmount" style="width:110px" value="${editing?editing.amount:0}"></div>
              <div><label class="lbl">${t('txInvoiceNoCol')}</label><input type="text" class="input" id="txInvoiceNo" style="width:110px" value="${escapeHtml(editing&&editing.invoiceNo||'')}"></div>
              ${project.currency==='USD' ? `<div><label class="lbl">${t('txExRateCol')}</label><input type="number" step="0.0001" class="input" id="txExRate" style="width:100px" value="${editing&&editing.exRate?editing.exRate:''}"></div>` : ''}
              <div style="flex:1;min-width:140px"><label class="lbl">${t('txRemarksCol')}</label><input type="text" class="input" id="txRemarks" style="width:100%" value="${escapeHtml(editing&&editing.remarks||'')}"></div>
              <button type="button" class="btn btn-gold" id="txSave">${t('saveProjectBtn')}</button>
              ${editing ? `<button type="button" class="btn btn-outline" id="txCancelEdit">${t('cancelEdit')}</button>` : ''}
            </div>
          </div>
        ` : ''}
        <div class="modal-actions" style="justify-content:space-between">
          <button type="button" class="btn btn-outline" id="txAddToggle">${t('addTxBtn')}</button>
          <button type="button" class="btn btn-outline" id="txClose">${t('done')}</button>
        </div>
      </div>
    `;
    overlay.style.display = 'flex';
    document.getElementById('txClose').addEventListener('click', close);
    overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
    overlay.querySelectorAll('[data-local-sort-col]').forEach(th => th.addEventListener('click', () => {
      const col = th.dataset.localSortCol;
      if(localSort.col === col) localSort.dir = localSort.dir === 'asc' ? 'desc' : 'asc';
      else { localSort.col = col; localSort.dir = 'asc'; }
      render();
    }));
    document.getElementById('txAddToggle').addEventListener('click', () => { showAddForm = !showAddForm; editingRowId = null; render(); });
    const cancelEditBtn = document.getElementById('txCancelEdit');
    if(cancelEditBtn) cancelEditBtn.addEventListener('click', () => { editingRowId = null; render(); });
    overlay.querySelectorAll('[data-edit-tx]').forEach(el => el.addEventListener('click', () => {
      editingRowId = el.dataset.editTx;
      showAddForm = false;
      render();
    }));
    overlay.querySelectorAll('[data-del-tx]').forEach(el => el.addEventListener('click', () => {
      const rowId = el.dataset.delTx;
      showConfirmModal(t('addTxBtn'), t('deleteTxConfirm'), async () => {
        STATE.projectTx = STATE.projectTx.filter(tx=>tx.rowId!==rowId);
        await storeSet('projectTx', STATE.projectTx);
        if(editingRowId===rowId) editingRowId = null;
        render();
      });
    }));
    const txSaveBtn = document.getElementById('txSave');
    if(txSaveBtn) txSaveBtn.addEventListener('click', async () => {
      const type = document.getElementById('txType').value;
      const date = document.getElementById('txDate').value;
      const amount = Number(document.getElementById('txAmount').value) || 0;
      if(!date || amount <= 0){ showToast(t('txAmountCol')); return; }
      const invoiceNo = document.getElementById('txInvoiceNo').value.trim();
      const exRateEl = document.getElementById('txExRate');
      const remarks = document.getElementById('txRemarks').value.trim();
      const exRate = exRateEl ? (Number(exRateEl.value)||null) : null;
      if(editingRowId){
        const tx = STATE.projectTx.find(x=>x.rowId===editingRowId);
        if(tx) Object.assign(tx, { date, type, amount, invoiceNo, exRate, remarks });
      } else {
        STATE.projectTx.push({ rowId: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), projectId, date, type, amount, invoiceNo, exRate, remarks });
      }
      await storeSet('projectTx', STATE.projectTx);
      showAddForm = false;
      editingRowId = null;
      render();
    });
  }
  function close(){ overlay.style.display = 'none'; overlay.innerHTML = ''; renderApp(); }
  render();
}

function openEditJournalEntryModal(entry, date){
  const overlay = document.getElementById('editEntryModalOverlay');
  if(!overlay) return;
  const originalLines = STATE.journal.filter(l => l.entry === entry && l.date === date);
  if(!originalLines.length){ showToast(t('entryNotFoundError')); return; }
  // Working copy for the form — cloned so cancelling never touches STATE.journal.
  let draft = originalLines.map(l => ({...l}));
  const accountOptions = STATE.accounts.slice().sort((a,b)=>a.code.localeCompare(b.code));

  function computeTotals(){
    const totalDebit = draft.reduce((s,l)=>s+(Number(l.debit)||0),0);
    const totalCredit = draft.reduce((s,l)=>s+(Number(l.credit)||0),0);
    return { totalDebit, totalCredit, diff: totalDebit - totalCredit };
  }
  function closeModal(){ overlay.style.display = 'none'; overlay.innerHTML = ''; }

  function renderModal(){
    const { totalDebit, totalCredit, diff } = computeTotals();
    const balanced = Math.abs(diff) < 0.01;
    overlay.innerHTML = `
      <div class="modal-box" style="max-width:920px;width:96%">
        <h3>${t('editEntryTitle')} — ${escapeHtml(entry)} (${date})</h3>
        <p>${t('editEntryDesc')}</p>

            <th>${t('entryLineDate')}</th><th>${t('entryLineAccount')}</th><th>${t('entryLinePartner')}</th>
            <th>${t('entryLineDesc')}</th><th>${t('entryLineDebit')}</th><th>${t('entryLineCredit')}</th>
            <th>${t('entryLineCostCenter')}</th><th>${t('entryLineProduct')}</th><th></th>
          </tr></thead><tbody>
            ${draft.map((l,i)=>`<tr>
              <td><input type="date" class="input" data-ee-field="date" data-ee-i="${i}" value="${l.date}" style="min-width:130px"></td>
              <td><select class="input" data-ee-field="code" data-ee-i="${i}" style="min-width:220px">
                ${accountOptions.map(a=>`<option value="${a.code}" ${a.code===l.code?'selected':''}>${a.code} — ${escapeHtml(accName(a.code))}</option>`).join('')}
              </select></td>
              <td><input type="text" class="input" data-ee-field="partner" data-ee-i="${i}" value="${escapeHtml(l.partner||'')}" style="min-width:120px"></td>
              <td><input type="text" class="input" data-ee-field="ref" data-ee-i="${i}" value="${escapeHtml(l.ref||'')}" style="min-width:150px"></td>
              <td><input type="number" step="0.01" class="input" data-ee-field="debit" data-ee-i="${i}" value="${l.debit||0}" style="width:100px"></td>
              <td><input type="number" step="0.01" class="input" data-ee-field="credit" data-ee-i="${i}" value="${l.credit||0}" style="width:100px"></td>
              <td><input type="text" class="input" data-ee-field="cc" data-ee-i="${i}" value="${escapeHtml(l.cc||'')}" style="width:100px"></td>
              <td><input type="text" class="input" data-ee-field="product" data-ee-i="${i}" value="${escapeHtml(l.product||'')}" style="width:100px"></td>
              <td><button type="button" class="chip" title="${t('removeLine')}" data-ee-remove="${i}" style="color:var(--brick);border-color:var(--brick)">✕</button></td>
            </tr>`).join('')}
          </tbody></table>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0;flex-wrap:wrap;gap:8px">
          <button type="button" class="btn btn-outline" id="eeAddLine">+ ${t('addLine')}</button>
          <div style="font-size:13px">
            ${t('entryTotalsLabel')}: <b class="num">${fmt(totalDebit)}</b> / <b class="num">${fmt(totalCredit)}</b>
            — ${t('entryDiffLabel')}: <b class="num ${balanced?'':'neg-text'}">${fmt(diff)}</b>
          </div>

        ${!balanced ? `<div class="progress-note" style="color:var(--brick)">${t('entryUnbalanced')}</div>` : ''}

          </div>
        </div>
      </div>
    `;
    overlay.style.display = 'flex';

    overlay.querySelectorAll('[data-ee-field]').forEach(inp => {
      inp.addEventListener('input', () => {
        const i = Number(inp.dataset.eeI);

          draft[i][field] = Number(inp.value) || 0;
        } else if(field === 'code'){
          draft[i].code = inp.value;
          const acc = STATE.accountsByCode[inp.value];
          draft[i].name = acc ? acc.name : draft[i].name;
        } else {
          draft[i][field] = inp.value;
        }
        renderModal(); // cheap re-render (short list) to refresh totals live
      });
    });
    overlay.querySelectorAll('[data-ee-remove]').forEach(btn => btn.addEventListener('click', () => {
      const i = Number(btn.dataset.eeRemove);
      if(draft.length <= 1){ showToast(t('entryNeedsOneLine')); return; }
      draft.splice(i,1);
      renderModal();
    }));
    document.getElementById('eeAddLine').addEventListener('click', () => {
      const ref0 = draft[0] || {};
      draft.push({ entry, date: ref0.date || date, code:'', name:'', cur: ref0.cur||'', partner:'', debit:0, credit:0, cc:'', ccAmt:0, product:'', journal: ref0.journal||'', curAmt:0, ref:'', source: ref0.source||'manual-edit' });
      renderModal();
    });
    document.getElementById('eeCancel').addEventListener('click', closeModal);
    document.getElementById('eeDelete').addEventListener('click', () => {
      showConfirmModal(t('deleteEntry'), t('deleteEntryConfirm'), async () => {
        await commitEntryEdit(originalLines, []);
        closeModal();
      });
    });
    document.getElementById('eeSave').addEventListener('click', async () => {
      const totals = computeTotals();
      if(Math.abs(totals.diff) >= 0.01){ showToast(t('entryUnbalanced')); return; }
      if(draft.some(l => !l.code || !STATE.accountsByCode[l.code])){ showToast(t('entryMissingAccount')); return; }
      await commitEntryEdit(originalLines, draft);
      closeModal();
    });
    overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
  }
  renderModal();
}

// Applies an edited/deleted voucher back into STATE.journal and the
// year-sharded persistent storage (same 'journal:<year>' shards the importer
// uses) — replacing the original lines with the (possibly empty, for a
// delete) new set, and re-deriving every affected year's shard from the
// in-memory journal so storage always matches STATE exactly.
async function commitEntryEdit(originalLines, newLines){
  const affectedYears = new Set();
  originalLines.forEach(l => affectedYears.add(l.date.slice(0,4)));
  newLines.forEach(l => affectedYears.add(l.date.slice(0,4)));

  // Requirement: keep a record of every edit/delete made to a journal entry
  // through the app (not the import process), so a mistake can be reviewed —
  // what the entry looked like before, and what it became after.
  const snapshot = l => ({ code:l.code, name:accName(l.code), debit:l.debit, credit:l.credit, partner:l.partner||'', ref:l.ref||'', date:l.date });
  const auditEntry = {
    at: new Date().toISOString(),
    entry: (originalLines[0]||newLines[0]||{}).entry || '',
    date: (originalLines[0]||newLines[0]||{}).date || '',
    action: newLines.length ? 'edit' : 'delete',
    before: originalLines.map(snapshot),
    after: newLines.map(snapshot),
  };
  const auditLog = (await storeGet('edit_audit_log')) || [];
  auditLog.unshift(auditEntry);
  if(auditLog.length > 200) auditLog.length = 200; // cap growth — this is a review log, not a full ledger history
  await storeSet('edit_audit_log', auditLog);

  const toRemove = new Set(originalLines);
  STATE.journal = STATE.journal.filter(l => !toRemove.has(l));

  let seqCounter = STATE.meta.journalSeqCounter || 0;
  newLines.forEach(l => { if(!l.seq){ seqCounter++; l.seq = seqCounter; } });
  STATE.meta.journalSeqCounter = seqCounter;

  STATE.journal = STATE.journal.concat(newLines);
  STATE.meta.totalLines = STATE.journal.length;

  for(const y of affectedYears){
    const shard = STATE.journal.filter(l => l.date.slice(0,4) === y);
    await storeSet('journal:' + y, shard);
  }
  await storeSet('meta', STATE.meta);
  showToast(t('entrySavedOk'));
  renderApp();
}
async function resetSystem(){
  showResetConfirmModal(async () => {
    showToast('جاري حذف كل البيانات...');
    let accountsOk = false, groupsOk = false, journalOk = false;
    try{
      // Delete every journal shard + meta. A single delete call per key
      // (no per-key read-verify loop) — the previous version issued up to
      // 3× get+delete per key, which for a company with several years of
      // data could add up to dozens of rapid-fire storage calls in a burst
      // and risk hitting the backend's rate limit, silently causing some of
      // the writes further down (the critical accounts/groups reset) to fail.
      const journalKeys = await storeList('journal:');
      for(const k of [...journalKeys, 'meta']){ try{ await storeDelete(k); }catch(e){} }

      // Chart of Accounts / Account Groups: explicitly SET to an empty array
      // (not deleted). This file ships with this company's real chart of
      // accounts embedded in it (window.__ACCOUNTS__/__GROUPS__) as a
      // convenience default; merely deleting the keys is indistinguishable
      // from "never imported yet" and silently reseeds those same embedded
      // accounts right back on the next load — which is exactly the bug
      // being reported. Storing `[]` explicitly is what initApp() recognizes
      // as "the user reset this on purpose".
      const verifyEmpty = async (key) => {
        for(let attempt=0; attempt<4; attempt++){
          try{ await storeSet(key, []); }catch(e){}
          await new Promise(res => setTimeout(res, 150 * (attempt+1)));
          try{
            const readBack = await storeGet(key);
            if(Array.isArray(readBack) && readBack.length === 0) return true;
          }catch(e){}
        }
        return false;
      };
      accountsOk = await verifyEmpty('accounts');
      groupsOk = await verifyEmpty('groups');
      journalOk = (await storeList('journal:')).length === 0;
    }catch(e){}

    // IMPORTANT: we deliberately do NOT reload the page here. We already
    // have verified (via explicit read-back above) that the persisted
    // storage is empty, and we already know the correct in-memory state —
    // so re-fetching via a reload adds nothing but a dependency on reload
    // timing that isn't needed. Clearing STATE directly and re-rendering is
    // both faster and removes an entire class of "reset looked like it
    // didn't take effect" bugs caused by any reload/reinitialization race.
    STATE.journal = []; STATE.accounts = []; STATE.groups = [];
    STATE.meta = { lastImportAt:null, lastEntry:null, lastEntryDate:null, totalLines:0, log:[], journalSeqCounter:0 };
    rebuildAccountIndex();
    STATE.ui.view = 'import';
    STATE.ui.filters = { start:'', end:'', years:[], months:[] };
    STATE.ui.glAccounts = []; STATE.ui.glPartners = []; STATE.ui.glJournals = []; STATE.ui.glCostCenters = [];
    STATE.ui.glPartnersStmt = undefined; STATE.ui.glPartnersOtherBal = undefined;

    if(!accountsOk || !groupsOk || !journalOk){
      showToast('تنبيه: تعذّر تأكيد اكتمال الحذف لبعض البيانات — يُرجى الضغط على الزر مرة أخرى للتأكد.');
    }else{
      showToast('تم إعادة تعيين النظام بالكامل بنجاح.');
    }
    renderApp();
  });
}

async function initApp(){
  // ROOT-CAUSE FIX for "Reset System doesn't delete the Chart of Accounts":
  // window.__ACCOUNTS__/__GROUPS__ are this company's REAL chart of accounts,
  // baked into the file so it isn't empty on first load. storeGet() returns
  // `null` only when the key was NEVER stored — but it also returns `null`
  // after resetSystem() deletes the key. The old code treated both cases the
  // same (`!accounts || !accounts.length`) and silently reseeded the embedded
  // accounts right back, making Reset look like it never touched the Chart of
  // Accounts at all. Reset now explicitly stores an EMPTY array (not a
  // deleted key), so we only fall back to the embedded defaults when the key
  // has truly never existed (`=== null`), and we respect an explicit empty
  // array as "the user reset this on purpose" and leave it empty.
  let accounts = await storeGet('accounts');
  if(accounts === null){ accounts = DEFAULT_ACCOUNTS; await storeSet('accounts', accounts); }
  STATE.accounts = accounts;
  rebuildAccountIndex();

  let groups = await storeGet('groups');
  if(groups === null){ groups = DEFAULT_GROUPS; await storeSet('groups', groups); }
  STATE.groups = groups;

  let meta = await storeGet('meta');
  STATE.meta = meta || { lastImportAt:null, lastEntry:null, lastEntryDate:null, totalLines:0, log:[], journalSeqCounter:0 };
  if(STATE.meta.journalSeqCounter == null) STATE.meta.journalSeqCounter = 0;

  let settings = await storeGet('settings');
  STATE.settings = settings || { companyName:'', fxRates:{}, fxGainAccount:'', fxLossAccount:'', theme:'dark', lang:'ar', palette:'gold' };
  STATE.ui.sidebarCollapsed = !!STATE.settings.sidebarCollapsed;
  if(!STATE.settings.theme) STATE.settings.theme = 'dark';
  if(!STATE.settings.lang) STATE.settings.lang = 'ar';
  if(!STATE.settings.palette) STATE.settings.palette = 'gold';
  applyLangToDocument();
  applyPaletteToDocument();
  if(!STATE.settings.fxRates) STATE.settings.fxRates = {};
  if(!STATE.settings.fxGainAccount){
    const guess = STATE.accounts.find(a => (a.name||'').includes('فرق') && CLASS_MAP[a.type] && CLASS_MAP[a.type].section==='OI');
    STATE.settings.fxGainAccount = guess ? guess.code : '';
  }
  if(!STATE.settings.fxLossAccount){
    const guess = STATE.accounts.find(a => (a.name||'').includes('فرق') && CLASS_MAP[a.type] && CLASS_MAP[a.type].section==='EXP');
    STATE.settings.fxLossAccount = guess ? guess.code : '';
  }

  const journalKeys = await storeList('journal:');
  let journal = [];
  for(const k of journalKeys){
    const shard = await storeGet(k);
    if(shard && shard.length) journal = journal.concat(shard);
  }
  STATE.journal = journal;
  STATE.meta.totalLines = journal.length;
  STATE.projects = (await storeGet('projects')) || [];
  STATE.projectTx = (await storeGet('projectTx')) || [];

  // Backward compatibility: data imported before the Sequential Journal
  // Number feature existed has no `seq` field. Backfill it once, using the
  // existing shard order (year, then original within-shard insertion order —
  // itself the original Excel import order) as the best available proxy for
  // "the exact import order from the original Excel file", then persist so
  // this only ever runs once per shard.
  if(journal.length && journal.some(l => !l.seq)){
    let seqCounter = STATE.meta.journalSeqCounter || 0;
    const byYear = {};
    for(const l of journal){ (byYear[l.date.slice(0,4)] = byYear[l.date.slice(0,4)] || []).push(l); }
    for(const y of Object.keys(byYear).sort()){
      const shard = byYear[y];
      let changed = false;
      for(const l of shard){ if(!l.seq){ l.seq = ++seqCounter; changed = true; } }
      if(changed) await storeSet('journal:' + y, shard);
    }
    STATE.meta.journalSeqCounter = seqCounter;
    await storeSet('meta', STATE.meta);
  }

  try{ history.replaceState({ mizanView: STATE.ui.view }, '', '#'+STATE.ui.view); }catch(e){}
  renderApp();
}

}

// Collects the exact source lines behind a Cash Flow Statement figure, so
// every number on that page can be drilled into (requirement 8).
function linesForAccountTypes(lines, types, start, end, excludeCodes){
  return lines.filter(l => {
    if(isClosingLine(l)) return false;
    if(excludeCodes && excludeCodes.has(l.code)) return false;
    const t = (STATE.accountsByCode[l.code]||{}).type;
    if(!types.includes(t)) return false;
    if(start && l.date < start) return false;
    if(end && l.date > end) return false;
    return true;
  });
}

function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return `${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())} - ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

  // anything else is delegated to whatever the current view registered.
  attachMultiSelectEvents((id, values) => {

    if(STATE.ui.__msHandler) STATE.ui.__msHandler(id, values);
  });
  // Requirement: every table on every page — dashboard, financial
  // statements, comparison tables, all of them — needs its own Excel export,
  // not just the handful of pages wired into the older registerExport()
  // system. Rather than hand-wire dozens of tables individually (high risk
  // of missing one, or breaking an existing page while doing it), attach a
  // small export toolbar above every rendered `.table-wrap` generically,
  // reading the table exactly as displayed via SheetJS's table_to_sheet.
  attachTableExportButtons();
  // Restore panel scroll positions captured at the top of this render (see
  // BUG FIX comment above) — must run after attachMultiSelectEvents so the
  // panels/items exist in the DOM.
  document.querySelectorAll('.ms-panel').forEach(el => {
    if(Object.prototype.hasOwnProperty.call(__msScrollSave, el.id)) el.scrollTop = __msScrollSave[el.id];
  });
  // BUG FIX (filter panel appearing behind the table/content below it, or
  // clipped by it):
  //
  // Root cause: .ms-panel is `position:absolute` inside `.multiselect`,
  // relying on a high z-index (950) to sit above everything else. That only
  // works if the comparison happens in one shared stacking context. It
  // doesn't:
  //   - `.card` has `overflow` untouched (good), but `.card:hover` applies a
  //     `transform` — and `transform` unconditionally creates a NEW stacking
  //     context. Once the card the panel lives in is hovered (which it is,
  //     right when the user's cursor is still over the toggle button they
  //     just clicked), the panel's z-index:950 is only compared against its
  //     OTHER contents, not against sibling cards — so a later sibling card
  //     (e.g. the table below the filters) paints on top of the whole
  //     hovered card as a unit, burying the dropdown.
  //   - Various inline `.table-wrap` elements also set `overflow-y:auto` /
  //     `overflow:auto` with a fixed `max-height`, which clips any
  //     descendant that visually extends past their box — including an
  //     absolutely-positioned panel anchored to a toggle button inside them.
  //   - A prior attempt fixed only the second issue, by computing the
  //     panel's screen position from the toggle button's real bounding rect
  //     and pinning it with `position:fixed`. That escapes `overflow`
  //     clipping, but NOT the first issue: if any ancestor has an active
  //     `transform` (again, the hovered `.card`), that ancestor becomes the
  //     containing block for `position:fixed` descendants too (per the CSS
  //     spec), which puts the panel right back inside that card's stacking
  //     context and paint order.
  //
  // The one fix that is robust against all of the above, for every page and
  // every filter that shares this component, without touching `.card`'s
  // hover styling or any page/table's overflow behaviour: physically move
  // the open panel's DOM node out to `#msPortalRoot`, a plain div that lives
  // directly under <body> (a sibling of #app, alongside the existing modal
  // overlays which use this exact same pattern already). Once the panel is
  // no longer a descendant of ANY card/table/container, none of their
  // overflow or stacking-context behaviour can affect it — there is nothing
  // left to escape.
  if(STATE.ui.openMultiSelect && __msPortalRoot){
    const openId = STATE.ui.openMultiSelect;
    const btn = document.querySelector(`[data-ms="${openId}"]`);
    const panel = document.getElementById(openId + '_panel');
    if(btn && panel){
      __msPortalRoot.appendChild(panel); // moves the real node (keeps its listeners) — not a clone
      if(window.innerWidth > 900){
        // Desktop: position/dimensions unchanged from before — computed from
        // the toggle button's real on-screen location, flipped above the
        // button if there's no room below.
        const rect = btn.getBoundingClientRect();
        const panelWidth = Math.max(rect.width, 240);
        let left = rect.left;
        if(left + panelWidth > window.innerWidth - 8) left = window.innerWidth - panelWidth - 8;
        if(left < 8) left = 8;
        let top = rect.bottom + 4;
        const maxHeight = 260;
        if(top + maxHeight > window.innerHeight - 8) top = Math.max(8, rect.top - maxHeight - 4);
        panel.style.position = 'fixed';
        panel.style.top = top + 'px';
        panel.style.left = left + 'px';
        panel.style.width = panelWidth + 'px';
        panel.style.margin = '0';
      } else {
        // Mobile keeps its own bottom-sheet layout, which is pure CSS
        // (`@media (max-width:900px) .ms-panel{ position:fixed !important;
        // ... }`) and needs no inline positioning — only the portal move
        // above, so it can't be clipped either. Clear any inline styles a
        // previous render at a wider viewport may have left behind.
        panel.style.position = '';
        panel.style.top = '';
        panel.style.left = '';
        panel.style.width = '';
        panel.style.margin = '';
      }
    }
  }
  // Mobile only: relocate the lang/palette/dark-mode buttons out of the big
  // .topbar-compact-controls block (which used to force a full extra row
  // under the title on phones) and into the small placeholder next to the
  // title instead, freeing that space for actual page content. This moves
  // the real nodes (appendChild keeps their event listeners), so no
  // duplicate ids and no extra binding needed. Desktop is untouched: at
  // window widths above 900px this is simply skipped, leaving every button
  // in its normal .topbar-compact-controls position.
  if(window.innerWidth <= 900){
    const mobileQuickControls = document.getElementById('mobileQuickControls');
    if(mobileQuickControls){
      const langBtn = document.getElementById('langToggleBtn');
      const palettePicker = document.querySelector('.topbar-compact-controls .palette-picker');
      const themeBtn = document.getElementById('themeToggleBtn');
      if(langBtn) mobileQuickControls.appendChild(langBtn);
      if(palettePicker) mobileQuickControls.appendChild(palettePicker);
      if(themeBtn) mobileQuickControls.appendChild(themeBtn);
    }
  }
}

// Item 2: Improve the Date Filter — accepts manually typed dates (DD-MM-YYYY,
// DD/MM/YYYY, or YYYY-MM-DD) in addition to the calendar picker. Returns a
// normalized ISO 'YYYY-MM-DD' string, or null if the text isn't a valid date.
function parseFlexibleDate(str){
  if(!str) return null;
  const s = str.toString().trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); // YYYY-MM-DD
  let y, mo, d;
  if(m){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else{
    m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/); // DD-MM-YYYY or DD/MM/YYYY
    if(!m) return null;
    d=+m[1]; mo=+m[2]; y=+m[3];
  }
  if(mo<1||mo>12||d<1||d>31) return null;
  // Validate the date actually exists (rejects e.g. 31 April, 30 February)
  const dt = new Date(Date.UTC(y, mo-1, d));
  if(dt.getUTCFullYear()!==y || dt.getUTCMonth()!==mo-1 || dt.getUTCDate()!==d) return null;
  return `${y}-${pad2(mo)}-${pad2(d)}`;
}
function formatDateForDisplay(iso){
  if(!iso) return '';
  const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : iso;
}

function attachFilterEvents(){
  const mobileFiltersToggle = document.getElementById('mobileFiltersToggle');
  if(mobileFiltersToggle) mobileFiltersToggle.addEventListener('click', () => {
    STATE.ui.mobileFiltersOpen = !STATE.ui.mobileFiltersOpen;
    renderApp();
  });
  function wireDateInput(textId, pickerId, filterKey){
    const textEl = document.getElementById(textId);
    const pickerEl = document.getElementById(pickerId);
    if(!textEl || !pickerEl) return;
    const commit = () => {
      const raw = textEl.value.trim();
      if(raw === ''){ textEl.classList.remove('date-input-invalid'); setFilter(filterKey, ''); return; }
      const iso = parseFlexibleDate(raw);
      if(iso){
        textEl.classList.remove('date-input-invalid');
        textEl.value = formatDateForDisplay(iso);
        pickerEl.value = iso;
        setFilter(filterKey, iso);
      }else{
        // Invalid date typed: flag it visually and do NOT change the active
        // filter — existing filtering behavior keeps working off the last
        // valid value until the user corrects the text.
        textEl.classList.add('date-input-invalid');
      }
    };
    textEl.addEventListener('blur', commit);
    textEl.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); commit(); textEl.blur(); } });
    pickerEl.addEventListener('change', () => {
      textEl.classList.remove('date-input-invalid');
      textEl.value = formatDateForDisplay(pickerEl.value);
      setFilter(filterKey, pickerEl.value);
    });
  }
  wireDateInput('filterStartText', 'filterStartPicker', 'start');
  wireDateInput('filterEndText', 'filterEndPicker', 'end');
  document.querySelectorAll('[data-picker-for]').forEach(btn => btn.addEventListener('click', () => {
    const picker = document.getElementById(btn.dataset.pickerFor);
    if(!picker) return;
    if(typeof picker.showPicker === 'function'){ try{ picker.showPicker(); return; }catch(e){} }
    picker.focus();
  }));
  document.querySelectorAll('[data-range]').forEach(btn => btn.addEventListener('click', () => {
    const r = btn.dataset.range;
    if(r==='month'){ const d=new Date(); STATE.ui.filters.start = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-01`; STATE.ui.filters.end = todayISO(); }
    if(r==='ytd'){ STATE.ui.filters.start = yearStartISO(); STATE.ui.filters.end = todayISO(); }
    if(r==='all'){ STATE.ui.filters.start = ''; STATE.ui.filters.end = ''; }
    STATE.ui.filters.years = []; STATE.ui.filters.months = [];
    if(STATE.ui.msTouched){ delete STATE.ui.msTouched.filterYears; delete STATE.ui.msTouched.filterMonths; }
    renderApp();
  }));
  const clearYM = document.getElementById('clearYearMonthFilter');
  if(clearYM) clearYM.addEventListener('click', () => {
    STATE.ui.filters.years = []; STATE.ui.filters.months = [];
    if(STATE.ui.msTouched){ delete STATE.ui.msTouched.filterYears; delete STATE.ui.msTouched.filterMonths; }
    renderApp();
  });
}

function currencyNote(){
  if(STATE.ui.currencyMode !== 'NATIVE') return '';
  return `<div class="hint" style="margin-bottom:14px">${t('combinedStatementsCurrencyNote')}</div>`;
}

function kpi(label, value, cls, sub){
  return `<div class="kpi ${cls}"><div class="lbl">${label}</div><div class="val num-lg">${value}</div><div class="sub">${sub||''}</div></div>`;
}
// KPI card with an embedded trend sparkline + up/down badge (item 4 — modern
// dashboard charts). `series` is the trailing numeric history (oldest→newest);
// the displayed value/color still come from the current period's real figure.
function kpiSpark(label, value, cls, sub, series){
  const spark = series && series.length >= 2 ? sparklineSVG(series) : '';
  const badge = series && series.length >= 2 ? trendBadge(series) : '';
  return `<div class="kpi ${cls}"><div class="lbl">${label}</div><div class="val num-lg">${value}${badge}</div><div class="sub">${sub||''}</div>${spark}</div>`;
}
// Ratio-flavoured KPI card (shared by Dashboard's embedded ratios module and
// the full Financial Ratios page, so both stay visually/behaviorally identical).
// =========================================================================
// Lightweight, dependency-free chart generators (item 4 — modern dashboard
// visuals). Deliberately implemented as plain inline SVG rather than via
// Chart.js: Chart.js is loaded from a CDN, and this app is meant to work
// fully offline / single-file — a KPI trend shouldn't silently disappear
// just because a CDN request failed. These render instantly, animate in via
// CSS, and add virtually no weight or performance cost.
function sparklineSVG(values, opts){
  opts = opts || {};
  const w = opts.width || 96, h = opts.height || 22;
  if(!values || values.length < 2) return `<svg class="spark" width="${w}" height="${h}"></svg>`;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const stepX = w / (values.length - 1);
  const pts = values.map((v,i) => [ (i*stepX).toFixed(1), (h - ((v-min)/range)*h*0.86 - h*0.07).toFixed(1) ]);
  const path = pts.map((p,i) => (i===0?'M':'L')+p[0]+','+p[1]).join(' ');
  const rising = values[values.length-1] >= values[0];
  const color = opts.color || (rising ? 'var(--emerald)' : 'var(--brick)');
  const areaPath = `${path} L${w},${h} L0,${h} Z`;
  const lastPt = pts[pts.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible">
    <path d="${areaPath}" fill="${color}" opacity="0.12" stroke="none"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="spark-line"/>
    <circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="2.4" fill="${color}"/>
  </svg>`;
}
// Small trend badge (▲/▼ + %) comparing the latest value to the previous one.
function trendBadge(values){
  if(!values || values.length < 2) return '';
  const prev = values[values.length-2], cur = values[values.length-1];
  if(prev === 0) return '';
  const pct = ((cur - prev) / Math.abs(prev)) * 100;
  const up = pct >= 0;
  return `<span style="font-size:10.5px;font-weight:800;color:${up?'var(--emerald)':'var(--brick)'};margin-inline-start:6px">${up?'▲':'▼'} ${fmt(Math.abs(pct))}%</span>`;
}
// Half-donut "gauge" showing a ratio value against a benchmark threshold —
// used on ratio KPI cards (e.g. Current Ratio vs its 1.5 benchmark).
function gaugeSVG(value, benchmark, opts){
  opts = opts || {};
  const size = opts.size || 44;
  const cx = size/2, cy = size/2, r = size/2 - 4;
  const pct = benchmark ? Math.max(0, Math.min(1, value / (benchmark * 2))) : 0;
  const circumference = Math.PI * r; // half circle
  const dash = circumference * pct;
  const good = benchmark != null && value != null && (opts.invert ? value <= benchmark : value >= benchmark);
  const color = value==null ? 'var(--ink-faint)' : (good ? 'var(--emerald)' : 'var(--brick)');
  return `<svg width="${size}" height="${size/2+4}" viewBox="0 0 ${size} ${size/2+4}">
    <path d="M4,${size/2} A${r},${r} 0 0 1 ${size-4},${size/2}" fill="none" stroke="var(--line)" stroke-width="5" stroke-linecap="round"/>
    <path d="M4,${size/2} A${r},${r} 0 0 1 ${size-4},${size/2}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${dash.toFixed(1)} ${circumference.toFixed(1)}" class="gauge-arc"/>
  </svg>`;
}
// Ratio KPI card variant with an embedded benchmark gauge (item 4).
function rcardGauge(title, val, suffix, note, benchmark, invert, series){
  const display = val==null ? '—' : (suffix==='%' ? fmt(val)+'%' : fmt(val));
  const cls = val==null ? '' : (val >= 0 ? '' : 'neg');
  const gauge = benchmark != null ? gaugeSVG(val, benchmark, {invert}) : '';
  const spark = series && series.length >= 2 ? sparklineSVG(series, {height:20}) : '';
  return `<div class="kpi ${cls}"><div class="lbl">${title}</div>
    <div class="gauge-wrap"><div class="val num-lg">${display}</div>${gauge}</div>
    <div class="sub">${note}</div>${spark}</div>`;
}
// Ratio card with a trend sparkline instead of a gauge — used for
// profitability ratios (margins, ROA/ROE) and magnitude figures (working
// capital) that don't have one universal external benchmark, but where the
// TREND over the trailing months is the most informative visualization.
function rcardSpark(title, val, suffix, note, series){
  const display = val==null ? '—' : (suffix==='%' ? fmt(val)+'%' : fmt(val));
  const cls = val==null ? '' : (val >= 0 ? '' : 'neg');
  const spark = series && series.length >= 2 ? sparklineSVG(series) : '';
  const badge = series && series.length >= 2 ? trendBadge(series) : '';
  return `<div class="kpi ${cls}"><div class="lbl">${title}</div><div class="val num-lg">${display}${badge}</div><div class="sub">${note}</div>${spark}</div>`;
}
// Builds trailing monthly net-income history (last `n` calendar months up to
// the filters' effective end date) for Dashboard sparklines. Pure read-only
// aggregation over the existing incomeStatement() calc — no new data model.
function trailingMonthlySeries(metricFn, n){
  n = n || 6;
  const endRef = asOfDateForFilters(STATE.ui.filters);
  const end = endRef ? new Date(endRef+'T00:00:00Z') : new Date();
  const out = [];
  for(let i=n-1; i>=0; i--){
    const d = new Date(Date.UTC(end.getUTCFullYear(), end.getUTCMonth()-i, 1));
    const mStart = `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-01`;
    const mEndDate = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0));
    const mEnd = `${mEndDate.getUTCFullYear()}-${pad2(mEndDate.getUTCMonth()+1)}-${pad2(mEndDate.getUTCDate())}`;
    out.push(metricFn(mStart, mEnd));
  }
  return out;
}
// Performance-conscious batch version for the Ratios page: computes the full
// income-statement + balance-sheet + ratios object ONCE per trailing month
// (not once per ratio), so all ~10 ratio cards on the page share a single
// 6-month pass over the journal instead of 6×10 separate recomputations.
function trailingMonthlyRatios(n){
  n = n || 6;
  const endRef = asOfDateForFilters(STATE.ui.filters);
  const end = endRef ? new Date(endRef+'T00:00:00Z') : new Date();
  const out = [];
  for(let i=n-1; i>=0; i--){
    const d = new Date(Date.UTC(end.getUTCFullYear(), end.getUTCMonth()-i, 1));
    const mStart = `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-01`;
    const mEndDate = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0));
    const mEnd = `${mEndDate.getUTCFullYear()}-${pad2(mEndDate.getUTCMonth()+1)}-${pad2(mEndDate.getUTCDate())}`;
    const mIs = incomeStatement(STATE.journal, mStart, mEnd);
    const mBs = balanceSheet(STATE.journal, mEnd);
    const mR = ratios(mIs, mBs);
    // Carry the raw figures too, so callers needing plain amounts (assets,
    // liabilities, equity, revenue, costs) don't have to re-run
    // incomeStatement()/balanceSheet() over the journal a second time.
    mR.__assets = mBs.assets; mR.__liabilities = mBs.liabilities; mR.__equity = mBs.equityTotal;
    mR.__netIncome = mIs.netIncome; mR.__revenue = mIs.revenue + mIs.otherIncome; mR.__costs = mIs.cogs + mIs.expenses + mIs.depreciation;
    out.push(mR);
  }
  return out;
}

function rcard(title, val, suffix, note){
  const display = val==null ? '—' : (suffix==='%' ? fmt(val)+'%' : fmt(val));
  const cls = val==null ? '' : (val >= 0 ? '' : 'neg');

function renderJournalPreview(area, wb, sheetName, sheetNames, file){
  const preview = buildJournalPreview(wb, sheetName, 'import');
  const mappingRows = Object.keys(FIELD_LABELS).map(f => `
    <div class="m-item"><b>${FIELD_LABELS[f]}</b>${preview.mapping[f] ? escapeHtml(preview.mapping[f]) : `<span class="hint">${t('notFoundLabel')}</span>`}</div>
  `).join('');
  const missing = ['entry','date','account'].filter(f => !preview.mapping[f]);

  area.innerHTML = `
    <div class="section-title">
      <span>${t('filePreviewLabel')}: ${escapeHtml(file.name)}</span>
      ${sheetNames.length > 1 ? `<span class="hint">${t('sheetLabel')}: 
        <select id="sheetSelect" class="input" style="padding:3px 6px;font-size:11.5px">
          ${sheetNames.map(n=>`<option value="${escapeHtml(n)}" ${n===sheetName?'selected':''}>${escapeHtml(n)}</option>`).join('')}
        </select></span>` : `<span class="hint">${t('sheetLabel')}: ${escapeHtml(sheetName)}</span>`}
    </div>
    <div class="hint">${tf('rowsDetectedLabel', {total: fmtInt(preview.totalRows), valid: fmtInt(preview.lines.length)})}</div>
    <div class="mapping-grid">${mappingRows}</div>
    ${missing.length ? `<div class="progress-note" style="color:var(--brick)">${tf('columnsNotDetectedError', {cols: missing.map(m=>FIELD_LABELS[m]).join('، ')})}</div>` : ''}
    <div style="margin-top:14px;display:flex;gap:10px;align-items:center;">
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft)">
        <input type="checkbox" id="legacyMode"> ${t('legacyImportCheckbox')}
      </label>
      <button class="btn btn-gold" id="confirmImportBtn" ${missing.length?'disabled':''}>${tf('confirmImportBtn', {n: fmtInt(preview.lines.length)})}</button>
    </div>
  `;

  const sel = document.getElementById('sheetSelect');
  if(sel) sel.addEventListener('change', () => renderJournalPreview(area, wb, sel.value, sheetNames, file));

  document.getElementById('confirmImportBtn').addEventListener('click', async () => {
    const btn = document.getElementById('confirmImportBtn');
    btn.disabled = true; btn.textContent = t('importingEllipsis');
    const mode = document.getElementById('legacyMode').checked ? 'legacy' : 'update';
    try{
      const res = await mergeJournalImport(preview.lines, file.name, mode);
      showToast(tf('journalImportResult', {added:res.added, skipped:res.skipped}));
      renderApp();
    }catch(err){
      showToast(t('importErrorOccurred') + err.message, 5000);
      btn.disabled = false; btn.textContent = t('confirmImportLabel');
    }
  });
}

   ========================================================================= */
const TB_CATEGORIES = [
  { key:'assets', titleKey:'tbCatAssets', types:[...BS_SECTIONS[0].types, ...BS_SECTIONS[1].types] },
  { key:'liab', titleKey:'tbCatLiab', types:[...LIAB_SECTIONS[0].types, ...LIAB_SECTIONS[1].types] },
  { key:'equity', titleKey:'tbCatEquity', types:EQ_SECTIONS[0].types },
  { key:'revenue', titleKey:'tbCatRevenue', types:['الدخل','دخل آخر'] },
  { key:'expenses', titleKey:'tbCatExpenses', types:['تكاليف الإيرادات','النفقات','إهلاك'] },
];
function toggleTBSection(key){ STATE.ui.expandedTB = STATE.ui.expandedTB || {}; STATE.ui.expandedTB[key] = !(STATE.ui.expandedTB[key] === true); renderApp(); }

function renderTrialBalanceView(root){
  if(!STATE.journal.length){ root.innerHTML = emptyState(t('noDataYet'),t('startImporting'),'import'); return; }
  const f = STATE.ui.filters;
  const tbCurFilter = STATE.ui.tbCurrencyFilter || 'EGP';
  const _r1 = effectiveRange(f);
  const periodLines = filterLinesByPeriod(STATE.journal, f);
  const endDate = periodFilterActive(f) ? '' : f.end;
  // Dedicated Trial Balance currency filter (requirement 9) — independent of
  // any other page. EGP: unchanged single EGP-equivalent view (current
  // default behaviour). USD (or any other detected currency): only accounts
  // with transactions in that currency, shown natively — NOT converted.
  const availableCurrencies = uniq(STATE.accounts.map(a=>a.currency).filter(c=>c && c!=='EGP'));
  let tb;
  if(tbCurFilter === 'EGP'){
    tb = trialBalanceRows(periodLines, endDate, _r1.start, 'EGP');
  }else{
    tb = trialBalanceRows(periodLines, endDate, _r1.start, 'NATIVE');
    tb = { ...tb, groups: tb.groups.filter(g => g.currency === tbCurFilter) };
  }
  STATE.ui.expandedTB = STATE.ui.expandedTB || {};

  function groupTable(g){
    const viewKey = 'trialbalance_' + g.currency;
    const colf = { code:'colf_tb_'+g.currency+'_code', name:'colf_tb_'+g.currency+'_name', type:'colf_tb_'+g.currency+'_type', opening:'colf_tb_'+g.currency+'_opening', debit:'colf_tb_'+g.currency+'_debit', credit:'colf_tb_'+g.currency+'_credit', closing:'colf_tb_'+g.currency+'_closing' };
    const filteredRows = g.rows.filter(r =>
      passesColFilter(colf.code, r.code) && passesColFilter(colf.name, r.name) && passesColFilter(colf.type, r.type) &&
      passesColFilter(colf.opening, r.opening) && passesColFilter(colf.debit, r.debit) && passesColFilter(colf.credit, r.credit) && passesColFilter(colf.closing, r.closing));
    const sorted = applySort(viewKey, filteredRows, (r,col) => r[col]);
    registerExport(viewKey, `trial_balance_${g.currency}.xlsx`,
      [t('code'),t('accountName'),t('classification'),t('openingBalance'),t('debit'),t('credit'),t('closingBalance')],
      sorted.map(r=>[r.code,r.name,r.type,r.opening,r.debit,r.credit,r.closing]));

    const byCat = TB_CATEGORIES.map(cat => ({ ...cat, rows: sorted.filter(r=>cat.types.includes(r.type)) })).filter(c=>c.rows.length);
    const otherRows = sorted.filter(r => !TB_CATEGORIES.some(c=>c.types.includes(r.type)));

    function catBlock(cat){
      const key = g.currency + '_' + cat.key;
      const expanded = STATE.ui.expandedTB[key] === true; // default: collapsed
      const sub = cat.rows.reduce((s,r)=>s+r.closing,0);
      let html = `<tr class="total-row"><td colspan="7"><span class="drill" onclick="toggleTBSection('${key}')" style="font-weight:800;margin-left:6px">${expanded?'−':'+'}</span>${t(cat.titleKey)} <span class="hint">(${cat.rows.length} ${t('tbCategorySummary')} ${fmt(sub)})</span></td></tr>`;
      if(expanded){
        html += cat.rows.map(r=>`<tr>
          <td class="num drill" onclick="drillToAccount('${r.code}')">${r.code}</td>
          <td>${escapeHtml(r.name)}</td>
          <td><span class="pill pill-gold">${escapeHtml(accountTypeDisplay(r.type)||'—')}</span></td>
          <td class="num-cell num">${fmt(r.opening)}</td>
          <td class="num-cell num">${fmt(r.debit)}</td>
          <td class="num-cell num">${fmt(r.credit)}</td>
          <td class="num-cell num ${r.closing>=0?'pos-text':'neg-text'}">${fmt(r.closing)}</td>
        </tr>`).join('');
      }
      return html;
    }

    return `
      <div class="section-title">
        <span>${g.currency === 'EGP' ? t('egpAccountsLabel') : t('currencyAccountsLabel') + ' ' + escapeHtml(g.currency)}</span>
        <span style="display:flex;gap:10px;align-items:center"><span class="hint">${g.rows.length} ${t('accountsCountSuffix')}</span>${exportBtnHtml(viewKey)}</span>
      </div>
      <div class="table-wrap" style="max-height:560px;overflow-y:auto">
        <table><thead><tr>
          ${filterableTh(viewKey,'code',t('code'),colf.code,g.rows.map(r=>r.code))}
          ${filterableTh(viewKey,'name',t('accountName'),colf.name,g.rows.map(r=>r.name))}
          ${filterableTh(viewKey,'type',t('classification'),colf.type,g.rows.map(r=>r.type),{displayLabel:v=>accountTypeDisplay(v)||'—'})}
          ${filterableTh(viewKey,'opening',t('openingBalance'),colf.opening,g.rows.map(r=>r.opening),{extraClass:'num-cell',displayLabel:fmt})}
          ${filterableTh(viewKey,'debit',t('debit'),colf.debit,g.rows.map(r=>r.debit),{extraClass:'num-cell',displayLabel:fmt})}
          ${filterableTh(viewKey,'credit',t('credit'),colf.credit,g.rows.map(r=>r.credit),{extraClass:'num-cell',displayLabel:fmt})}
          ${filterableTh(viewKey,'closing',t('closingBalance'),colf.closing,g.rows.map(r=>r.closing),{extraClass:'num-cell',displayLabel:fmt})}
        </tr></thead><tbody>
          ${byCat.map(catBlock).join('')}
          ${otherRows.length ? `<tr class="total-row"><td colspan="7">${t('otherCategoryLabel')}</td></tr>` + otherRows.map(r=>`<tr>
            <td class="num drill" onclick="drillToAccount('${r.code}')">${r.code}</td><td>${escapeHtml(r.name)}</td>
            <td><span class="pill pill-gold">${escapeHtml(accountTypeDisplay(r.type)||'—')}</span></td>
            <td class="num-cell num">${fmt(r.opening)}</td><td class="num-cell num">${fmt(r.debit)}</td>
            <td class="num-cell num">${fmt(r.credit)}</td><td class="num-cell num ${r.closing>=0?'pos-text':'neg-text'}">${fmt(r.closing)}</td>
          </tr>`).join('') : ''}
          <tr class="total-row">
            <td colspan="3">${t('totalOfCurrency')} (${escapeHtml(g.currency)})</td>
            <td class="num-cell num">${fmt(filteredRows.reduce((s,r)=>s+r.opening,0))}</td>
            <td class="num-cell num">${fmt(filteredRows.reduce((s,r)=>s+r.debit,0))}</td>
            <td class="num-cell num">${fmt(filteredRows.reduce((s,r)=>s+r.credit,0))}</td>
            <td class="num-cell num">${fmt(filteredRows.reduce((s,r)=>s+r.closing,0))}</td>
          </tr>
        </tbody></table>
      </div>
    `;
  }

  root.innerHTML = `
    <div class="card">
      <h2>${ICONS.scale.replace('currentColor','var(--gold-dim)')} ${t('trialBalanceTitle')}</h2>
      <div class="desc">${tf('trialBalancePeriodDesc', {start: f.start||t('startOfActivityLabel'), end: f.end})}
      ${tb.mixedCurrencies ? t('tbMixedCurrenciesNote') : ''}</div>
      <div style="margin-bottom:14px">
        <label class="lbl">${t('currency')}</label>
        <div class="chip-btns">
          <button class="chip ${tbCurFilter==='EGP'?'active':''}" data-tb-cur="EGP">${t('currencyEGPLabel')}</button>
          ${availableCurrencies.map(c=>`<button class="chip ${tbCurFilter===c?'active':''}" data-tb-cur="${escapeHtml(c)}">${c==='USD'?t('currencyUSDLabel'):escapeHtml(c)}</button>`).join('')}
        </div>
      </div>
      ${tb.groups.length ? tb.groups.map(groupTable).join('') : `<div class="empty">${t('noMatchForFilter')}</div>`}
    </div>
  `;
  attachSortEvents();
  document.querySelectorAll('[data-tb-cur]').forEach(btn => btn.addEventListener('click', () => {
    STATE.ui.tbCurrencyFilter = btn.dataset.tbCur;
    renderApp();
  }));
  bindColFilterHandler(tb.groups.flatMap(g => ['code','name','type','opening','debit','credit','closing'].map(col => 'colf_tb_'+g.currency+'_'+col)));
}

/* =========================================================================
   FX revaluation view — the adjusting entry needed for currency differences
   ========================================================================= */
function renderFxRevaluationView(root){
  if(!STATE.journal.length){ root.innerHTML = emptyState(t('noDataYet'),t('startImporting'),'import'); return; }
  const f = STATE.ui.filters;
  const asOf = f.end || todayISO();
  const currencies = uniq(STATE.accounts.map(a=>a.currency).filter(c=>c && c!=='EGP'));

  if(!currencies.length){
    root.innerHTML = `<div class="card"><div class="empty">${t('noForeignAccounts')}</div></div>`;
    return;
  }

  const rates = STATE.settings.fxRates || {};
  const rev = fxRevaluation(STATE.journal, asOf, rates);
  const accOpts = STATE.accounts.slice().sort((a,b)=>a.code.localeCompare(b.code))
    .map(a=>`<option value="${a.code}">${a.code} — ${escapeHtml(accName(a.code))}</option>`).join('');

  const rowsWithDiff = rev.rows.filter(r => !r.anomaly && Math.abs(r.diff) >= 0.01 && r.rate > 0);
  const anomalyRows = rev.rows.filter(r => r.anomaly);
  const revColf = { code:'colf_fxreval_code', name:'colf_fxreval_name', currency:'colf_fxreval_currency', nativeBalance:'colf_fxreval_native', egpBook:'colf_fxreval_egpBook', rate:'colf_fxreval_rate', diff:'colf_fxreval_diff' };
  const revRowsF = rev.rows.filter(r =>
    passesColFilter(revColf.code, r.code) && passesColFilter(revColf.name, r.name) && passesColFilter(revColf.currency, r.currency) &&
    passesColFilter(revColf.nativeBalance, r.nativeBalance) && passesColFilter(revColf.egpBook, r.egpBook) &&
    passesColFilter(revColf.rate, r.rate) && passesColFilter(revColf.diff, r.diff));
  const revSorted = applySort('fxreval', revRowsF, (r,col) => r[col]);

  root.innerHTML = `

async function fetchLiveFxRates(currencies){
  const note = document.getElementById('fxFetchNote');
  if(note) note.textContent = t('fetchingRates');
  const applied = [];
  const failed = [];
  for(const c of currencies){
    try{
      // open.er-api.com is a free, keyless FX API that (unlike Frankfurter/ECB
      // data, which does not publish EGP at all) supports EGP as a target rate.
      const res = await fetch(`https://open.er-api.com/v6/latest/${encodeURIComponent(c)}`);
      if(!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      const rate = data && data.rates && data.rates.EGP;
      if(!rate) throw new Error(t('noEgpRateInResponse'));
      STATE.settings.fxRates = STATE.settings.fxRates || {};
      STATE.settings.fxRates[c] = Math.round(rate * 10000) / 10000;
      applied.push(`${c}=${STATE.settings.fxRates[c]}`);
    }catch(e){
      failed.push(c + ' (' + e.message + ')');
    }
  }
  if(applied.length){
    await storeSet('settings', STATE.settings);
    showToast('تم تحديث أسعار الصرف تلقائياً: ' + applied.join('، ') + (failed.length ? (' — تعذّر جلب: ' + failed.join('، ')) : ''));
    renderApp();
    return;
  }
  if(note) note.innerHTML = `<span style="color:var(--brick)">${tf('fetchRatesFailedNote', {list: escapeHtml(failed.join('، '))})}</span>`;
}

function renderAccountStatementView(root, alwaysCombined){
  if(!STATE.journal.length){ root.innerHTML = emptyState(t('noDataYet'),t('startImporting'),'import'); return; }

  const exportName = alwaysCombined ? 'journal_entries.xlsx' : 'general_ledger.xlsx';

  const voucherSearch = (STATE.ui.glVoucherSearch || '').trim().toLowerCase();

  const currencyFilter = STATE.ui.glCurrencyFilter || 'ALL'; // 4.3 currency filter

  const _r2 = effectiveRange(f);
  const rangeStart = _r2.start, rangeEnd = periodFilterActive(f) ? '' : f.end;
  const periodLines = filterLinesByPeriod(STATE.journal, f);

  const { opening, openingNative, rows: rowsAll } = generalLedgerRows(periodLines, selectedCodes, selectedPartners, selectedJournals, rangeStart, rangeEnd, { descSearch, currencyFilter, costCenters: selectedCostCenters });
  const rows = voucherSearch ? rowsAll.filter(l => (l.entry||'').toLowerCase().includes(voucherSearch)) : rowsAll;

  const viewKey = 'gl';
  // Excel-style per-column filters (funnel icon on each header) — kept
  // distinct from the account/partner/journal/cost-center/search filters
  // above, which stay as they are. `rows` above is the base used to build
  // each column's checklist; `rowsF` is what's actually shown/sorted/totalled.
  const glColf = { seq:'colf_gl_seq', date:'colf_gl_date', entry:'colf_gl_entry', ref:'colf_gl_ref', account:'colf_gl_account', partner:'colf_gl_partner', cur:'colf_gl_cur', debit:'colf_gl_debit', credit:'colf_gl_credit', product:'colf_gl_product', curAmt:'colf_gl_curAmt', movement:'colf_gl_movement' };
  const rowsF = rows.filter(r =>
    passesColFilter(glColf.seq, r.seq||'') && passesColFilter(glColf.date, r.date) && passesColFilter(glColf.entry, r.entry) &&
    passesColFilter(glColf.ref, r.ref||'') && passesColFilter(glColf.account, r.code+' '+accName(r.code)) && passesColFilter(glColf.partner, r.partner||'') &&
    passesColFilter(glColf.cur, r.cur||'EGP') && passesColFilter(glColf.debit, r.debit||0) && passesColFilter(glColf.credit, r.credit||0) &&
    passesColFilter(glColf.product, r.product||'') && passesColFilter(glColf.curAmt, r.curAmt||0) && passesColFilter(glColf.movement, r.movement));

  // Determine if the filtered set is single-currency (so a native-currency column makes sense)
  const involvedCurrencies = uniq(rowsF.map(l => (STATE.accountsByCode[l.code]||{}).currency || 'EGP'));
  const singleForeign = involvedCurrencies.length === 1 && involvedCurrencies[0] !== 'EGP' ? involvedCurrencies[0] : null;

  const sorted = applySort(viewKey, rowsF, (r,col) => {
    if(col==='account') return r.code + ' ' + accName(r.code);
    if(col==='movement') return r.movement;
    if(col==='seq') return r.seq||0;
    if(col==='convFactor') return (r.curAmt && r.cur && r.cur!=='EGP') ? (r.debit||r.credit)/Math.abs(r.curAmt) : -Infinity;
    return r[col];
  });
  const showOpening = STATE.ui.glShowOpening;
  // Per request: when every row on screen is the same foreign currency (the
  // "دولار" chip, or account selection narrowed to one USD account), show
  // BOTH running balances side by side — EGP (as always) AND native currency
  // — rather than one replacing the other, so the user can see where they
  // stand in both at a glance.
  let runningEGP = showOpening ? opening : 0;
  let runningNative = showOpening ? openingNative : 0;
  const displayRows = sorted.map(l => {
    const native = singleForeign ? lineNative(l) : null;
    runningEGP += l.movement;
    if(singleForeign) runningNative += native.debit - native.credit;
    return {...l, running: runningEGP, runningNative: singleForeign?runningNative:null, nativeDebit: native?native.debit:null, nativeCredit: native?native.credit:null};
  });

  registerExport(viewKey, exportName,
    ['م','التاريخ','رقم القيد','الحساب','الشريك','العملة','مدين EGP','دائن EGP','المنتج','المبلغ بالعملة الأصلية','معامل التحويل','رصيد الحركة','الرصيد التراكمي'],
    displayRows.map(r=>{
      const hasFx = r.curAmt && r.cur && r.cur!=='EGP';
      const convFactor = hasFx ? (r.debit||r.credit)/Math.abs(r.curAmt) : '';
      return [r.seq||'', r.date, r.entry, `${r.code} ${accName(r.code)}`, r.partner||'', r.cur||'EGP', r.debit, r.credit, r.product||'', r.curAmt?`${r.curAmt} ${r.cur||''}`:'', convFactor, r.movement, r.running];
    }));

  // 4.4 Totals row (every numeric column based on current filters, EXCEPT the running balance)
  const totalDebit = displayRows.reduce((s,r)=>s+r.debit,0);
  const totalCredit = displayRows.reduce((s,r)=>s+r.credit,0);
  const totalMovement = displayRows.reduce((s,r)=>s+r.movement,0);
  const totalNativeDebit = singleForeign ? displayRows.reduce((s,r)=>s+(r.nativeDebit||0),0) : null;
  const totalNativeCredit = singleForeign ? displayRows.reduce((s,r)=>s+(r.nativeCredit||0),0) : null;

  const filterBarHtml = `
    <div class="card">
      <h2 style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <span>${ICONS.ledger.replace('currentColor','var(--gold-dim)')} ${pageTitle}</span>

      <div style="display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:14px;">
        ${multiSelectHtml('gl_accounts', t('accountsFilterLabel'), accountLabels, selectedAccLabels, {isAccounts:true, tree: !(STATE.ui.accountTreeMode && STATE.ui.accountTreeMode['gl_accounts']===false)})}
        ${multiSelectHtml('gl_partners', t('partnersFilterLabel'), allPartners, selectedPartners)}
        ${multiSelectHtml('gl_journals', t('journalFilterLabel'), allJournals, selectedJournals, {displayLabel: journalDisplayName})}
        ${allCostCenters.length ? multiSelectHtml('gl_costcenters', t('costCenterFilterLabel'), allCostCenters, selectedCostCenters) : ''}

          <input type="text" id="glVoucherSearch" class="input" style="min-width:180px" placeholder="${t('searchByEntryNoPlaceholder')}" value="${escapeHtml(STATE.ui.glVoucherSearch||'')}">
        </div>
        <div><label class="lbl">${t('searchByDescLabel')}</label>
          <input type="text" id="glDescSearch" class="input" style="min-width:180px" placeholder="${t('searchByDescPlaceholder')}" value="${escapeHtml(STATE.ui.glDescSearch||'')}">
        </div>
        <div>
          <label class="lbl">${t('currency')}</label>
          <div class="chip-btns">
            <button class="chip ${currencyFilter==='ALL'?'active':''}" data-gl-cur="ALL">${t('allChip')}</button>
            <button class="chip ${currencyFilter==='EGP'?'active':''}" data-gl-cur="EGP">${t('egpChip')}</button>
            <button class="chip ${currencyFilter==='USD'?'active':''}" data-gl-cur="USD">${t('usdChip')}</button>
          </div>
        </div>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);padding-bottom:8px">
          <input type="checkbox" id="glShowOpeningChk" ${showOpening?'checked':''}> ${t('showOpeningBalanceLabel')}
        </label>
        ${exportBtnHtml(viewKey)}
        <button class="btn btn-outline" style="padding:8px 14px;font-size:12px" onclick="printCurrentView()">${t('printPdf')}</button>
      </div>
      <div class="grid-3" style="margin-bottom:14px">
        ${kpi(t('movementsCountLabel'), fmtInt(rowsF.length), '', '')}

      </div>
      ${singleForeign ? `<div class="grid-3" style="margin-bottom:14px">
        ${showOpening ? kpi(t('openingBalanceBeforePeriod')+' ('+singleForeign+')', fmt(openingNative), openingNative>=0?'pos':'neg', '') : ''}
        ${kpi(t('finalRunningBalanceLabel')+' ('+singleForeign+')', fmt(displayRows.length?displayRows[displayRows.length-1].runningNative:openingNative), '', '')}
      </div>` : ''}
    </div>
  `;

  // 4.5 Separate table per account when filtering by one or more accounts
  let bodyHtml;
  const accColfIds = [];
  if(!alwaysCombined && selectedCodes.length){
    // Re-derive per-account data with the SAME filters (partners/journals/desc/currency/period)
    // except the account itself, then reuse the well-tested accountStatement() calc so opening
    // balance / running balance logic stays identical to the single-account view.
    const preFilteredForAccounts = periodLines.filter(l =>
      (!selectedPartners.length || selectedPartners.includes(l.partner)) &&
      (!selectedJournals.length || selectedJournals.includes(l.journal||'')) &&
