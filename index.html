    panel.querySelectorAll('input.ms-leaf').forEach(leaf => { if(labels.includes(leaf.value)) leaf.checked = cb.checked; });
    const id = panel.id.replace('_panel','');
    STATE.ui.openMultiSelect = id;
    onChange(id, [...panel.querySelectorAll('input.ms-leaf:checked')].map(x=>x.value));
  }));
  document.querySelectorAll('.ms-panel input.ms-leaf').forEach(cb => cb.addEventListener('change', () => {
    const panel = cb.closest('.ms-panel');
    const id = panel.id.replace('_panel','');
    STATE.ui.openMultiSelect = id;
    onChange(id, [...panel.querySelectorAll('input.ms-leaf:checked')].map(x=>x.value));
  }));
  document.addEventListener('click', () => {
    // Commit any pending live-typed (but not yet Enter/Done'd) selection
    // before closing, so clicking away doesn't silently discard it.
    const openId = STATE.ui.openMultiSelect;
    if(openId){
      const panel = document.getElementById(openId + '_panel');
      const searchInp = panel ? panel.querySelector(`[data-ms-search="${openId}"]`) : null;
      if(panel && searchInp && searchInp.value.trim() !== ''){

      }
    }
    document.querySelectorAll('.ms-panel').forEach(p => p.style.display='none');
    if(openId && STATE.ui.msSearchQuery) delete STATE.ui.msSearchQuery[openId];
    STATE.ui.openMultiSelect = null;
  }, { once:true });
}

/* ---------- persistent storage helpers ----------
   window.storage (get/set/list/delete) is a Claude.ai artifact-only API — it
   does not exist when this file is opened as a plain HTML file, hosted on
   Google Drive, GitHub Pages, or any normal web server. Every storeGet/
   storeSet/storeList call below now falls back to the browser's own
   localStorage in that case, so imported data actually persists between
   visits once this file is hosted or opened outside Claude.ai. Note:
   localStorage is per-browser-per-device (not shared between your phone and
   laptop automatically) and has a small size ceiling (a few MB) — see the
   guidance given alongside this change for what that means in practice. */
const LOCAL_STORAGE_PREFIX = 'mizan_erp_';
const HAS_ARTIFACT_STORAGE = typeof window !== 'undefined' && !!window.storage;
async function storeGet(key){
  if(HAS_ARTIFACT_STORAGE){
    try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
    catch(e){ return null; }
  }
  try{ const raw = localStorage.getItem(LOCAL_STORAGE_PREFIX + key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
async function storeSet(key, value){
  if(HAS_ARTIFACT_STORAGE){
    try{ return await window.storage.set(key, JSON.stringify(value), false); }
    catch(e){ console.error('storage set failed', key, e); return null; }
  }
  try{
    localStorage.setItem(LOCAL_STORAGE_PREFIX + key, JSON.stringify(value));
    scheduleDriveSync();
    return { key, value };
  }
  catch(e){ console.error('storage set failed (localStorage may be full)', key, e); return null; }
}
async function storeList(prefix){
  if(HAS_ARTIFACT_STORAGE){
    try{ const r = await window.storage.list(prefix, false); return r ? r.keys : []; }
    catch(e){ return []; }
  }
  try{
    const keys = [];
    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || !k.startsWith(LOCAL_STORAGE_PREFIX)) continue;
      const bare = k.slice(LOCAL_STORAGE_PREFIX.length);
      if(!prefix || bare.startsWith(prefix)) keys.push(bare);
    }
    return keys;
  }catch(e){ return []; }
}
async function storeDelete(key){
  if(HAS_ARTIFACT_STORAGE){
    try{ return await window.storage.delete(key, false); }catch(e){ return null; }
  }
  try{ localStorage.removeItem(LOCAL_STORAGE_PREFIX + key); scheduleDriveSync(); return { key, deleted:true }; }
  catch(e){ return null; }
}

/* ---------- Google Drive sync ----------
   Opt-in cross-device sync: when signed in, every local write is mirrored
   to a single JSON file this app owns in the user's own Google Drive
   (scope: drive.file — the app can only ever see files it created itself,
   never anything else in the user's Drive). Opening the same GitHub Pages
   URL on another device and signing in pulls that same file down, so both
   devices end up on the same data. Sign-in uses Google Identity Services'
   token client (pure client-side, no backend) — the access token lives only
   in memory for this tab and is re-requested each time the page loads. */
const GOOGLE_CLIENT_ID = '27976090337-jd4aq3p738rj579vj1ki7gcfis68m9g6.apps.googleusercontent.com';
const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILE_NAME = 'mizan_erp_data.json';
const DRIVE = { tokenClient:null, ready:false, accessToken:null, signedIn:false, fileId:null, syncing:false, lastSyncAt:null, lastError:null, pendingTimer:null, applyingRemote:false, sessionWarnTimer:null, sessionExpiringSoon:false };

function initGoogleAuth(){
  if(!(window.google && google.accounts && google.accounts.oauth2)){ setTimeout(initGoogleAuth, 300); return; }
  DRIVE.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GOOGLE_DRIVE_SCOPE,
    callback: async (resp) => {
      if(resp.error){ DRIVE.lastError = resp.error; showToast(t('driveSignInError') + ': ' + resp.error); renderApp(); return; }
      DRIVE.accessToken = resp.access_token;
      DRIVE.signedIn = true;
      DRIVE.lastError = null;
      scheduleDriveSessionWarning();
      renderApp(); // show "connected, syncing..." immediately
      await driveInitialSync();
    },
  });
  DRIVE.ready = true;
}
function signInWithGoogle(){
  if(!DRIVE.tokenClient){ showToast(t('driveLoadingAuth')); return; }
  DRIVE.tokenClient.requestAccessToken({ prompt: DRIVE.accessToken ? '' : 'consent' });
}
function signOutFromGoogle(){
  if(DRIVE.accessToken && window.google && google.accounts && google.accounts.oauth2) google.accounts.oauth2.revoke(DRIVE.accessToken, () => {});
  if(DRIVE.sessionWarnTimer){ clearTimeout(DRIVE.sessionWarnTimer); DRIVE.sessionWarnTimer = null; }
  DRIVE.accessToken = null; DRIVE.signedIn = false; DRIVE.fileId = null; DRIVE.lastSyncAt = null; DRIVE.sessionExpiringSoon = false;
  showToast(t('driveDisconnected'));
  renderApp();
}
async function driveApiFetch(url, options){
  const res = await fetch(url, { ...options, headers: { ...(options&&options.headers), Authorization: 'Bearer ' + DRIVE.accessToken } });
  if(res.status === 401){ DRIVE.signedIn = false; DRIVE.accessToken = null; throw new Error(t('driveSessionExpired')); }
  if(!res.ok) throw new Error('Drive API ' + res.status);
  return res;
}
async function driveFindFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`);
  const data = await res.json();
  return (data.files && data.files[0]) || null;
}
async function driveDownloadFile(fileId){
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  return await res.json();
}
async function driveUploadFile(fileId, dataObj){
  const boundary = 'mizanerpboundary';
  const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
  const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`
    + `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(dataObj)}\r\n--${boundary}--`;
  const url = fileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  const res = await driveApiFetch(url, { method: fileId ? 'PATCH' : 'POST', headers:{ 'Content-Type': `multipart/related; boundary=${boundary}` }, body });
  return await res.json();
}
async function collectAllLocalData(){
  const keys = await storeList('');
  const out = {};
  for(const k of keys) out[k] = await storeGet(k);
  return out;
}
async function applyRemoteDataToLocal(dataObj){
  DRIVE.applyingRemote = true;
  try{ for(const k of Object.keys(dataObj||{})) await storeSet(k, dataObj[k]); }
  finally{ DRIVE.applyingRemote = false; }
}
// Full backup/restore: a single downloadable JSON file with everything the
// system stores (chart of accounts, groups, every year's journal shard,
// meta, settings, audit log) — independent of Google Drive, for a manual
// safety copy or moving to a fresh browser/device by hand.
async function downloadFullBackup(){
  try{
    const data = await collectAllLocalData();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mizan_backup_${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(t('backupDownloaded'));
  }catch(e){ showToast(t('backupDownloadError') + ': ' + e.message, 5000); }
}
async function restoreFromBackupFile(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('invalid file');
    await applyRemoteDataToLocal(data);
    showToast(t('backupRestored'));
    await initApp(); // reload STATE fresh from the newly-restored local storage
    scheduleDriveSync(); // if signed in to Drive, push the restored data up too
  }catch(e){ showToast(t('backupRestoreError') + ': ' + e.message, 5000); }
}
// Runs once right after sign-in: Drive is treated as the source of truth for
// cross-device use, so if a file already exists there it OVERWRITES whatever
// is in this browser's local storage; if this is the very first device to
// ever sign in, it seeds Drive with whatever's local instead.
async function driveInitialSync(){
  DRIVE.syncing = true; renderApp();
  try{
    const file = await driveFindFile();
    if(file){
      DRIVE.fileId = file.id;
      const remote = await driveDownloadFile(file.id);
      await applyRemoteDataToLocal(remote);
      showToast(t('driveDataLoaded'));
    } else {
      const local = await collectAllLocalData();
      const created = await driveUploadFile(null, local);
      DRIVE.fileId = created.id;
    }
    DRIVE.lastSyncAt = new Date();
    DRIVE.lastError = null;
    await initApp(); // reload STATE fresh from the now Drive-synced local storage
  }catch(e){
    DRIVE.lastError = e.message;
    showToast(t('driveSyncError') + ': ' + e.message, 5000);
    renderApp();
  }finally{ DRIVE.syncing = false; }
}
// Google's access tokens from this client-only flow typically last ~1 hour
// with no silent refresh available (that needs a backend). Rather than only
// finding out when a save silently fails partway through a work session,
// warn proactively a few minutes before it's due to expire so the person can
// refresh it with one click and never lose unsynced work.
function scheduleDriveSessionWarning(){
  if(DRIVE.sessionWarnTimer) clearTimeout(DRIVE.sessionWarnTimer);
  DRIVE.sessionExpiringSoon = false;
  DRIVE.sessionWarnTimer = setTimeout(() => {
    if(!DRIVE.signedIn) return;
    DRIVE.sessionExpiringSoon = true;
    showToast(t('driveSessionExpiringSoon'), 9000);
    renderApp();
  }, 50 * 60 * 1000); // ~50 min — tokens are typically valid ~60 min
}

async function performDriveSync(){
  DRIVE.syncing = true; renderApp();
  try{
    const local = await collectAllLocalData();
    const uploaded = await driveUploadFile(DRIVE.fileId, local);
    DRIVE.fileId = uploaded.id || DRIVE.fileId;
    DRIVE.lastSyncAt = new Date();
    DRIVE.lastError = null;
  }catch(e){
    DRIVE.lastError = e.message;
    showToast(t('driveSyncError') + ': ' + e.message, 5000);
  }finally{ DRIVE.syncing = false; renderApp(); }
}
// Debounced push: batches rapid successive writes (e.g. importing hundreds
// of lines) into a single Drive upload instead of one per line.
function scheduleDriveSync(){
  if(!DRIVE.signedIn || DRIVE.applyingRemote) return;
  if(DRIVE.pendingTimer) clearTimeout(DRIVE.pendingTimer);
  DRIVE.pendingTimer = setTimeout(() => { DRIVE.pendingTimer = null; performDriveSync(); }, 2000);
}
// Immediate sync for the "Sync now" button — same underlying call, no wait.
function scheduleDriveSyncNow(){
  if(!DRIVE.signedIn) return;
  performDriveSync();
}
