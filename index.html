<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ميزان | لوحة التحكم المالية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --ink:#101820;
  --ink-2:#182430;
  --ink-3:#1F2E3B;
  --paper:#FBF8F1;
  --paper-2:#F1ECDC;
  --paper-3:#E9E2CB;
  --line:#D9CFAE;
  --gold:#B8902E;
  --gold-light:#D9B45C;
  --gold-dim:#8A6E27;
  --emerald:#1F6D5A;
  --emerald-light:#28866D;
  --brick:#A23B31;
  --brick-light:#C4574B;
  --ink-soft:#5B6A72;
  --ink-faint:#8B978D;
  --shadow: 0 1px 2px rgba(80,60,20,.06), 0 10px 28px rgba(40,30,10,.14);
  --shadow-lift: 0 4px 10px rgba(80,60,20,.08), 0 18px 40px rgba(40,30,10,.18);
  --radius: 12px;
}

/* Item 6: Color Palette selector. Every accent element in the app already
   goes through the --gold / --gold-light / --gold-dim custom properties
   (buttons, active chips, sidebar highlights, sparkline/gauge accents,
   drill-down links, table highlights, icons) — so re-theming the whole
   dashboard is just overriding these three variables per palette, with zero
   changes needed anywhere else. Applied via body[data-palette="..."]. */
body[data-palette="emerald"]{ --gold:#1F6D5A; --gold-light:#2FA084; --gold-dim:#164F41; }
body[data-palette="sapphire"]{ --gold:#2A5DB0; --gold-light:#4F82D6; --gold-dim:#1D4483; }
body[data-palette="amethyst"]{ --gold:#6B3FA0; --gold-light:#9163C7; --gold-dim:#4C2C75; }
body[data-palette="crimson"]{ --gold:#A23B4E; --gold-light:#C4576B; --gold-dim:#792A38; }
body[data-palette="slate"]{ --gold:#42586B; --gold-light:#6B8499; --gold-dim:#2E3E4C; }

/* ---------- Light mode override (toggle via body.light-mode) ----------
   Scoped surgically to the dark "chrome" elements (sidebar/topbar/filters);
   card internals already use a light palette so they need no override. */
body.light-mode{ background:#EFEBE0; }
body.light-mode .sidebar{ background:linear-gradient(180deg,#2A3540,#1B242D); }
body.light-mode .main{ background:transparent; }
body.light-mode .topbar-title-row{ background:#EFEBE0; border-bottom-color:rgba(184,144,46,.3); }
body.light-mode .topbar-title-row h1{ color:#20262B; }
body.light-mode .topbar-title-row .sub{ color:#6B7278; }
body.light-mode .filters{ background:#fff; border-color:#DCD5C2; }
body.light-mode .filters label{ color:#6B7278; }
body.light-mode .filters input[type=date], body.light-mode .filters select{ background:#fff; color:#20262B; border-color:#D9CFAE; }
body.light-mode .chip{ color:#6B7278; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0; max-width:100%;}
/* Item 7: default application zoom ~90% — using CSS `zoom` (not `transform`)
   so it participates in normal layout (sticky/fixed positioning, scrollbars,
   and viewport-relative units all still behave correctly), unlike a
   transform: scale() wrapper which would require compensating width/height
   hacks and can misbehave with sticky headers. Widely supported across
   modern Chrome/Edge/Safari/Firefox. */
html{ zoom: 0.9; }
body{
  background: var(--ink);
  color: var(--paper);
  font-family:'Almarai', 'Segoe UI', Tahoma, sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display,.num-lg{ font-family:'Cairo','Almarai',sans-serif; }
.num, .num-lg, table td.num-cell{ font-variant-numeric: tabular-nums; direction:ltr; unicode-bidi:isolate; }
/* English/LTR mode: swap to a Latin-friendly font stack. Layout is largely
   direction-agnostic (flex row-reverse isn't used), so switching html[dir]
   to ltr reflows most of the app correctly; a handful of very page-specific
   labels may still show in Arabic until translated (see I18N above). */
body.lang-en{ font-family:'Segoe UI', Tahoma, Arial, sans-serif; }
body.lang-en h1, body.lang-en h2, body.lang-en h3, body.lang-en h4, body.lang-en .display{ font-family:'Segoe UI', Tahoma, Arial, sans-serif; }
::selection{ background: var(--gold); color:var(--ink); }
button{ font-family:inherit; cursor:pointer; }
input,select{ font-family:inherit; }

/* Scrollbar */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background: var(--ink-2); }
::-webkit-scrollbar-thumb{ background: var(--gold-dim); border-radius:6px; }

/* ---------- SHELL ---------- */
#app{ display:flex; min-height:100vh; align-items:flex-start; width:100%; overflow-x:clip; }
svg{ display:inline-block; vertical-align:middle; width:1em; height:1em; }

/* Sidebar - the ledger spine */
.sidebar{
  width:250px; flex:0 0 250px;
  background: linear-gradient(180deg, var(--ink-2), var(--ink));
  border-left: 1px solid rgba(184,144,46,.35);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  z-index:601;
}
.sidebar-backdrop{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:600; }
/* Requirement: a collapse/expand toggle for the sidebar on desktop too (not
   just the mobile off-canvas drawer) — clearing it frees that width for the
   page content, and clicking again restores everything exactly as it was.
   Scoped to desktop widths only so it never fights with the mobile
   transform-based show/hide below. */
@media (min-width:901px){
  #hamburgerBtn{ display:flex !important; }
  .sidebar{ transition: width .22s ease, min-width .22s ease, border-color .22s ease; }
  .sidebar.sidebar-collapsed{ width:0; min-width:0; flex:0 0 0; border-left-color:transparent; overflow:hidden; }
  .sidebar.sidebar-collapsed > *{ opacity:0; pointer-events:none; }
}
@media (max-width:900px){
  .sidebar{
    position:fixed; top:0; right:0; height:100vh; width:min(280px,82vw);
    transform:translateX(100%); transition:transform .25s ease; box-shadow:-10px 0 30px rgba(0,0,0,.4);
  }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-backdrop.show{ display:block; }
  #hamburgerBtn{ display:flex !important; }
}
.sidebar::after{
  content:""; position:absolute; top:0; bottom:0; left:-6px; width:6px;
  background-image: radial-gradient(circle, var(--gold-dim) 1.5px, transparent 1.6px);
  background-size: 6px 16px;
  opacity:.55;
}
.brand{
  display:flex; align-items:center; gap:10px;
  padding:20px 18px 12px 18px;
  border-bottom:1px solid rgba(217,180,92,.18);
}
.brand svg{ width:30px; height:30px; flex:0 0 30px; }
.brand-text .t1{ font-family:'Cairo'; font-weight:800; font-size:19px; color:var(--gold-light); letter-spacing:.5px; }
.brand-text .t2{ font-size:11px; color:var(--ink-faint); margin-top:1px; }

.company-field{ padding:10px 16px; border-bottom:1px solid rgba(217,180,92,.12); }
.company-field input{
  width:100%; background:transparent; border:none; border-bottom:1px dashed rgba(217,180,92,.35);
  color:var(--paper-2); font-size:12.5px; padding:4px 2px; outline:none;
}
.company-field input::placeholder{ color:var(--ink-faint); }
.company-field input:focus{ border-bottom-color:var(--gold-light); }

.nav{ padding:12px 9px; display:flex; flex-direction:column; gap:3px; }
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border-radius:9px; color:var(--ink-faint);
  font-size:13px; font-weight:700; border:1px solid transparent; position:relative;
  transition:.15s;
}
.nav-item svg{ width:16px; height:16px; flex:0 0 16px; opacity:.85; }
.nav-item:hover{ background:rgba(217,180,92,.08); color:var(--paper-2); }
.nav-item.active{ background:rgba(217,180,92,.14); color:var(--gold-light); border-color:rgba(217,180,92,.3); }
.nav-item.active::before{ content:''; position:absolute; inset-inline-start:-9px; top:20%; bottom:20%; width:3px; border-radius:3px; background:linear-gradient(180deg, var(--gold-light), var(--gold-dim)); }
.nav-section{ font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.8px; font-weight:800; padding:14px 12px 5px; }

.sidebar-status{
  margin:10px; padding:12px 12px; border-radius:10px;
  background:rgba(31,109,90,.14); border:1px solid rgba(31,109,90,.35);
  font-size:11.5px; color:var(--paper-2); line-height:1.9;
}
.sidebar-status b{ color:var(--gold-light); font-family:'Cairo'; }
.sidebar-status .row{ display:flex; justify-content:space-between; gap:8px; }

/* Main */
.main{ flex:1; min-width:0; padding:0 26px 60px; }
.topbar-title-row{
  position:sticky; top:0; z-index:31;
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  background:linear-gradient(180deg, var(--ink-2), var(--ink));
  margin:0 -26px 18px; padding:14px 26px 12px;
  border-bottom:1px solid rgba(217,180,92,.16);
  box-shadow:0 1px 0 rgba(217,180,92,.35), 0 10px 22px rgba(10,14,18,.28);
}
.topbar-title-row h1{ font-size:17px; color:var(--paper); margin:0; font-weight:800; letter-spacing:.2px; }
.topbar-title-row .sub{ color:var(--ink-faint); font-size:11.5px; margin-top:2px; }
.mobile-quick-controls{ display:none; } /* populated + shown on mobile only — see renderApp()'s reparent step and the max-width:900px rules below */
/* Compact area (was "box 3"): now hosts the period filters (moved from the old
   separate controls row) plus the language and theme toggles, all in one
   place. Same filter functionality/props as before — only location + look
   changed, restyled smaller to fit inline instead of a full separate row. */
.topbar-compact-controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
/* Requirement: filters stay on the SAME row as the page title instead of
   wrapping onto a line of their own underneath it (wasted vertical space).
   flex-wrap:wrap above is still needed as a safety valve for very narrow
   desktop windows, but on normal desktop widths the title block should
   shrink/truncate before the controls are forced down — so give the title
   block room to compress and let the controls scroll horizontally in the
   rare case they still don't fit, rather than breaking to a new row. */
@media (min-width:901px){
  .topbar-title-row{ flex-wrap:nowrap; }
  .topbar-title-row > div:first-child{ min-width:0; flex-shrink:1; }
  .topbar-title-row h1{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* BUG FIX: overflow-x:auto here previously clipped the year/month filter's
     dropdown panel, which is absolutely-positioned INSIDE this same element
     (.ms-panel is position:absolute relative to .multiselect, a descendant
     of .topbar-compact-controls) — any overflow other than visible on an
     ancestor clips/misplaces an absolutely-positioned element that extends
     past it. Keep this row from wrapping onto a second line via nowrap
     alone; do not constrain its overflow. */
  .topbar-compact-controls{ flex-wrap:nowrap; flex-shrink:0; }
}
.topbar-compact-controls .filters{ padding:4px 8px; gap:5px; font-size:11px; background:rgba(217,180,92,.06); }
.topbar-compact-controls .filters label{ font-size:10.5px; }
.topbar-compact-controls .filters input[type=date]{ font-size:11px; padding:3px 5px; }
.topbar-compact-controls .filters .chip{ font-size:10.5px; padding:3px 8px; }
.lang-toggle{ background:transparent; border:1px solid rgba(217,180,92,.35); color:var(--gold-light); border-radius:20px; padding:5px 11px; font-size:11.5px; font-weight:800; letter-spacing:.5px; }
.lang-toggle:hover{ background:rgba(217,180,92,.1); }

/* Item 6: color palette selector */
.palette-picker{ position:relative; display:inline-block; }
.palette-toggle{
  width:30px; height:30px; border-radius:50%; border:1px solid rgba(217,180,92,.35); cursor:pointer; padding:0;
  background:transparent; color:var(--gold-light); display:flex; align-items:center; justify-content:center;
  transition: background .14s ease, border-color .16s ease;
}
.palette-toggle:hover{ background:rgba(217,180,92,.1); border-color:rgba(217,180,92,.6); }
.palette-panel{
  position:absolute; top:calc(100% + 6px); left:0; z-index:60; background:var(--paper); border:1px solid var(--line);
  border-radius:10px; box-shadow:var(--shadow); padding:10px; display:flex; flex-wrap:wrap; gap:8px; width:250px; max-width:80vw;
}
.palette-swatch{
  width:30px; height:30px; border-radius:50%; cursor:pointer; border:2px solid transparent; flex:0 0 auto;
  transition: transform .14s ease, border-color .14s ease; position:relative;
}
.palette-swatch:hover{ transform:scale(1.12); }
.palette-swatch.active{ border-color:var(--ink); }
.palette-swatch.active::after{ content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.4); }

.filters{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; background:var(--ink-2); padding:6px 9px; border-radius:9px; border:1px solid rgba(217,180,92,.15); }
.filters label{ font-size:11px; color:var(--ink-faint); }
.filters input[type=date], .filters select{
  background:var(--ink); color:var(--paper-2); border:1px solid rgba(217,180,92,.25);
  border-radius:6px; padding:5px 7px; font-size:12px;
}
/* Item 2: hybrid date input — a typeable text field (accepts DD-MM-YYYY,
   DD/MM/YYYY, or YYYY-MM-DD) plus a small button that opens the native
   calendar picker (kept fully available, just visually tucked into a button
   instead of the default browser widget). */
.date-input-wrap{ position:relative; display:inline-flex; align-items:center; }
.date-text-input{
  background:var(--ink); color:var(--paper-2); border:1px solid rgba(217,180,92,.25);
  border-radius:6px; padding:5px 26px 5px 7px; font-size:12px; width:108px; direction:ltr; text-align:center;
}
.date-text-input.date-input-invalid{ border-color:var(--brick); box-shadow:0 0 0 1px var(--brick); }
.date-hidden-picker{ position:absolute; inset:0; opacity:0; pointer-events:none; width:1px; height:1px; }
.date-picker-btn{
  position:absolute; left:4px; top:50%; transform:translateY(-50%);
  background:transparent; border:none; color:var(--gold-dim); cursor:pointer; padding:2px; display:flex;
}
.date-picker-btn:hover{ color:var(--gold-light); }
.chip-btns{ display:flex; gap:5px; }
.chip{ background:transparent; border:1px solid rgba(217,180,92,.3); color:var(--ink-faint); font-size:10.5px; padding:4px 9px; border-radius:20px; cursor:pointer; transition: background .16s ease, color .16s ease, border-color .16s ease; }
.chip:hover, .chip.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:700;}

/* Cards / paper sheets */
.card{
  background: linear-gradient(175deg, var(--paper) 0%, var(--paper-2) 130%);
  color: var(--ink);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding:18px 20px;
  margin-bottom:16px;
  position:relative;
  border-top:3px solid transparent;
  border-image: linear-gradient(90deg, var(--gold-dim), var(--gold-light) 55%, var(--gold-dim)) 1;
  transition: box-shadow .22s ease, transform .22s ease;
}
.card:hover{ box-shadow: var(--shadow-lift); transform: translateY(-1px); }
.card h2{ font-size:14.5px; margin:0 0 12px; color:var(--ink-2); display:flex; align-items:center; gap:9px; letter-spacing:.15px; font-weight:800; }
.card h2 svg{ width:16px; height:16px; flex:0 0 16px; }
.card h2 .badge-count{ font-size:11px; background:var(--paper-3); color:var(--ink-soft); padding:2px 8px; border-radius:10px; font-weight:700; transition: background .18s ease, color .18s ease; }
.card h2 .badge-count.drill:hover{ background:var(--gold); color:var(--ink); }
.card .desc{ color:var(--ink-soft); font-size:12px; margin-top:-6px; margin-bottom:12px; line-height:1.6; }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; min-width:0; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; min-width:0; }
.grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; min-width:0; }
@keyframes view-fade-in-kf{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
.view-fade-in{ animation: view-fade-in-kf .22s ease; }
.grid-2 > *, .grid-3 > *, .grid-4 > *{ min-width:0; }
.tbl-export-toolbar{ display:flex; justify-content:flex-start; margin-bottom:6px; }
.tbl-export-btn{ padding:3px 10px; font-size:10.5px; }
/* BUG FIX (Dashboard → Liquidity KPI cards wrapping large numbers to two
   lines): this section always has exactly 3 KPI cards, but was reusing
   .grid-3, which the wide-screen rule below stretches to 5 equal columns —
   on a wide monitor that left only 3 of those 5 tracks filled, so each card
   was rendered far narrower than intended (1/5 of the row instead of 1/3),
   squeezing large currency figures onto two lines. A dedicated class that
   always keeps exactly 3 columns (no 5-column jump) gives these cards their
   intended width at every screen size. */
.grid-liquidity-kpi{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; min-width:0; }
.grid-liquidity-kpi > *{ min-width:0; }
@media (max-width:1100px){ .grid-liquidity-kpi{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .grid-liquidity-kpi{grid-template-columns:1fr;} }
/* Same fix, for the Dashboard's top 4-card KPI row (Working Capital / Net
   Equity / Total Revenue / Net Income): it always has exactly 4 cards, so it
   must not inherit .grid-4's wide-screen 6-column escalation either — that
   left it narrower than the full page width with empty trailing columns. */
.grid-dashboard-kpi{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; min-width:0; }
.grid-dashboard-kpi > *{ min-width:0; }
@media (max-width:1100px){ .grid-dashboard-kpi{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .grid-dashboard-kpi{grid-template-columns:1fr;} }
/* Higher information density on wide desktop monitors (item 2): KPI grids
   pack more cards per row instead of leaving the extra width unused. */
@media (min-width:1500px){ .grid-4{grid-template-columns:repeat(6,1fr);} .grid-3{grid-template-columns:repeat(5,1fr);} }
@media (max-width:1100px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} }
@media (max-width:640px){ .grid-4{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;} }

/* KPI */
.kpi{
  background: linear-gradient(160deg, var(--paper), var(--paper-2));
  border:1px solid var(--line); border-radius:10px; padding:11px 15px 9px;
  position:relative; overflow:hidden; min-width:0;
  transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
.kpi::before{ content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:3px; background:linear-gradient(180deg, var(--gold-light), var(--gold-dim)); opacity:.75; }
.kpi:hover{ border-color:var(--gold-dim); transform:translateY(-2px); box-shadow:0 8px 20px rgba(40,30,10,.12); }
.kpi .lbl{ font-size:11.5px; color:var(--ink-soft); font-weight:700; }
.kpi .val{ font-family:'Cairo'; font-weight:800; font-size:clamp(14px, 2.1vw, 22px); margin-top:4px; color:var(--ink); line-height:1.25; overflow-wrap:break-word; word-break:break-word; }
.kpi .sub{ font-size:11px; color:var(--ink-faint); margin-top:2px; overflow-wrap:break-word; }
.kpi .spark{ margin-top:4px; display:block; }
.spark-line{ stroke-dasharray:300; stroke-dashoffset:300; animation: spark-draw 900ms ease forwards; }
@keyframes spark-draw{ to{ stroke-dashoffset:0; } }
.gauge-arc{ stroke-dashoffset:0; transition: stroke-dasharray 700ms ease; }
.kpi .gauge-wrap{ margin-top:8px; display:flex; align-items:center; gap:8px; }
.kpi.pos .val{ color:var(--emerald); }
.kpi.neg .val{ color:var(--brick); }
.kpi::before{ content:""; position:absolute; top:-20px; left:-20px; width:70px; height:70px; border-radius:50%; background:radial-gradient(circle, rgba(184,144,46,.18), transparent 70%); }

/* Tables */
.table-wrap{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:12.5px; }
thead th{
  text-align:right; padding:7px 10px; background:var(--ink-2); color:var(--gold-light);
  font-family:'Cairo'; font-weight:700; font-size:11.2px; position:sticky; top:0;
  border-bottom:2px solid var(--gold);
}
/* Column drag-to-reorder (desktop only — see attachColumnReordering) */
thead th.col-draggable{ cursor:grab; }
thead th.col-dragging{ opacity:.4; cursor:grabbing; }
thead th.col-drop-target{ box-shadow: inset 2px 0 0 var(--gold-light), inset -2px 0 0 var(--gold-light); }
tbody td{ padding:6px 10px; border-bottom:1px solid var(--line); color:var(--ink-2); }
tbody tr:hover{ background:var(--paper-2); }
tbody tr.total-row td{ font-weight:800; border-top:2px solid var(--gold); background:var(--paper-3); }
.num-cell{ text-align:left; }
.drill{ cursor:pointer; text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--gold-dim); text-underline-offset:2px; }
.drill:hover{ color:var(--gold-dim); font-weight:700; }
.pos-text{ color:var(--emerald); font-weight:700; }
.neg-text{ color:var(--brick); font-weight:700; }

/* Buttons/inputs */
.btn{ background:var(--ink); color:var(--paper); border:1px solid var(--ink); padding:9px 17px; border-radius:9px; font-weight:700; font-size:13px; letter-spacing:.1px; cursor:pointer; transition: background .16s ease, transform .14s ease, box-shadow .16s ease; }
.btn:hover{ background:var(--ink-2); transform:translateY(-1.5px); box-shadow:0 6px 14px rgba(40,30,10,.16); }
.btn:active{ transform:translateY(0); box-shadow:none; }
.btn-gold{ background:linear-gradient(155deg, var(--gold-light), var(--gold)); border-color:var(--gold); color:var(--ink); }
.btn-gold:hover{ background:linear-gradient(155deg, var(--gold-light), var(--gold-light)); box-shadow:0 6px 16px rgba(184,144,46,.28); }
.btn-outline{ background:transparent; color:var(--ink); border:1px solid var(--ink-soft); }
.btn-outline:hover{ border-color:var(--ink); background:rgba(16,24,32,.04); }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
select.input, input.input{
  border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; background:#fff; color:var(--ink);
  transition: border-color .16s ease, box-shadow .16s ease;
}
select.input:focus, input.input:focus{ outline:none; border-color:var(--gold-dim); box-shadow:0 0 0 3px rgba(217,180,92,.15); }
label.lbl{ font-size:11.5px; color:var(--ink-soft); font-weight:700; display:block; margin-bottom:4px; }

.tabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.tab{ padding:7px 14px; border-radius:8px 8px 0 0; background:var(--paper-2); color:var(--ink-soft); font-size:12.5px; font-weight:700; border:1px solid var(--line); border-bottom:none; }
.tab.active{ background:var(--paper); color:var(--ink); border-bottom:2px solid var(--paper); margin-bottom:-1px; }

.upload-box{
  border:2px dashed var(--line); border-radius:10px; padding:18px; text-align:center;
  background:var(--paper-2);
}
.upload-box input[type=file]{ font-size:12px; }
.upload-box.ready{ border-color:var(--emerald); background:#eef6f2; }

.pill{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
.pill-gold{ background:rgba(184,144,46,.15); color:var(--gold-dim); }
.pill-em{ background:rgba(31,109,90,.14); color:var(--emerald); }
.pill-brick{ background:rgba(162,59,49,.13); color:var(--brick); }
.pill-blue{ background:rgba(91,106,114,.14); color:var(--ink-soft); }

.empty{ text-align:center; padding:36px 10px; color:var(--ink-faint); font-size:13px; }
.empty svg{ width:52px; height:52px; opacity:.35; margin-bottom:10px; }

.log-item{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
.log-item:last-child{ border-bottom:none; }

.toast{
  position:fixed; bottom:20px; left:20px; background:var(--ink); color:var(--paper);
  padding:12px 18px; border-radius:8px; border-right:4px solid var(--gold); box-shadow:var(--shadow);
  font-size:13px; z-index:999; max-width:360px;
}

.section-title{ font-family:'Cairo'; font-weight:800; color:var(--ink); font-size:14px; margin:18px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between;}

.hint{ font-size:11.5px; color:var(--ink-faint); }

.mapping-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; font-size:11.5px; margin:12px 0; }
.mapping-grid .m-item{ background:var(--paper-2); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
.mapping-grid .m-item b{ display:block; color:var(--gold-dim); font-family:'Cairo'; }
@media (max-width:900px){ .mapping-grid{grid-template-columns:repeat(2,1fr);} }

.progress-note{ font-size:11.5px; color:var(--ink-soft); margin-top:8px; }

.chart-box{ position:relative; height:280px; }
.chart-box.sm{ height:220px; }

.mobile-filters-toggle{ display:none; }
/* Multi-select filter */
.multiselect{ position:relative; z-index:2; }
.ms-toggle{ cursor:pointer; }
.ms-panel{
  position:absolute; top:100%; margin-top:4px; z-index:950; min-width:220px; max-height:260px; overflow-y:auto;
  background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); padding:8px;
}
.ms-panel-actions{ display:flex; gap:6px; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid var(--line); }
.ms-panel-actions .chip{ color:var(--ink-soft); border-color:var(--line); }
.ms-panel-actions .chip.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.ms-item{ display:flex; align-items:center; gap:7px; padding:4px 2px; font-size:12.5px; color:var(--ink); cursor:pointer; }
.ms-item:hover{ background:var(--paper-2); }

/* Excel-style table header filter+sort (compact icon-only multiselect embedded in a <th>, see filterableTh) */
.multiselect-icon-only{ display:inline-flex; vertical-align:middle; }
.th-filter-icon{
  display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; padding:0;
  background:transparent; border:1px solid transparent; border-radius:4px; color:var(--gold-light); opacity:.75; cursor:pointer;
  transition: background .14s ease, opacity .14s ease, color .14s ease;
}
.th-filter-icon:hover{ opacity:1; background:rgba(255,255,255,.12); }
.th-filter-icon.active{ opacity:1; color:var(--ink); background:var(--gold); border-color:var(--gold); }
.th-header-row{ display:inline-flex; align-items:center; gap:5px; }
.th-sort-label{ cursor:pointer; user-select:none; }
.th-sort-label:hover{ color:#fff; }
th.filter-th .ms-panel{ text-align:right; } /* the panel's own contents shouldn't inherit a num-cell header's left text-align */
/* Item 1 — Account Tree Filter redesign: clearer hierarchy via generous
   indentation + a dashed guide rail per level, a folder/leaf icon so groups
   and accounts are visually distinct at a glance, a smooth height/opacity
   transition on expand/collapse instead of an abrupt display:none flip, and
   a stronger highlight for the current selection state. */
.tree-node{ margin:1px 0; }
.tree-row{
  display:flex; align-items:center; gap:6px; border-radius:6px; padding:2px 4px;
  transition: background .14s ease;
}
.tree-row:hover{ background:var(--paper-2); }
.tree-toggle{
  width:19px; height:19px; flex:0 0 19px; border-radius:6px; border:1px solid var(--line);
  background:var(--paper-2); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center;
  justify-content:center; padding:0; transition: background .16s ease, color .16s ease, border-color .16s ease, transform .2s ease;
}
.tree-toggle svg{ width:10px; height:10px; transition: transform .2s ease; }
.tree-toggle[data-expanded="1"] svg{ transform: rotate(90deg); }
.tree-toggle:hover{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.tree-toggle-spacer{ width:19px; flex:0 0 19px; }
.tree-icon{ flex:0 0 auto; color:var(--ink-faint); opacity:.85; }
.tree-icon.tree-icon-group{ color:var(--gold-dim); }
.tree-node.tree-node-selected > .tree-row{ background:rgba(217,180,92,.14); }
.tree-node.tree-node-selected > .tree-row .ms-item{ color:var(--gold-light); font-weight:700; }
.tree-children{
  border-right:1px dashed var(--line); margin-right:9px; padding-right:8px;
  overflow:hidden; max-height:0; opacity:0; transition: max-height .28s ease, opacity .22s ease;
}
.tree-children.tree-children-expanded{ max-height:20000px; opacity:1; }
.ms-group-cb{ accent-color:var(--gold-dim); }

/* Sortable table headers */
.sortable-th{ cursor:pointer; user-select:none; }
.sortable-th:hover{ color:#fff; }

/* Theme toggle */
.theme-toggle{
  width:30px; height:30px; border-radius:50%; border:1px solid rgba(217,180,92,.35); cursor:pointer; padding:0;
  background:transparent; color:var(--gold-light); display:flex; align-items:center; justify-content:center; font-size:15px;
  transition: background .14s ease, border-color .16s ease;
}
.theme-toggle:hover{ background:rgba(217,180,92,.1); border-color:rgba(217,180,92,.6); }
.nav-arrows{ display:flex; gap:4px; flex:0 0 auto; }
.nav-arrows button{
  width:30px; height:30px; border-radius:8px; border:1px solid rgba(217,180,92,.3);
  background:var(--ink-2); color:var(--gold-light); font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.nav-arrows button:hover{ background:var(--gold); color:var(--ink); }
.app-footer{
  margin-top:30px; padding:18px 4px 6px; border-top:1px solid rgba(217,180,92,.15);
  display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:14px;
  color:var(--ink-faint); font-size:13px; line-height:1.6; text-align:center;
}
.app-footer-text{ display:flex; flex-direction:column; gap:6px; align-items:center; }
.app-footer-brand{ display:flex; align-items:center; justify-content:center; gap:8px; }
.app-footer .footer-logo{ width:38px; height:38px; border-radius:8px; object-fit:contain; opacity:.94; flex:0 0 auto; }
.app-footer-email{ color:var(--gold-dim); text-decoration:none; font-size:12px; font-weight:600; transition:color .16s ease; }
.app-footer-email:hover{ color:var(--gold-light); text-decoration:underline; }
.app-footer strong{ color:var(--gold-light); font-weight:800; }
/* The footer text mixes Arabic (RTL) with Latin content. Without an explicit
   bidi isolate, the browser's bidi algorithm can visually reorder the Latin
   run relative to the surrounding Arabic — <bdi dir="ltr"> below fixes this
   regardless of the document's base direction, on all screen sizes. */
.app-footer bdi{ unicode-bidi:isolate; direction:ltr; display:inline-block; }
@media print{ .app-footer{ display:none; } }
#hamburgerBtn{
  display:none; width:40px; height:40px; border-radius:8px; border:1px solid rgba(217,180,92,.35);
  background:var(--ink-2); color:var(--gold-light); font-size:18px; cursor:pointer;
  align-items:center; justify-content:center; flex:0 0 auto;
}
@media (max-width:900px){
  .main{ padding:0 14px 60px; }
  .topbar-title-row{ margin:0 -14px 0; padding:12px 14px 8px; }
  .topbar-title-row h1{ font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar-title-row .sub{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar-title-row > div:first-child{ min-width:0; flex:1 1 auto; }
  .topbar-title-block{ min-width:0; overflow:hidden; }
  /* The lang/palette/dark-mode buttons used to sit inside .topbar-compact-controls,
     which on mobile rendered as its own big full-width block under the title
     (see the collapsible-filters fix above for the other half of that
     block). They're moved here, next to the title, by renderApp() (mobile
     width only) so that reclaimed space goes to actual page content instead —
     desktop is unaffected since .mobile-quick-controls stays empty/hidden there. */
  .mobile-quick-controls{ display:flex; align-items:center; gap:5px; flex-shrink:0; margin-inline-start:auto; }
  .mobile-quick-controls .lang-toggle{ padding:4px 8px; font-size:10.5px; }
  .mobile-quick-controls .theme-toggle,
  .mobile-quick-controls .palette-toggle{ width:24px; height:24px; }
  .mobile-quick-controls .palette-panel{ left:auto; right:0; }
  .topbar-compact-controls{ width:100%; }
  .card{ padding:16px 14px; }
  .nav-arrows{ display:none; }
  .multiselect{ position:static; }
  .ms-panel{ position:fixed !important; top:auto !important; bottom:10px; right:10px; left:10px; width:auto !important; max-width:100%;
    border-radius:14px; max-height:46vh; overflow-y:auto; z-index:700; box-shadow:0 -10px 30px rgba(0,0,0,.4); }
  .filters{ width:100%; }
  .grid-2, .grid-3, .grid-4{ gap:10px; }
  button, .btn, .chip, select.input, input.input{ min-height:36px; }
  /* Item: header filters looked cramped/misaligned on mobile — the
     multiselect toggle buttons (year/month/accounts/etc.) each carry a
     170px min-width meant for desktop, which alone is nearly half a phone
     screen; combined with the date pickers and preset chips all trying to
     sit on one flexible row, the result wrapped unevenly. Give every filter
     control a consistent, smaller footprint and let them form clean full-
     or half-width rows instead. */
  .topbar-compact-controls{ flex-direction:column; align-items:stretch; gap:8px; }
  .filters{ gap:6px; padding:8px; }
  .filters label{ font-size:10px; flex:0 0 auto; }
  .filters .date-input-wrap{ flex:1 1 auto; min-width:0; }
  .filters .date-text-input{ width:100%; min-width:0; font-size:11.5px; }
  .multiselect{ flex:1 1 120px; min-width:0; }
  .multiselect .ms-toggle{ min-width:0 !important; width:100%; font-size:11.5px; padding:7px 8px; }
  .filters .chip-btns{ width:100%; justify-content:flex-start; }
  .filters .chip-btns .chip{ flex:1 1 auto; text-align:center; }
  .topbar-compact-controls > div:not(.filters){ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  /* Item: the filter bar (date range + preset chips + year/month) stayed
     permanently expanded and full-width on mobile, pushing page content far
     down the screen before the user saw anything useful. Collapse it behind
     a small toggle by default on mobile only — desktop is untouched, since
     .mobile-filters-toggle is display:none by default (see base rule below)
     and only turns on inside this media query. */
  .mobile-filters-toggle{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    background:rgba(217,180,92,.06); border:1px solid var(--line-dark, rgba(217,180,92,.25));
    color:var(--gold-light); border-radius:10px; padding:8px 12px; font-size:12px; font-weight:700;
    font-family:'Cairo'; cursor:pointer; margin-bottom:6px;
  }
  .mobile-filters-toggle-arrow{ font-size:10px; }
  .filters.filters-collapsed-mobile{ display:none; }
}
@media (max-width:480px){
  .kpi .val{ font-size:16px; }
  .card h2{ font-size:13.5px; }
  .app-footer{ font-size:11.5px; gap:8px; padding:14px 10px 6px; }
  .app-footer .footer-logo{ width:30px; height:30px; }
}
.theme-toggle:hover{ background:rgba(217,180,92,.1); }
.theme-toggle svg{ width:14px; height:14px; }

/* Expand/collapse rows */
.expand-toggle{ cursor:pointer; display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border:1px solid var(--ink-soft); border-radius:4px; font-size:11px; margin-left:6px; color:var(--ink-soft); }
.expand-toggle:hover{ background:var(--paper-3); }
tr.detail-row{ background:var(--paper-2); }
tr.detail-row td{ padding-right:28px; font-size:12px; color:var(--ink-soft); }

/* Print */
@keyframes modal-overlay-in{ from{ opacity:0; } to{ opacity:1; } }
@keyframes modal-box-in{ from{ opacity:0; transform:translateY(10px) scale(.97); } to{ opacity:1; transform:translateY(0) scale(1); } }
.modal-overlay{
  position:fixed; inset:0; background:rgba(16,24,32,.6); z-index:1000;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
/* Opt-in only (not applied to .modal-overlay/.modal-box by default): the
   Edit Journal Entry modal re-renders its own modal-box on every keystroke
   to keep the running totals live, so animating that element would replay
   the animation on every character typed. These two classes are added
   explicitly by the one-shot confirm dialogs (delete/reset confirmations)
   that only render once per open, where the effect actually reads as
   "opening", not a flicker. */
.modal-overlay-anim{ animation: modal-overlay-in .18s ease; }
.modal-box{
  background:var(--paper); color:var(--ink); border-radius:12px; max-width:420px; width:100%;
  padding:22px 24px; box-shadow:0 20px 50px rgba(0,0,0,.4); border-top:4px solid var(--brick);
}
.modal-box-anim{ animation: modal-box-in .22s cubic-bezier(.2,.9,.3,1.2); }
.modal-box h3{ margin:0 0 10px; font-family:'Cairo'; font-size:16px; }
.modal-box p{ margin:0 0 18px; font-size:13.5px; line-height:1.8; color:var(--ink-soft); }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; }

#scrollTopBtn{
  position:fixed; bottom:24px; left:24px; z-index:500;
  width:44px; height:44px; border-radius:50%; border:1px solid var(--gold);
  background:var(--ink-2); color:var(--gold-light); font-size:18px; font-weight:800;
  box-shadow:var(--shadow); cursor:pointer; display:none; align-items:center; justify-content:center;
  transition:opacity .15s, transform .15s;
}
#scrollTopBtn:hover{ background:var(--gold); color:var(--ink); transform:translateY(-2px); }
#scrollTopBtn.show{ display:flex; }
@media print{ #scrollTopBtn{ display:none !important; } }

@media print{
  .sidebar, .topbar-title-row, .btn, .chip-btns, .no-print{ display:none !important; }
  .main{ padding:0; }
  .card{ box-shadow:none; border:1px solid #ccc; break-inside:avoid; }
  body{ background:#fff; }
}
</style>

function normalize(s){ return (s==null?'':s.toString()).replace(/[\s\r\n]+/g,'').trim(); }
function toNum(v){
  if(v==null || v==='') return 0;
  if(typeof v === 'number') return isNaN(v)?0:v;

// The global year/month multi-select (top bar) layers on top of the simple
// start/end range: if one or more years/months are checked, a date must ALSO
// fall within one of those years/months to match — this supports genuinely
// non-contiguous selections (e.g. 2024 + 2026 but not 2025), which a plain
// [start,end] range cannot express.
function periodFilterActive(filters){
  filters = filters || STATE.ui.filters;
  return (filters.years && filters.years.length) || (filters.months && filters.months.length);
}
function matchesPeriod(dateStr, filters){
  filters = filters || STATE.ui.filters;
  if(periodFilterActive(filters)){
    // Years/months selection takes exclusive control of the period — it does NOT
    // additionally get constrained by the simple start/end range, otherwise a
    // leftover default range (e.g. "this year to date") would silently exclude
    // any selected year/month that falls outside it.
    if(filters.years && filters.years.length && !filters.years.includes(dateStr.slice(0,4))) return false;
    if(filters.months && filters.months.length && !filters.months.includes(dateStr.slice(5,7))) return false;
    return true;
  }
  if(filters.start && dateStr < filters.start) return false;
  if(filters.end && dateStr > filters.end) return false;
  return true;

  filters = filters || STATE.ui.filters;
  if(!periodFilterActive(filters)) return lines; // fast path: unchanged behaviour when the feature isn't used

// filterLinesByPeriod, so calc functions that separately take (start,end)
// must receive '' for BOTH — passing the leftover start/end range here would
// re-apply it on top and silently re-exclude data the years/months selection
// was meant to include (this was the actual bug: only `start` was cleared,
// `end` kept defaulting to "today", cutting off anything after today's date

function effectiveRange(filters){

  if(periodFilterActive(filters)) return { start:'', end:'' };

function toISODate(v, date1904){

  //
  // The previous implementation relied on JS Date objects (either built by
  // SheetJS's cellDates option, or by `new Date(string)`) and then read the
  // date back out using getFullYear()/getMonth()/getDate(). A JS Date always
  // stores a single absolute instant in time; converting an Excel date serial
  // to a Date necessarily requires picking SOME timezone to "anchor" that
  // instant (SheetJS anchors it in UTC). Reading it back with LOCAL getters
  // is only correct for users whose timezone offset happens not to cross a
  // midnight boundary relative to that anchor — it silently breaks (shifts
  // the date back by one day) for other timezones/machines/browsers. This is
  // exactly the class of bug being reported, and it is NOT reliably fixable
  // by picking "local" vs "UTC" getters — either choice is wrong for someone.
  //
  // The only fully correct, timezone-INDEPENDENT fix is to never construct a
  // JS Date at all for pure calendar dates. Excel stores dates as a plain
  // serial day-count number with no timezone attached. We now read workbooks
  // with cellDates:false (see readWorkbook), so `v` arrives here as that raw
  // numeric serial, and we decode y/m/d directly via XLSX.SSF.parse_date_code,
  // which is pure arithmetic on the serial number — no timezone, no Date
  // object, no ambiguity, identical result on every machine everywhere.
  if(v==null || v==='') return '';

    try{
      const d = XLSX.SSF.parse_date_code(v, date1904 ? {date1904:true} : undefined);
      if(d && d.y) return `${d.y}-${pad2(d.m)}-${pad2(d.d)}`;
    }catch(e){}
  }
  // Fallback: a genuine JS Date instance was passed in directly (e.g. from
  // some other caller, or a legacy cached value). Use UTC getters, matching
  // how SheetJS anchors converted dates, so the calendar day is preserved
  // regardless of the viewer's local timezone.
  if(v instanceof Date && !isNaN(v)){
    return `${v.getUTCFullYear()}-${pad2(v.getUTCMonth()+1)}-${pad2(v.getUTCDate())}`;
  }
  const s = v.toString().trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);

    // a month (>12), it must be the day (common in Excel files exported with
    // Arabic/Egyptian regional settings, which use DD/MM/YYYY).
    if(a > 12 && b <= 12){ const t=a; a=b; b=t; }
    return `${m[3]}-${pad2(a)}-${pad2(b)}`;

function t(key){
  const lang = (STATE.settings && STATE.settings.lang) || 'ar';
  return (I18N[lang] && I18N[lang][key]) || (I18N.ar[key]) || key;
}
// Like t(), but substitutes ${name} placeholders in the translated string
// with values from `params` — for messages that need a dynamic value (a
// count, a filename) while still being fully translatable text.
function tf(key, params){
  return t(key).replace(/\$\{(\w+)\}/g, (_, k) => (params && params[k] != null) ? params[k] : '');
}
function applyLangToDocument(){
  const lang = (STATE.settings && STATE.settings.lang) || 'ar';
  document.documentElement.lang = lang === 'en' ? 'en' : 'ar';
  document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  document.body.classList.toggle('lang-en', lang === 'en');
}
// Requirement: instead of a single preset that recolors everything together,
// let the user independently recolor distinct parts of the dashboard — the
// accent/highlight color, the dark sidebar/header surfaces, the card
// background, and the positive/negative number colors — each with its own
// picker. Presets still work as a starting point; a custom color for any one
// of these five targets is layered on top via inline styles on <body> (which
// beat the body[data-palette] attribute-selector rules), so picking one
// custom color never resets the others. Lighter/darker shades needed for a
// custom accent or dark-surface color are derived automatically.
function hexToRgb(hex){
  hex = (hex||'').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const n = parseInt(hex,16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgbToHex(r,g,b){
  const c = v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');
  return '#'+c(r)+c(g)+c(b);
}
function shadeColor(hex, pct){ // pct>0 lightens toward white, pct<0 darkens toward black
  const {r,g,b} = hexToRgb(hex);
  const t = pct < 0 ? 0 : 255, p = Math.abs(pct);
  return rgbToHex(r+(t-r)*p, g+(t-g)*p, b+(t-b)*p);
}
const THEME_TARGETS = ['gold','ink','paper','emerald','brick'];
function cssColorToHex(v){
  if(!v) return '#000000';
  v = v.trim();
  if(v.startsWith('#')) return v.length===4 ? '#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3] : v;
  const m = v.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if(m) return rgbToHex(+m[1], +m[2], +m[3]);
  return '#000000';
}
function themeTargetRows(){
  const cs = getComputedStyle(document.body);
  return [
    { key:'gold', labelKey:'themeTargetAccent', fallback: cssColorToHex(cs.getPropertyValue('--gold')) },
    { key:'ink', labelKey:'themeTargetDarkSurfaces', fallback: cssColorToHex(cs.getPropertyValue('--ink')) },
    { key:'paper', labelKey:'themeTargetCards', fallback: cssColorToHex(cs.getPropertyValue('--paper')) },
    { key:'emerald', labelKey:'themeTargetPositive', fallback: cssColorToHex(cs.getPropertyValue('--emerald')) },
    { key:'brick', labelKey:'themeTargetNegative', fallback: cssColorToHex(cs.getPropertyValue('--brick')) },
  ];
}
function applyPaletteToDocument(){
  const palette = (STATE.settings && STATE.settings.palette) || 'gold';
  if(palette === 'gold') delete document.body.dataset.palette;
  else document.body.dataset.palette = palette;

  const custom = (STATE.settings && STATE.settings.customTheme) || {};
  THEME_TARGETS.forEach(key => {
    const base = custom[key];
    if(!base){
      document.body.style.removeProperty('--'+key);
      if(key==='gold'){ document.body.style.removeProperty('--gold-light'); document.body.style.removeProperty('--gold-dim'); }
      if(key==='ink'){ document.body.style.removeProperty('--ink-2'); document.body.style.removeProperty('--ink-3'); }
      return;
    }
    document.body.style.setProperty('--'+key, base);
    if(key==='gold'){
      document.body.style.setProperty('--gold-light', shadeColor(base, 0.25));
      document.body.style.setProperty('--gold-dim', shadeColor(base, -0.25));
    }
    if(key==='ink'){
      document.body.style.setProperty('--ink-2', shadeColor(base, 0.12));
      document.body.style.setProperty('--ink-3', shadeColor(base, 0.24));
    }
  });
}

function escapeHtml(s){ return (s==null?'':s.toString()).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jsAttrEscape(s){ return (s==null?'':s.toString()).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function uniq(arr){ return [...new Set(arr)]; }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

// BUG FIX (Arabic text getting scrambled while typing in search boxes, e.g.
// "مسحوبات شخصية" turning into "خصيهات شمسحوب"): every debounced keystroke
// called renderApp(), which rebuilds the ENTIRE view — including destroying
// and recreating the search <input> itself — then simply called .focus() on
// the new element. Focusing a freshly-created input does not restore where
// the caret was; the browser resets it, and for RTL text a reset caret means
// the NEXT keystroke gets inserted at the wrong logical position instead of
// continuing where the user left off, scrambling the word order over a few
// keystrokes. The fix: capture the exact caret position right before the
// re-render, then explicitly restore it (setSelectionRange) afterwards.
function attachDebouncedSearchInput(id, onCommit, ms){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', debounce(() => {
    const start = el.selectionStart, end = el.selectionEnd;
    onCommit(el.value);
    renderApp();
    const fresh = document.getElementById(id);
    if(fresh){
      fresh.focus();
      try{ fresh.setSelectionRange(start, end); }catch(e){}
    }
  }, ms || 300));
}

/* ---------- export helpers ---------- */
const ISO_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const NUMERIC_TEXT_RE = /^-?[\d,]+(\.\d+)?$/;

// Converts an ISO 'YYYY-MM-DD' string to an Excel date serial number using
// pure UTC day-count arithmetic — Date.UTC() is used only as a calendar day
// counter here (the difference between two UTC timestamps), never read back
// with a timezone-sensitive getter, so this carries none of the "date is one
// day off" risk that a round-tripped JS Date object would (see toISODate's
// comment above for the full story on why this app avoids Date objects for
// calendar dates). An Excel date is just a formatted number, so writing a
// plain numeric cell with a date format is also the most native possible
// representation, not a workaround.
function isoDateToExcelSerial(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if(!m) return null;
  const ms = Date.UTC(+m[1], +m[2]-1, +m[3]) - Date.UTC(1899, 11, 30);
  return Math.round(ms / 86400000);
}
function detectColumnType(values){
  const present = values.filter(v => v !== '' && v != null);
  if(!present.length) return 'text';
  if(present.every(v => typeof v === 'number')) return 'number';
  if(present.every(v => typeof v === 'string' && ISO_DATE_RE.test(v.trim()))) return 'date';
  if(present.every(v => typeof v === 'number' || (typeof v === 'string' && NUMERIC_TEXT_RE.test(v.trim().replace(/,/g,''))))) return 'number';
  return 'text';
}
// The single core every export button funnels through. headers: string[].
// rows: array of arrays of raw values (numbers, ISO date strings, or text —
// exactly what's already used throughout this file). columnTypes is
// optional; when omitted each column's type is inferred from its own
// values, so callers passing already-typed data (registerExport sites) need
// no changes at all to benefit.
function buildFormattedWorksheet(headers, rows, columnTypes, summaryRowFlags){
  const colCount = headers.length;
  const detectionRows = summaryRowFlags ? rows.filter((_,i) => !summaryRowFlags[i]) : rows;
  const types = columnTypes || Array.from({length:colCount}, (_,i) => detectColumnType(detectionRows.map(r=>r[i])));
  const isIntCol = types.map((type,i) => {
    if(type !== 'number') return false;
    return rows.every(r => {
      const v = r[i];
      if(v==null || v==='') return true;
      const n = typeof v==='number' ? v : parseFloat(String(v).replace(/,/g,''));
      return isNaN(n) || Number.isInteger(n);
    });
  });
  const aoa = [headers, ...rows.map(row => row.map((v,i) => {
    const type = types[i];
    if(v==null || v==='') return null;
    if(type === 'number'){
      const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/,/g,''));
      return isNaN(n) ? v : n;
    }
    if(type === 'date'){
      const serial = isoDateToExcelSerial(String(v));
      return serial==null ? v : serial;
    }
    return v;
  }))];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  // Auto-fit column widths from actual content length (header vs every cell
  // in that column), capped so one long description can't blow out the
  // whole sheet.
  ws['!cols'] = headers.map((h,i) => ({
    wch: Math.min(45, Math.max(String(h).length, ...rows.map(r => { const v=r[i]; return v==null?0:String(v).length; }), 6) + 2)
  }));
  // Real per-cell number/date formats (not just typed values) so Excel
  // shows thousand separators / a proper date format immediately, and the
  // column is usable in SUM()s, date math, sorts, etc. straight away.
  for(let c=0;c<colCount;c++){
    const type = types[c];
    if(type === 'text') continue;
    const fmtStr = type === 'date' ? 'dd-mm-yyyy' : (isIntCol[c] ? '#,##0' : '#,##0.00');
    for(let r=1;r<aoa.length;r++){
      const cell = ws[XLSX.utils.encode_cell({ r, c })];
      if(cell && cell.v != null) cell.z = fmtStr;
    }
  }
  // Bold white-on-navy header row (best-effort: the free/community SheetJS
  // writer used here doesn't guarantee full style fidelity in every Excel/
  // LibreOffice version, but modern Excel honors it).
  for(let c=0;c<colCount;c++){
    const cell = ws[XLSX.utils.encode_cell({ r:0, c })];
    if(cell) cell.s = { font:{ bold:true, color:{rgb:'FFFFFF'} }, fill:{ patternType:'solid', fgColor:{rgb:'1F2E3B'} } };
  }
  // Excel's built-in filter-dropdown arrows on the header row — the closest
  // native equivalent to "a dynamic, filterable table" the free writer can
  // produce reliably.
  ws['!autofilter'] = { ref: ws['!ref'] };
  return ws;
}
function exportRowsToExcel(filename, headers, rows){
  try{
    const ws = buildFormattedWorksheet(headers, rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    XLSX.writeFile(wb, filename, { cellStyles:true });
  }catch(e){ showToast(t('exportFileError') + ': ' + e.message, 4000); }
}
// Generic "export what's on screen" for ANY table on ANY page: reads the
// live DOM <table> exactly as rendered, so it automatically respects
// whatever filters/period/currency the user currently has applied — no
// per-page data wiring required — but pulls the underlying value/type back
// out of each cell (via CSS hints + ISO-date pattern matching) instead of
// just dumping the display text, so the exported file gets the same real
// typing/formatting as the structured-data path above.
function exportTableToExcel(tableEl, filename){
  try{
    const headRow = tableEl.querySelector('thead tr');
    const actionsLabel = t('actionsCol');
    const allHeaderCells = headRow ? Array.from(headRow.children) : [];
    const headers = allHeaderCells.map(th => {
      // filterableTh embeds a whole sort/filter widget (arrows, funnel icon,
      // checklist) inside the <th> — pull out just the visible column
      // label text, not that nested UI's text content.
      const label = th.querySelector('.th-sort-label');
      const raw = (label ? label.textContent : th.textContent).replace(/[▲▼]/g,'').trim();
      return raw;
    });
    // Drop action-icon columns (edit/delete pencils etc.) — never real data.
    const keepIdx = headers.map((h,i) => (h === '' || h === actionsLabel) ? -1 : i).filter(i => i !== -1);
    const filteredHeaders = keepIdx.map(i => headers[i]);
    const colCount = headers.length;
    // A row using colspan (opening-balance/total summary rows) has FEWER DOM
    // cells than header columns — a plain tr.children[i] lookup would shift
    // every value after the colspan cell into the wrong column. Expand each
    // colspan cell to occupy all the logical column slots it visually spans
    // (keeping its content in only the first of those slots) so indexing by
    // header position is always correct, colspan or not.
    function expandRowCells(tr){
      const out = [];
      Array.from(tr.children).forEach(td => {
        const span = parseInt(td.getAttribute('colspan') || '1', 10) || 1;
        out.push(td);
        for(let i=1;i<span;i++) out.push(null);
      });
      while(out.length < colCount) out.push(null);
      return out;
    }
    const bodyTrs = Array.from(tableEl.querySelectorAll('tbody tr'));
    const summaryRowFlags = bodyTrs.map(tr => tr.classList.contains('total-row'));
    const bodyRows = bodyTrs.map(tr => {
      const cells = expandRowCells(tr);
      return keepIdx.map(i => {
        const td = cells[i];
        if(!td) return '';
        const raw = td.textContent.trim();
        if(raw === '' || raw === '—') return '';
        if(ISO_DATE_RE.test(raw)) return raw;
        if(td.classList.contains('num-cell') || td.classList.contains('num')){
          const numMatch = raw.match(/^-?[\d,]+(\.\d+)?/);
          if(numMatch){
            const n = parseFloat(numMatch[0].replace(/,/g,''));
            // only treat as numeric if the WHOLE cell is that number (plain
            // amount) — cells like "100.00 USD" or a multi-line breakdown
            // stay text so the currency/extra context isn't silently lost.
            if(!isNaN(n) && numMatch[0].length === raw.length) return n;
          }
        }
        return raw;
      });
    });
    const ws = buildFormattedWorksheet(filteredHeaders, bodyRows, null, summaryRowFlags);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    XLSX.writeFile(wb, filename, { cellStyles:true });
  }catch(e){ showToast(t('exportTableError') + ': ' + e.message, 4000); }
}
function attachTableExportButtons(){
  const root = document.getElementById('viewRoot');
  if(!root) return;
  const usedNames = {};
  root.querySelectorAll('.table-wrap').forEach((wrap, tableIdx) => {
    const tableEl = wrap.querySelector('table');
    if(!tableEl || !tableEl.rows.length) return; // nothing to export
    const card = wrap.closest('.card');
    const headingEl = card ? card.querySelector('h2') : null;
    // section-title (e.g. one block per customer/partner) is more specific
    // than the card's own h2 when both exist on the same card.
    const sectionEl = wrap.previousElementSibling && wrap.previousElementSibling.classList && wrap.previousElementSibling.classList.contains('section-title')
      ? wrap.previousElementSibling : (card ? card.querySelector('.section-title') : null);
    let base = (sectionEl ? sectionEl.textContent : (headingEl ? headingEl.textContent : 'جدول')).trim();
    base = base.replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_').slice(0,60) || 'جدول';
    usedNames[base] = (usedNames[base]||0) + 1;
    const filename = (usedNames[base] > 1 ? `${base}_${usedNames[base]}` : base) + '.xlsx';
    const toolbar = document.createElement('div');
    toolbar.className = 'tbl-export-toolbar';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn btn-outline tbl-export-btn';
    btn.textContent = '⬇ ' + t('exportExcel');
    btn.addEventListener('click', () => exportTableToExcel(tableEl, filename));
    toolbar.appendChild(btn);
    wrap.parentNode.insertBefore(toolbar, wrap);
    // Table identity for saved column order: keyed by view + position on the
    // page (NOT by translated header text, so it survives language switches
    // and doesn't depend on which currency/account happens to be selected).
    attachColumnReordering(tableEl, (STATE.ui.view||'view') + '_t' + tableIdx);
  });
}
// Lets the user drag a column header left/right to reorder it — desktop
// only (native HTML5 drag-and-drop isn't a touch gesture, and dragging would
// fight with tapping the filter/sort controls already packed into each
// header on mobile). The chosen order is saved per table (STATE.ui.colOrder)
// and re-applied every render, including immediately here for the very
// table just rendered.
function attachColumnReordering(tableEl, tableKey){
  if(window.innerWidth <= 900) return;
  const headRow = tableEl.querySelector('thead tr');
  if(!headRow) return;
  const ths = Array.from(headRow.children);
  if(ths.length < 2) return;
  ths.forEach((th, i) => {
    if(!th.dataset.colKey) th.dataset.colKey = th.dataset.sortCol || ('idx_' + i);
    th.classList.add('col-draggable');
    th.draggable = true;
    // Drag should only start from the header's own background/padding, not
    // from clicking the sort label or the filter dropdown button inside it —
    // otherwise a quick click-drag on those would hijack the click.
    th.querySelectorAll('.th-sort-label, .multiselect, .ms-toggle').forEach(el => { el.draggable = false; });
  });
  const saved = STATE.ui.colOrder && STATE.ui.colOrder[tableKey];
  if(saved && saved.length) reorderTableColumns(tableEl, saved);

  let dragSrcKey = null;
  headRow.querySelectorAll('th').forEach(th => {
    th.addEventListener('dragstart', e => {
      dragSrcKey = th.dataset.colKey;
      th.classList.add('col-dragging');
      if(e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
    });
    th.addEventListener('dragend', () => th.classList.remove('col-dragging'));
    th.addEventListener('dragover', e => { e.preventDefault(); th.classList.add('col-drop-target'); });
    th.addEventListener('dragleave', () => th.classList.remove('col-drop-target'));
    th.addEventListener('drop', e => {
      e.preventDefault();
      th.classList.remove('col-drop-target');
      const targetKey = th.dataset.colKey;
      if(!dragSrcKey || dragSrcKey === targetKey) return;
      const currentOrder = Array.from(headRow.children).map(el => el.dataset.colKey);
      const from = currentOrder.indexOf(dragSrcKey);
      const to = currentOrder.indexOf(targetKey);
      if(from === -1 || to === -1) return;
      currentOrder.splice(to, 0, currentOrder.splice(from, 1)[0]);
      reorderTableColumns(tableEl, currentOrder);
      STATE.ui.colOrder = STATE.ui.colOrder || {};
      STATE.ui.colOrder[tableKey] = currentOrder;
    });
  });
}
// Physically reorders every row's cells (header + body) to match `order`
// (an array of colKey). Rows whose cell count doesn't match the header's
// column count — colspan-based opening-balance/total rows — are left as-is
// rather than risk corrupting them.
function reorderTableColumns(tableEl, order){
  const headRow = tableEl.querySelector('thead tr');
  if(!headRow) return;
  const headerCells = Array.from(headRow.children);
  const colCount = headerCells.length;
  const keyToIndex = {};
  headerCells.forEach((th,i) => { keyToIndex[th.dataset.colKey || ('idx_'+i)] = i; });
  const rows = [headRow, ...Array.from(tableEl.querySelectorAll('tbody tr'))];
  rows.forEach(row => {
    const cells = Array.from(row.children);
    if(cells.length !== colCount) return; // skip colspan summary rows
    const newCells = order.map(key => cells[keyToIndex[key]]).filter(Boolean);
    if(newCells.length !== colCount) return; // stale/unknown key — don't risk it
    newCells.forEach(cell => row.appendChild(cell));
  });
}

/* ---------- generic sort-state helper ----------
   Usage: sortRows(viewKey, rows, defaultCol) returns rows sorted per STATE.ui.sort[viewKey],
   and sortHeaderHtml(viewKey, col, label) renders a clickable <th> that toggles it. */
function getSortState(viewKey, defaultCol, defaultDir){
  STATE.ui.sort = STATE.ui.sort || {};
  if(!STATE.ui.sort[viewKey]) STATE.ui.sort[viewKey] = { col: defaultCol, dir: defaultDir || 'asc' };
  return STATE.ui.sort[viewKey];
}
function toggleSort(viewKey, col){
  const s = getSortState(viewKey, col);
  if(s.col === col) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
  else { s.col = col; s.dir = 'asc'; }
  renderApp();
}
function applySort(viewKey, rows, accessor){
  const s = getSortState(viewKey, null);
  if(!s.col) return rows;
  const sorted = rows.slice().sort((a,b) => {
    const va = accessor(a, s.col), vb = accessor(b, s.col);
    if(va == null && vb == null) return 0;
    if(va == null) return 1;
    if(vb == null) return -1;
    if(typeof va === 'string') return va.localeCompare(vb, 'ar');
    return va - vb;
  });
  if(s.dir === 'desc') sorted.reverse();
  return sorted;
}
function sortTh(viewKey, col, label, extraClass){
  const s = getSortState(viewKey, null);
  const active = s.col === col;
  const arrow = active ? (s.dir === 'asc' ? ' ▲' : ' ▼') : '';
  return `<th class="sortable-th${extraClass?' '+extraClass:''}" data-sort-view="${viewKey}" data-sort-col="${col}">${label}${arrow}</th>`;
}
function attachSortEvents(){
  document.querySelectorAll('[data-sort-view]').forEach(th => th.addEventListener('click', () => {
    toggleSort(th.dataset.sortView, th.dataset.sortCol);
  }));
}

/* ---------- Excel-style table header: sort + per-column value filter ----------
   filterableTh() renders a header that combines the existing click-to-sort
   label with a compact funnel-icon dropdown (built on the same multiSelectHtml
   component used everywhere else) offering Sort Ascending/Descending plus a
   searchable checklist of every distinct value in that column — i.e. the
   same interaction Excel's AutoFilter offers. Column-filter selections are
   kept in STATE.ui.colFilters[colFilterId], a plain array (empty = show all,
   same convention as every other filter in the app). getColFilterValues()
   applies it; callers just need to pass an accessor for the raw value. */
function getColFilterValues(colFilterId){
  return (STATE.ui.colFilters && STATE.ui.colFilters[colFilterId]) || [];
}
function passesColFilter(colFilterId, rawValue){
  const sel = getColFilterValues(colFilterId);
  if(sel.length === 0) return true;
  return sel.some(v => String(v) === String(rawValue));
}
function filterableTh(viewKey, col, label, colFilterId, values, opts){
  opts = opts || {};
  const s = getSortState(viewKey, null);
  const active = s.col === col;
  const arrow = active ? (s.dir === 'asc' ? ' ▲' : ' ▼') : '';
  const uniqueValues = uniq(values.filter(v => v !== '' && v != null));

function bindColFilterHandler(colFilterIds){

/* ---------- multi-select dropdown ----------
   Renders a compact "N selected" button that expands a checklist panel.
   State is a plain array kept on the caller's side; this only renders markup + wires events. */
function codeInGroupRange(code, g){
  const len = g.start.length;
  const prefix = code.slice(0, len);
  return prefix.length === len && prefix >= g.start && prefix <= g.end;
}

// Build a genuine N-level hierarchy from account.group prefix data: each group's
// parent is the group with the longest shorter prefix that contains it, and each
// account attaches as a leaf under the deepest group whose prefix matches its code.
function buildAccountTree(){
  const groups = STATE.groups.slice().sort((a,b)=>a.start.length-b.start.length || a.start.localeCompare(b.start));
  const activeAccounts = accountsWithActivity();
  const nodes = {};
  groups.forEach(g => { nodes[g.start] = { key:'g:'+g.start, type:'group', name:groupDisplayName(g), code:g.start, start:g.start, end:g.end, children:[], accounts:[] }; });
  const roots = [];
  groups.forEach(g => {
    const node = nodes[g.start];
    let bestParent = null;
    groups.forEach(p => {
      if(p.start.length < g.start.length && g.start.length > 0 && g.start.slice(0,p.start.length) >= p.start && g.start.slice(0,p.start.length) <= p.end){
        if(!bestParent || p.start.length > bestParent.start.length) bestParent = p;
      }
    });
    if(bestParent) nodes[bestParent.start].children.push(node);
    else roots.push(node);
  });
  const unclassified = { key:'g:unclassified', type:'group', name:t('unclassifiedAccountsGroup'), code:'', children:[], accounts:[] };
  activeAccounts.forEach(a => {
    let best = null;
    groups.forEach(g => { if(codeInGroupRange(a.code, g)){ if(!best || g.start.length > best.start.length) best = g; } });
    if(best) nodes[best.start].accounts.push(a);
    else unclassified.accounts.push(a);
  });
  function sortNode(n){
    n.children.sort((a,b)=>a.start.localeCompare(b.start));
    n.accounts.sort((a,b)=>a.code.localeCompare(b.code));
    n.children.forEach(sortNode);
  }
  roots.sort((a,b)=>a.start.localeCompare(b.start));
  roots.forEach(sortNode);
  if(unclassified.accounts.length) roots.push(unclassified);
  // Companion to the active-accounts filter above: once inactive accounts are
  // stripped out, some group branches end up with nothing under them at all —
  // prune those instead of showing an empty "(0)" group header.
  function hasAnyAccounts(node){
    if(node.accounts.length) return true;
    return node.children.some(hasAnyAccounts);
  }
  function prune(node){
    node.children = node.children.filter(hasAnyAccounts);
    node.children.forEach(prune);
  }
  const nonEmptyRoots = roots.filter(hasAnyAccounts);
  nonEmptyRoots.forEach(prune);
  return nonEmptyRoots;
}

// Collect every account code under a tree node (recursively) — used so that
// checking a group's checkbox selects/deselects every account beneath it.
function collectTreeAccountCodes(node){
  let codes = node.accounts.map(a=>a.code);
  node.children.forEach(c => { codes = codes.concat(collectTreeAccountCodes(c)); });
  return codes;
}
const TREE_CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l7 8-7 8"/></svg>';
const TREE_ICON_GROUP = '<svg class="tree-icon tree-icon-group" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="13" height="13"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7z"/></svg>';
const TREE_ICON_LEAF = '<svg class="tree-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="12" height="12"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';
function renderTreeNode(node, selected, depth){

  const selectedCount = labels.filter(l=>selected.includes(l)).length;
  const allChecked = nothingExplicitlySelected || (labels.length > 0 && selectedCount === labels.length);
  const someChecked = !nothingExplicitlySelected && selectedCount > 0 && !allChecked;

      <div class="tree-row">

        <label class="ms-item" style="flex:1">
          <input type="checkbox" class="ms-group-cb" data-codes="${escapeHtml(labels.join('||'))}" ${allChecked?'checked':''} ${someChecked?'data-indeterminate="1"':''}>
          ${TREE_ICON_GROUP}
          <b>${escapeHtml(node.name)}</b> <span class="hint">(${labels.length})</span>
        </label>
      </div>
      <div class="tree-children ${expanded?'tree-children-expanded':''}" id="${nodeId}">
        ${node.children.map(c => renderTreeNode(c, selected, depth+1)).join('')}
        ${node.accounts.map(a => {
          const label = `${a.code} — ${accName(a.code)}`;
          const isSel = nothingExplicitlySelected || selected.includes(label);
          return `<div class="tree-node ${isSel?'tree-node-selected':''}" style="margin-right:${(depth+1)*18}px">
            <div class="tree-row">
              <span class="tree-toggle-spacer"></span>
              <label class="ms-item" data-ms-item-text="${escapeHtml(label.toLowerCase())}" style="flex:1">
                <input type="checkbox" class="ms-leaf" value="${escapeHtml(label)}" ${isSel?'checked':''}> ${TREE_ICON_LEAF} ${escapeHtml(label)}

function multiSelectHtml(id, label, options, selected, opts){
  opts = opts || {};
  const isAccountList = !!opts.isAccounts;
  const disp = opts.displayLabel || (o => o); // e.g. translates journal/book names for display only
  // BUG FIX (None button appeared to do nothing): an empty `selected` array is
  // the default "no filter set yet / show everything" state, so a NEVER
  // TOUCHED filter should render with every box checked. But once the user
  // has explicitly changed the selection (most importantly, pressed "None"),
  // an empty array means "user picked nothing" and must render as nothing
  // checked — otherwise every checkbox snaps right back to checked on the
  // very next render, making None look broken. STATE.ui.msTouched tracks
  // that distinction (see attachMultiSelectEvents, which sets it centrally
  // for every mutation path: None/All/leaf click/group click/search commit).
  const touched = !!(STATE.ui.msTouched && STATE.ui.msTouched[id]);
  const untouchedEmpty = selected.length === 0 && !touched;
  const allSelected = untouchedEmpty || selected.length === options.length;
  const summary = allSelected ? t('all') : (selected.length === 0 ? t('none') : selected.length === 1 ? disp(selected[0]) : `${selected.length} ${t('selectedCountSuffix')}`);
  const stayOpen = STATE.ui.openMultiSelect === id;
  const useTree = isAccountList && opts.tree;
  const isActive = selected.length > 0 && !untouchedEmpty; // for the compact "Excel-style" header icon: is a real (non-default) filter applied?
  const toggleBtn = opts.iconOnly
    ? `<button type="button" class="ms-toggle th-filter-icon${isActive?' active':''}" data-ms="${id}" title="${escapeHtml(label)}">${ICONS.filterFunnel}</button>`
    : `<button type="button" class="input ms-toggle" data-ms="${id}" style="text-align:right;min-width:170px">${escapeHtml(summary)} ▾</button>`;
  const sortRow = opts.sortConfig ? (() => {
    const s = getSortState(opts.sortConfig.viewKey, null);
    const isAsc = s.col === opts.sortConfig.col && s.dir === 'asc';
    const isDesc = s.col === opts.sortConfig.col && s.dir === 'desc';
    return `<div class="ms-panel-actions">
      <button type="button" class="chip${isAsc?' active':''}" data-sort-set="${opts.sortConfig.viewKey}|${opts.sortConfig.col}|asc">${t('sortAscBtn')}</button>
      <button type="button" class="chip${isDesc?' active':''}" data-sort-set="${opts.sortConfig.viewKey}|${opts.sortConfig.col}|desc">${t('sortDescBtn')}</button>
    </div>`;
  })() : '';
  return `
    <div class="multiselect${opts.iconOnly?' multiselect-icon-only':''}" id="${id}">
      ${opts.iconOnly ? '' : `<label class="lbl">${label}</label>`}
      ${toggleBtn}
      <div class="ms-panel" id="${id}_panel" style="display:${stayOpen?'block':'none'}">
        ${sortRow}
        <input type="text" class="input ms-search" data-ms-search="${id}" value="${escapeHtml((STATE.ui.msSearchQuery && STATE.ui.msSearchQuery[id]) || '')}" placeholder="${t('searchPlaceholder')}" style="width:100%;margin-bottom:6px;box-sizing:border-box">
        <div class="ms-panel-actions">
          <button type="button" class="chip" data-ms-all="${id}">${t('all')}</button>
          <button type="button" class="chip" data-ms-none="${id}">${t('none')}</button>
          ${isAccountList ? `<button type="button" class="chip" data-ms-tree-toggle="${id}">${useTree?(STATE.settings.lang==='en'?'Show as list':'عرض كقائمة'):(STATE.settings.lang==='en'?'Show as tree':'عرض كشجرة')}</button>` : ''}
          <button type="button" class="chip" data-ms-done="${id}" style="margin-right:auto;background:var(--gold);color:var(--ink);border-color:var(--gold)">${t('done')}</button>
        </div>
        ${stayOpen ? (useTree ? `
          <div class="ms-items" data-ms-items="${id}">
            ${buildAccountTree().map(n => renderTreeNode(n, selected, 0)).join('')}
          </div>
        ` : `
          <div class="ms-items" data-ms-items="${id}">
            ${options.map(o => `<label class="ms-item" data-ms-item-text="${escapeHtml(disp(o).toLowerCase())}"><input type="checkbox" class="ms-leaf" value="${escapeHtml(o)}" ${(untouchedEmpty || selected.some(v=>String(v)===String(o)))?'checked':''}> ${escapeHtml(disp(o))}</label>`).join('')}

}
function attachMultiSelectEvents(onChange){

  // of touching each call site, is enough to mark msTouched[id] for all of
  // them. See multiSelectHtml/renderTreeNode for what this fixes.

    e.stopPropagation();

    const isOpen = panel.style.display !== 'none';

    } else {

    target.classList.toggle('tree-children-expanded', !isOpen);

    STATE.ui.treeExpanded[btn.dataset.treeToggle] = !isOpen;

  //  - syncVisibleAsChecked: purely visual — toggles checkboxes to match what's

  //  - commitSelection: pushes the checked values into STATE via onChange

  //

  // called onChange() directly from the 'input' handler on every keystroke.
  // Every onChange handler in this app calls renderApp(), which rebuilds the

  // always empty, so anything just typed vanished immediately, making the
  // field look broken (only the debounced, value-bound Description search was
  // exempt, since it doesn't re-render on every keystroke). Separating "live

  // the checkbox — so `closest()` picked the label, whose own inline
  // `style.display` the search filter never touches (the filter sets

  // filtering above). Reading the wrong element's display always reported

  // every account instead of just the match. Flat (non-tree) lists have no

    });
    panel.querySelectorAll('input.ms-group-cb').forEach(cb => {

  }

    if(closePanel){ STATE.ui.openMultiSelect = null; renderApp(); }
  }

  // BUG FIX (filter list jumps back to top / loses its search results when
  // you click a checkbox): clicking any checkbox — including one of several
  // same-named search matches — commits immediately via onChange() and
  // renderApp() rebuilds the whole panel from scratch. The rebuilt panel had
  // no memory of what was typed, so the search box came back empty and the
  // FULL unfiltered list reappeared; the old scroll position then pointed at
  // a completely different row in that much-longer list, which looked like
  // the list "jumped". Fix: persist the query in STATE.ui.msSearchQuery,
  // rebind the input's value from it (see multiSelectHtml), and reapply the

    if(!container) return;

      const row = el.closest('.tree-node') || el;
      row.style.display = match ? '' : 'none';
    });

    allNodes.forEach(node => {

      if(!ownLabel || ownLabel.dataset.msItemText) return; // not a group header row — already handled above

      }

  document.querySelectorAll('[data-ms-all]').forEach(btn => btn.addEventListener('click', () => {
    const panel = document.getElementById(btn.dataset.msAll + '_panel');
    panel.querySelectorAll('input.ms-leaf').forEach(cb => { if(rowElFor(cb).style.display !== 'none') cb.checked = true; });
    panel.querySelectorAll('input.ms-group-cb').forEach(cb => cb.checked = true);
    STATE.ui.openMultiSelect = btn.dataset.msAll;
    onChange(btn.dataset.msAll, [...panel.querySelectorAll('input.ms-leaf:checked')].map(cb=>cb.value));
  }));
  document.querySelectorAll('[data-ms-none]').forEach(btn => btn.addEventListener('click', () => {
    const panel = document.getElementById(btn.dataset.msNone + '_panel');
    panel.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
    STATE.ui.openMultiSelect = btn.dataset.msNone;
    onChange(btn.dataset.msNone, []);
  }));
  document.querySelectorAll('[data-ms-done]').forEach(btn => btn.addEventListener('click', () => {
    const id = btn.dataset.msDone;
    const panel = document.getElementById(id + '_panel');
    const searchInp = panel ? panel.querySelector(`[data-ms-search="${id}"]`) : null;
    const hasQuery = !!(searchInp && searchInp.value.trim() !== '');
    // Live typing already synced the checkboxes visually; Done now performs
    // the actual commit (this is the first onChange call for this session of
    // typing, so no earlier keystroke render ever happened).
    if(panel && hasQuery){ commitSelection(id, false); }
    if(STATE.ui.msSearchQuery) delete STATE.ui.msSearchQuery[id];
    STATE.ui.openMultiSelect = null;
    renderApp();
  }));
  document.querySelectorAll('[data-ms-group]').forEach(btn => btn.addEventListener('click', () => {
    const id = btn.dataset.msGroup;
    const g = { start: btn.dataset.groupStart, end: btn.dataset.groupEnd };
    const panel = document.getElementById(id + '_panel');

      const code = cb.value.split(' — ')[0];
      if(codeInGroupRange(code, g)) cb.checked = true;
    });

    onChange(id, [...panel.querySelectorAll('input.ms-leaf:checked')].map(cb=>cb.value));
  }));

    const labels = cb.dataset.codes ? cb.dataset.codes.split('||').filter(Boolean) : [];
